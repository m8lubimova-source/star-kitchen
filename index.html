 даёт сочность"},{"g":15,"id":"baton_loaf","note":"батон недели, можно без корок"},{"g":25,"id":"milk_25","note":"размочить батон"},{"id":"egg","note":"в фарш","pcs":0.17},{"g":2,"id":"garlic","note":"на мелкой тёрке"},{"g":1,"id":"sunflower_oil","note":"смазать верх котлет; на весь противень 1 ч. л."},{"g":2,"id":"salt","note":""},{"g":0.2,"id":"black_pepper","note":"молотый"},{"g":0.4,"id":"oregano","note":"в фарш; мягкая специя, не острая"},{"g":0.4,"id":"coriander_ground","note":"в фарш; мягкая специя, не острая"},{"g":1,"id":"paprika_sweet","note":"в фарш; мягкая специя, не острая"},{"g":0.3,"id":"pepper_mix","note":"щепоткой в фарш, Серёже поменьше; мягкая специя, не острая"}],"keeps_d":3,"light":"Вместо жирного свино-говяжьего «Домашнего» фарша (27 г жира на 100 г) — постный говяжий (7,5 г) пополам с куриным из грудки (10 г): вкус мясных котлет остаётся, а жира почти втрое меньше. Котлеты запекаются на пергаменте, а не жарятся: масла около 1 г на порцию вместо 10–15 г при жарке, котлеты поливают только бульоном с противня без жира. Размоченный в молоке 2,5 % батон и много лука делают котлеты сочными; без майонеза в фарше.","mode":"cook","name":"Котлеты из говядины и курицы в духовке","notes":"С гречкой. Оба фарша покупать в день готовки: сырой фарш хранится 1 день, остаток пачки сразу заморозить сырым. Батон — общий батон недели. Если фарша вышло чуть больше или меньше, слепи котлеты чуть крупнее или мельче, остальные продукты не меняй.","portion":{},"reheat":"Котлеты в тарелке сбрызнуть 1 ст. л. воды, накрыть крышкой и греть в микроволновке 1,5–2 мин на 800 Вт (вместе с гречкой 2–3 мин), на середине перевернуть. Из морозилки: микроволновка 2–3 мин под крышкой или сковорода без масла под крышкой 5–6 мин; сверху ложка бульона или воды, чтобы не пересохли.","role":"main","steps":[{"active":true,"eq":["stove","freezer"],"est":true,"info":false,"min":1,"min_text":null,"t":"Пекутся в день первого приёма (обычно вечером, пока на плите варится гречка). Вес фарша и остальных продуктов на всю партию — в таблице «Вся партия»: лепи котлеты только из этого количества. Фарш купи в день готовки; если в пачке больше нужного — остаток сырого фарша сразу заморозь плоско в пакете.","when":"day_of"},{"active":false,"eq":["bowl"],"est":false,"info":false,"min":10,"min_text":10,"t":"Батон поломайте кусочками в миску (корки можно срезать), залейте молоком и оставьте на 10 мин, затем разомните вилкой в кашицу.","when":"day_of"},{"active":true,"eq":["grater","blender"],"est":true,"info":false,"min":1,"min_text":null,"t":"Лук и чеснок очистите и натрите на мелкой тёрке или измельчите погружным блендером в кашицу: котлеты будут сочными, а кусочков лука не будет видно.","when":"day_of"},{"active":true,"eq":["bowl"],"est":true,"info":false,"min":1,"min_text":3,"t":"В большой миске соедините оба фарша, батон с молоком, лук с чесноком, яйцо, соль и перец. Вымешивайте рукой 2–3 мин, пока два фарша полностью не соединятся в однородную массу. Затем 10–15 раз отбейте фарш: поднимите весь комок и с силой бросьте обратно в миску. Так котлеты не развалятся и будут сочнее. Масса с куриным фаршем мягче обычной — это нормально.","when":"day_of"},{"active":true,"eq":["oven"],"est":true,"info":false,"min":1,"min_text":null,"t":"Включите духовку на 200 °C (режим верх-низ). Застелите противень пергаментом.","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":15,"min_text":60,"t":"Смочите руки холодной водой и сформируйте котлеты толщиной около 2 см (по ~90 г). Выложите на пергамент с промежутками 1–2 см. Смажьте верх котлет 1 ч. л. масла на все (пальцами или кисточкой), чтобы появилась румяная корочка.","when":"day_of"},{"active":false,"eq":["oven"],"est":false,"info":false,"min":20,"min_text":20,"t":"Запекайте на среднем уровне 20 мин, пока верх не подрумянится.","when":"day_of"},{"active":false,"eq":["oven"],"est":false,"info":false,"min":10,"min_text":10,"t":"Достаньте противень, влейте на пергамент между котлетами около 100 мл горячей воды, накройте фольгой и верните в духовку ещё на 10 мин. Котлеты дойдут в пару и останутся сочными, в том числе после разогрева.","when":"day_of"},{"active":true,"eq":["board"],"est":true,"info":false,"min":1,"min_text":null,"t":"Проверьте готовность: проткните самую толстую котлету ножом. Сок должен быть прозрачным, а мясо внутри серым, без розового. Фарш с курицей должен пропечься полностью.","when":"day_of"},{"active":false,"eq":["fridge","container"],"est":false,"info":false,"min":30,"min_text":30,"t":"Если едите сразу — подайте с гречкой и сметаной. Остальные котлеты остудите 30 мин и сложите в контейнер. Сок с противня слейте в чашку, дайте постоять 2–3 мин и наберите ложкой 3–4 ст. л. бульона снизу, без жёлтого жира с поверхности. Полейте им котлеты и уберите контейнер в холодильник (на работе разогреть 1,5–2 мин под крышкой). Жир с пергамента выбросьте.","when":"day_of"},{"active":false,"eq":["freezer","container"],"est":false,"freeze_step":true,"info":true,"min":0,"min_text":null,"t":"Заморозка (котлеты): порции, которые не съедят в ближайшие 3 суток, сразу уйдут в морозилку. Остуди (не дольше 2 часов на столе), разложи по порциям в плоские зип-пакеты или контейнеры: одна порция = один приём пищи одного человека, на пакете подпиши блюдо и дату. Пакеты клади в морозилку плоско, после замерзания ставь стопкой или на ребро. Срок в морозилке — до 21 суток. Накануне вечером переложи нужную порцию из морозилки на полку холодильника (на ночь), утром она готова к разогреву. Если забыла — микроволновка в режиме разморозки 5–6 мин.","when":"day_of"}],"storage":"Готовишь большой партией. В холодильнике в закрытом контейнере до 3 суток — столько, сколько съедят в ближайшие приёмы; остальное сразу после остывания в морозилку (до 21 суток). Заморозка: Остуди (не дольше 2 часов на столе), разложи по порциям в плоские зип-пакеты или контейнеры: одна порция = один приём пищи одного человека, на пакете подпиши блюдо и дату. Пакеты клади в морозилку плоско, после замерзания ставь стопкой или на ребро.  Накануне вечером переложи нужную порцию из морозилки на полку холодильника (на ночь), утром она готова к разогреву. Если забыла — микроволновка в режиме разморозки 5–6 мин.","tags":["work_ok","oven"],"total_min":55},"lazy_khachapuri":{"active_min":10,"base":{"c":25.3,"f":15.2,"g":155,"kcal":318,"p":20.1},"batch":{"cook":"same_day","keeps_d":1,"mode":"cook"},"eq":["board","bowl","grater","pan","stove"],"eq_text":["плита","сковорода 24–26 см с крышкой","пергамент (2 листа)","плоская тарелка шире сковороды","миска","вилка","крупная тёрка","лопатка"],"in_menu":true,"ing":[{"id":"egg","note":"","pcs":1},{"g":50,"id":"yogurt","note":"питьевой натуральный без сахара и добавок"},{"g":30,"id":"wheat_flour","note":""},{"g":40,"id":"suluguni","note":"на крупной тёрке, 2 ст. л. отложить на верх"},{"g":1,"id":"baking_powder","note":""},{"g":2,"id":"dill","note":"мелко"}],"keeps_d":1,"light":"Без масла: лепёшка печётся на пергаменте под крышкой; вместо дрожжевого теста на сливочном масле — быстрое тесто на питьевом йогурте 2,9 %; сулугуни 40 г на порцию — сыр в тесте и тонкий слой сверху, а не «лодочка» с маслом.","mode":"cook","name":"Ленивые хачапури с сулугуни","notes":"Мягко, без острого. Сулугуни — кусок по весу; вскрытый хранится до 5 дней. Остаток сразу натри, разложи порциями по пакетам и заморозь: тёртый сыр можно класть в тесто прямо из морозилки. Йогурт — натуральный питьевой без добавок, не греческий.","portion":{},"reheat":"Микроволновка 40–50 с на 800 Вт под неплотной крышкой.","role":"breakfast","steps":[{"active":false,"eq":[],"est":false,"info":true,"min":0,"min_text":null,"t":"Готовится утром на двоих одной лепёшкой за 25 мин, из них активно 10. Вес её и его порции — в таблице.","when":"day_of"},{"active":true,"eq":["board","grater"],"est":true,"info":false,"min":0,"min_text":null,"t":"Сулугуни натри на крупной тёрке, 2 ст. л. отложи для верха. Укроп мелко порежь.","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":0,"min_text":null,"t":"Яйца взбей вилкой с йогуртом, всыпь муку с разрыхлителем, перемешай до гладкости, добавь сыр и укроп. Тесто густое, как сметана. Соль не нужна: сулугуни солёный.","when":"day_of"},{"active":true,"eq":["pan"],"est":true,"info":false,"min":0,"min_text":1,"t":"Уложи в сковороду скомканный и расправленный пергамент, прогрей на огне чуть ниже среднего 1 мин. Выложи тесто и разровняй ложкой в круг толщиной ~1,5 см.","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":8,"min_text":10,"t":"Накрой крышкой, убавь огонь до слабого и готовь 8–10 мин: верх схватился и стал матовым, низ золотистый.","when":"day_of"},{"active":true,"eq":["pan"],"est":true,"info":false,"min":0,"min_text":null,"t":"Накрой сковороду тарелкой и переверни лепёшку на неё. Положи в сковороду новый лист пергамента и сдвинь лепёшку обратно румяной стороной вверх. Посыпь отложенным сыром.","when":"day_of"},{"active":true,"eq":["stove"],"est":true,"info":false,"min":2,"min_text":5,"t":"Накрой крышкой и держи ещё 4–5 мин на слабом огне, пока низ не подрумянится, а сыр сверху не расплавится.","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":0,"min_text":2,"t":"Дай постоять 2 мин и разрежь на сектора по весу из таблицы.","when":"day_of"}],"storage":"Лучше есть тёплым сразу. Остаток или порция в контейнер — в холодильнике до 2 суток.","tags":["work_ok"],"total_min":25},"mexican_chicken":{"active_min":25,"base":{"c":15.2,"f":8.5,"g":290,"kcal":289,"p":39.2},"batch":{"cook":"evening_before","keeps_d":3,"mode":"cook"},"eq":["board","bowl","container","fridge","grater","pan","stove"],"eq_text":["плита","сковорода 26–28 см с крышкой","миска","лопатка","нож и доска","мелкая тёрка","контейнеры с крышками"],"in_menu":true,"ing":[{"g":160,"id":"chicken_fillet","note":"филе грудки, полосками 1×5 см"},{"g":80,"id":"bell_pepper","note":"сладкий, лучше двух цветов, полосками 1 см"},{"g":35,"id":"onion","note":"полукольцами"},{"g":25,"id":"corn_canned","note":"без жидкости"},{"g":2,"id":"garlic","note":"на мелкой тёрке"},{"g":1,"id":"smoked_paprika","note":""},{"g":1,"id":"paprika_sweet","note":""},{"g":0.4,"id":"cumin","note":"зира молотая (или растереть в ступке в порошок, чтобы не было целых семян)"},{"g":6,"id":"lemon","note":"сок, в конце"},{"g":1.5,"id":"potato_starch","note":"для глянцевого соуса"},{"g":1.1,"id":"sunflower_oil","note":"в маринад"},{"g":15,"id":"sour_cream_15","note":"к подаче, ложкой сверху"},{"g":1.5,"id":"salt","note":""},{"g":0.4,"id":"oregano","note":"к курице; мягкая специя, не острая"},{"g":0.5,"id":"coriander_ground","note":"к курице; мягкая специя, не острая"},{"g":1,"id":"chicken_seasoning","note":"к курице вместо части соли; в смеси может быть соль, пробуй до досаливания"}],"keeps_d":3,"light":"Вместо фахитос с тортильей, сыром и гуакамоле — курица с большим количеством перца; масла 1 ч. л. на всю партию, курица быстро обжаривается на раскалённой сковороде. Соус без томатов и сливок: специи, сок овощей и крахмал. Кукурузы немного — для вкуса, а не для объёма. Вместо сырного соуса — ложка сметаны 15 %.","mode":"cook","name":"Курица по-мексикански со сладким перцем и кукурузой","notes":"Подавать с рисом (рецепт «Рис отварной»): томатного соуса нет, поэтому с рисом можно. Кукуруза: брать минимальную банку; остаток без жидкости — в закрытой стеклянной таре в холодильнике до 2–3 дней. Порции подгоняет программа.","portion":{"her":{"max_g":300}},"reheat":"Под неплотной крышкой с 1 ст. л. воды, микроволновка 2 мин на 800 Вт вместе с рисом; сметану положить после разогрева.","role":"main","steps":[{"active":false,"eq":[],"est":false,"info":true,"min":0,"min_text":null,"t":"Готовится вечером накануне или в день первого приёма (на ужин или партией на 2 приёма), рис — отдельным компонентом. Вес продуктов на всю партию — в таблице «Вся партия».","when":"day_of"},{"active":false,"eq":["bowl"],"est":false,"info":false,"min":10,"min_text":10,"t":"В миске смешай курицу с маслом, обеими паприками, зирой, чесноком и солью. Острый перец не добавляем (у него гастрит): «мексиканский» вкус дают копчёная паприка, зира и лимон. Оставь на 10 мин, пока режешь овощи.","when":"day_of"},{"active":true,"eq":["pan","stove","bowl"],"est":true,"info":false,"min":6,"min_text":3,"t":"Прогрей сковороду на сильном огне 2 мин. Выложи курицу одним слоем (если не помещается — в два приёма) и жарь 2 мин не трогая, затем перемешай и жарь ещё 2–3 мин, пока полоски не побелеют. Переложи в миску.","when":"day_of"},{"active":true,"eq":["pan","stove"],"est":true,"info":false,"min":11,"min_text":5,"t":"В ту же сковороду выложи лук и перец, добавь 3 ст. л. воды и готовь на сильном огне 4–5 мин, помешивая: перец должен стать мягче, но остаться хрустящим, соки со дна соберут специи.","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":4,"min_text":2,"t":"Верни курицу, добавь кукурузу. Крахмал размешай в 100 мл холодной воды и влей, помешивая. Прогревай 2 мин, пока соус не станет глянцевым и не обволочёт курицу. Курица готова, если крупная полоска белая внутри.","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":4,"min_text":null,"t":"Сними с огня, полей лимонным соком и перемешай. Попробуй и досоли.","when":"day_of"},{"active":false,"eq":["fridge","container"],"est":true,"info":false,"min":10,"min_text":30,"t":"Разложи по контейнерам рядом с рисом, остуди без крышки 20–30 мин и убери в холодильник. Сметану держи отдельно (в маленькой баночке) и клади ложкой сверху после разогрева.","when":"day_of"}],"storage":"В холодильнике в закрытых контейнерах до 2 суток (до 3 при необходимости). Сметану — отдельно.","tags":["work_ok"],"total_min":35},"myaso_fr_chicken":{"active_min":30,"base":{"c":7.7,"f":12,"g":230,"kcal":312,"p":43.1},"batch":{"cook":"evening_before","keeps_d":3,"mode":"cook"},"eq":["board","bowl","container","fridge","grater","oven","pot"],"eq_text":["духовка","противень или форма ~30×40 см (или две формы поменьше)","пергамент","скалка или донышко кастрюли для отбивания","пищевая плёнка или пакет","крупная тёрка","нож и доска","миска","контейнеры с крышкой"],"in_menu":true,"ing":[{"g":160,"id":"chicken_fillet","note":"охлаждённое филе грудки; на противень из 6 порций ≈1 кг"},{"g":40,"id":"onion","note":"тонкими полукольцами; на 6 порций 2 средние луковицы"},{"g":50,"id":"tomato","note":"кружками 0,5 см; на 6 порций 3 средних помидора"},{"g":10,"id":"sour_cream_15","note":"тонкий слой соуса вместо майонеза, ≈2 ч. л. на кусок; на 6 порций 60 г (3 ст. л.)"},{"g":2,"id":"garlic","note":"в сметанный соус; на 6 порций 2–3 зубчика"},{"g":30,"id":"mozzarella","note":"натереть на крупной тёрке; на 6 порций ≈180 г из пачки 200 г"},{"g":1.5,"id":"salt","note":""},{"g":0.2,"id":"black_pepper","note":""},{"g":0.3,"id":"paprika_sweet","note":"для цвета и аромата"},{"g":0.5,"id":"coriander_ground","note":"в маринад; мягкая специя, не острая"},{"g":0.3,"id":"thyme","note":"в маринад; мягкая специя, не острая"},{"g":1.5,"id":"chicken_seasoning","note":"в маринад вместо части соли; в смеси может быть соль, пробуй до досаливания"}],"keeps_d":3,"light":"Куриное филе вместо свинины. Сметаны 15 % с чесноком всего ≈2 ч. л. на кусок, тонким слоем, вместо майонеза и без горчицы: сочность дают лук и помидор. Моцарелла ≈30 г на порцию. Картофель в противень не кладём, гарнир идёт отдельно. Запекается на пергаменте без масла, мясо не жарится.","mode":"cook","name":"Мясо по-французски с курицей","notes":"Гарнир отдельными партиями: рис (Пн–Вт 1-й недели) и тёплые овощи (Вс 28-го дня). Моцарелла в 4-й неделе используется только здесь: на противень ≈180 г из пачки 200 г (≈30 г на порцию). Сметана из той же пачки 300 г, что к сырникам на завтрак в Вс. Курицу охлаждённую купить в Сб или Вс. Блюдо хорошо переносит хранение и разогрев, при желании его можно взять и в контейнер.","portion":{},"reheat":"Микроволновка 2–3 минуты при 600–700 Вт под неплотно закрытой крышкой, можно сбрызнуть 1 ч. л. воды, чтобы курица не пересохла. Или духовка 160 °C, 10–12 минут под фольгой.","role":"main","steps":[{"active":false,"eq":["oven"],"est":false,"info":true,"min":0,"min_text":null,"t":"Партия: один противень на 6 порций, печётся в Вс вечером 28-го дня. Он идёт на ужин Вс и на ужины Пн и Вт 1-й недели следующего цикла, по порции ей и ему каждый вечер. В самый первый месяц противень пекут в Вс накануне старта только на 4 порции (Пн–Вт), то есть берут две трети от закладки на 6 порций: филе ≈650 г, лук ≈160 г, помидоры ≈200 г (2 средних), сметана 40 г (2 ст. л.), чеснок 2 зубчика, моцарелла ≈120 г. Оставшиеся ≈80 г моцареллы плотно заверните в плёнку: они пойдут в рулетики из лаваша в Ср (после вскрытия моцарелла живёт 5 дней).","when":"day_of"},{"active":true,"eq":["oven"],"est":true,"info":false,"min":1,"min_text":null,"t":"Включите духовку на 200 °C (режим верх-низ). Застелите форму пергаментом: масло не нужно, курица не прилипнет.","when":"day_of"},{"active":true,"eq":["pot","board"],"est":true,"info":false,"min":1,"min_text":null,"t":"Филе (≈960 г) промокните бумажным полотенцем и срежьте плёнки. Каждую грудку положите на доску и разрежьте вдоль на 2 пласта толщиной 1–1,5 см. Накройте плёнкой или пакетом и слегка отбейте скалкой или донышком кастрюли до толщины около 1 см. Тогда курица пропечётся равномерно и не пересохнет.","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":14,"min_text":60,"t":"Посолите (около 1 ч. л. соли на всё мясо), поперчите с двух сторон и посыпьте паприкой. Выложите пласты в форму в один слой, плотно друг к другу: так они меньше теряют сок.","when":"day_of"},{"active":true,"eq":["board"],"est":true,"info":false,"min":1,"min_text":null,"t":"Лук нарежьте тонкими полукольцами и распределите по мясу. Сверху положите кружки помидоров по одному-два на каждый кусок и чуть посолите. Лук и помидор дают сок, поэтому много сметаны не нужно.","when":"day_of"},{"active":true,"eq":["bowl"],"est":true,"info":false,"min":12,"min_text":120,"t":"Сметанный соус: в миске смешайте 60 г сметаны 15 % (3 ст. л.), чеснок, раздавленный через пресс или мелко порубленный, и щепотку соли. Тонко смажьте каждый кусок сверху поверх помидоров (≈2 ч. л. на кусок).","when":"day_of"},{"active":true,"eq":["grater"],"est":true,"info":false,"min":1,"min_text":null,"t":"Натрите моцареллу на крупной тёрке (≈180 г на 6 порций) и равномерно посыпьте все куски. Оставшийся кусочек ≈20 г тоже можно натереть сверху, чтобы не держать вскрытую пачку.","when":"day_of"},{"active":false,"eq":["oven","board"],"est":false,"info":false,"min":30,"min_text":30,"t":"Запекайте на средней полке 25–30 минут, пока сыр не станет золотистым. Первый раз проверьте на 25-й минуте: тонкое отбитое филе быстро пересыхает, а 4 порции ещё будут разогреваться. Проверьте готовность: проколите ножом самый толстый кусок. Сок должен быть прозрачным, а мясо внутри белым, без розового. Если есть термометр, внутри должно быть 75 °C.","when":"day_of"},{"active":false,"eq":["fridge","container"],"est":false,"info":false,"min":10,"min_text":10,"t":"Дайте постоять 5–10 минут. Ужин Вс подавайте сразу, гарнир отдельно; сок из формы полейте на курицу. Остальные 4 порции остудите не дольше часа, разложите по контейнерам с крышкой вместе с соком из формы и уберите в холодильник.","when":"day_of"}],"storage":"В контейнерах с крышкой в холодильнике до 3 дней. Испечено в Вс, съесть до ужина Вт включительно.","tags":["work_ok","oven"],"total_min":70},"oladyi_oven":{"active_min":15,"base":{"c":65.6,"f":12.5,"g":195,"kcal":427,"p":13.3},"batch":{"cook":"same_day","freeze_d":30,"keeps_d":3,"mode":"cook","no_thaw":true},"eq":["bowl","freezer","fridge","micro","oven"],"eq_text":["духовка","противень","пергамент (бумага для выпечки) или силиконовый коврик","миска","венчик или миксер","сито","столовая ложка","лопатка"],"in_menu":true,"ing":[{"g":70,"id":"wheat_flour","note":"лучше взвесить"},{"g":75,"id":"milk_25","note":"комнатной температуры или чуть тёплое"},{"id":"egg","note":"1 яйцо на 2 порции","pcs":0.5},{"g":10,"id":"sugar","note":"обычный сахар, на двоих 1 ст. л. с небольшой горкой"},{"g":2.5,"id":"baking_powder","note":"больше не нужно, иначе привкус соды"},{"g":0.5,"id":"salt","note":"щепотка"},{"g":3,"id":"sunflower_oil","note":"в тесто, а не на сковороду: на двоих чуть больше 1 ч. л."},{"g":30,"id":"sour_cream_15","note":"к подаче, ~1,5 ст. л. на порцию"}],"keeps_d":3,"light":"Пекутся в духовке на пергаменте вместо жарки на масле: в тесте всего ~3 г масла на порцию; на молоке 2,5 % с разрыхлителем вместо кефира; сметана 15 %; сахар обычный, но умеренно — 10 г на порцию.","mode":"cook","name":"Оладьи в духовке со сметаной","notes":"Белок к этому завтраку дают варёные яйца (отдельный компонент дня, варятся тут же, пока оладьи в духовке). Сметана — общая пачка 15 % недели. Вес готового блюда 195 г = ~165 г оладий (тесто ~185 г теряет при выпечке ~12 % влаги) + 30 г сметаны. Нужна именно силиконизированная бумага для выпечки или силиконовый коврик/формочки: к обычной кальке оладьи прилипнут.","portion":{"her":{"max_g":170}},"reheat":"Микроволновка 30–40 с или 5 мин в духовке при 180 °C. Из морозилки: Не размораживай: из морозилки в духовку 180 °C 8–10 мин или на сухую сковороду под крышкой по 2 мин с каждой стороны. Сметану подавай свежую.","role":"breakfast","steps":[{"active":false,"eq":["micro","fridge"],"est":false,"info":true,"min":0,"min_text":null,"t":"Завтрак на двоих (~40 мин, из них активно 15), без кефира и без жарки. Вес продуктов — в таблице «Вся партия». Молоко и яйцо достаньте из холодильника за 15–20 мин (или подогрейте молоко в микроволновке 20–30 с до чуть тёплого).","when":"day_of"},{"active":true,"eq":["oven"],"est":true,"info":false,"min":0,"min_text":null,"t":"Включите духовку на 200 °C (режим верх-низ), решётку поставьте в середину. Противень застелите пергаментом или силиконовым ковриком.","when":"day_of"},{"active":true,"eq":["bowl"],"est":true,"info":false,"min":0,"min_text":1,"t":"В миске взбейте венчиком или миксером яйцо с сахаром и солью 1 мин до лёгкой пены.","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":0,"min_text":null,"t":"Влейте молоко и масло, перемешайте.","when":"day_of"},{"active":true,"eq":["bowl"],"est":true,"info":false,"min":0,"min_text":null,"t":"Муку смешайте с разрыхлителем и просейте в миску в 2–3 приёма, каждый раз перемешивая венчиком (или миксером на низкой скорости) до гладкости. Тесто должно быть густым, как густая сметана: с ложки стекает медленно, лентой. Если растекается — добавьте 1 ст. л. муки.","when":"day_of"},{"active":false,"eq":[],"est":false,"info":false,"min":10,"min_text":10,"t":"Оставьте тесто на 10 мин: появятся пузырьки, оладьи будут пышнее. После этого больше не перемешивайте.","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":0,"min_text":null,"t":"Выкладывайте тесто столовой ложкой на пергамент кружками диаметром 7–8 см (по 1,5 ст. л. на оладью), оставляя между ними 3 см. Раздели по весу из таблицы.","when":"day_of"},{"active":false,"eq":["oven"],"est":false,"info":false,"min":10,"min_text":10,"t":"Выпекайте 10 мин, пока низ не подрумянится, а верх не станет матовым. Переверните лопаткой и пеките ещё 4–5 мин до золотистого цвета с обеих сторон. Готовность: деревянная шпажка в самой толстой оладье выходит сухой.","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":12,"min_text":20,"t":"Вариант без переворачивания: разлейте тесто в силиконовые формочки для маффинов на 2/3 высоты и пеките 18–20 мин при 180 °C.","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":3,"min_text":9,"t":"Подавайте горячими со сметаной 15 % и варёными яйцами: яйца свари, пока оладьи пекутся (9 мин после закипания, затем 1–2 мин в холодной воде), и подавай тёплыми.","when":"day_of"},{"active":false,"eq":["freezer","container"],"est":false,"freeze_step":true,"info":true,"min":0,"min_text":null,"t":"Заморозка (оладьи): порции, которые не съедят в ближайшие 3 суток, сразу уйдут в морозилку. Остуди на решётке до комнатной температуры, разложи на доске в один слой и заморозь 1 час, потом пересыпь в пакет по порциям: одна порция = один завтрак одного человека, на пакете подпиши блюдо и дату. Срок в морозилке — до 30 суток. Размораживать не нужно: бери порцию прямо из морозилки.","when":"day_of"}],"storage":"Готовишь большой партией. В холодильнике в закрытом контейнере до 3 суток — столько, сколько съедят в ближайшие приёмы; остальное сразу после остывания в морозилку (до 30 суток). Остуди на решётке до комнатной температуры, разложи на доске в один слой и заморозь 1 час, потом пересыпь в пакет по порциям: одна порция = один завтрак одного человека, на пакете подпиши блюдо и дату. Размораживать не нужно: бери порцию прямо из морозилки.","tags":["oven"],"total_min":35},"omelet_chicken_mozz":{"active_min":15,"base":{"c":7.8,"f":16.3,"g":290,"kcal":301,"p":29.8},"batch":{"cook":"same_day","keeps_d":1,"mode":"cook"},"eq":["board","bowl","container","grater","pan","stove"],"eq_text":["плита","сковорода 24–26 см с крышкой","пергамент (силиконизированная бумага для выпечки)","миска","вилка","нож и доска","крупная тёрка","контейнер с крышкой"],"in_menu":true,"ing":[{"id":"egg","note":"количество — по таблице «Вся партия»","pcs":2},{"g":50,"id":"milk_25","note":""},{"g":50,"id":"chicken_fillet","note":"вес сырого филе; запечённая или отварная грудка из заготовки недели, кубиком 1 см (из 100 г сырого выходит ~75 г готового)"},{"g":20,"id":"mozzarella","note":"натереть на крупной тёрке"},{"g":30,"id":"bell_pepper","note":"кубиком 1 см"},{"g":80,"id":"tomato","note":"свежий, дольками, подаётся рядом"},{"g":1,"id":"dill","note":"мелко"},{"g":0.5,"id":"salt","note":"щепотка"},{"g":0.1,"id":"black_pepper","note":"щепотка"}],"keeps_d":1,"light":"Омлет на пергаменте в сковороде без масла; курица заранее отварена или запечена без жира; моцареллы 20 г на порцию; сладкий перец и свежий помидор дают объём; молоко 2,5 %.","mode":"cook","name":"Омлет с курицей и моцареллой на сковороде","notes":"Курица — отварная или запечённая грудка из заготовки недели; если её нет, вечером накануне отвари филе в подсоленной воде 15 мин после закипания. Моцарелла — брусок недели. Омлеты только на сковороде (правило 09.11), без духовки и без болтуньи.","portion":{},"reheat":"Не разогревают. Если остыл, прогрей порцию 30–40 с в микроволновке под крышкой. Помидор не греть.","role":"breakfast","steps":[{"active":false,"eq":[],"est":true,"info":true,"min":0,"min_text":null,"t":"Готовится утром на двоих одним омлетом за ~20 мин. Курица — отварная или запечённая грудка из заготовки недели. Вес продуктов на всю партию — в таблице «Вся партия».","when":"day_of"},{"active":true,"eq":["board","grater"],"est":true,"info":false,"min":3,"min_text":null,"t":"Курицу нарежь кубиком 1 см, сладкий перец — кубиком 0,5 см, укроп мелко, моцареллу натри на крупной тёрке. Помидор нарежь дольками и разложи по тарелкам: он подаётся свежим рядом.","when":"day_of"},{"active":true,"eq":["bowl"],"est":true,"info":false,"min":1,"min_text":null,"t":"Яйца с молоком, солью и перцем взбей вилкой 30 с до однородности, без пены.","when":"day_of"},{"active":true,"eq":["pan","stove"],"est":true,"info":false,"min":2,"min_text":null,"t":"Отрежь квадрат пергамента на 4–5 см шире дна сковороды, скомкай, расправь и уложи в сковороду. Прогрей на огне чуть ниже среднего 1 мин, масло не нужно. Выложи курицу с перцем и прогрей 1 мин.","when":"day_of"},{"active":true,"eq":["pan","stove"],"est":true,"info":false,"min":5,"min_text":5,"t":"Влей яичную смесь, накрой крышкой и готовь 4–5 мин на слабом огне, не перемешивая, пока края не схватятся.","when":"day_of"},{"active":true,"eq":["pan","stove"],"est":true,"info":false,"min":3,"min_text":3,"t":"Посыпь моцареллой, снова накрой на 2–3 мин: верх перестанет быть жидким, сыр расплавится.","when":"day_of"},{"active":true,"eq":["board","container"],"est":true,"info":false,"min":1,"min_text":null,"t":"Сложи омлет пополам лопаткой на пергаменте, посыпь укропом, раздели по весу из таблицы и подавай рядом с орежь.","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":1,"min_text":null,"t":"Яйца с молоком, солью, перцем и половиной укропа взбей вилкой 30 с до однородности.","when":"day_of"},{"active":true,"eq":["pan"],"est":true,"info":false,"min":0,"min_text":1,"t":"Уложи в сковороду скомканный и расправленный пергамент, огонь чуть ниже среднего. Высыпь горошек и прогрей 1 мин, разровняв по дну.","when":"day_of"},{"active":true,"eq":["stove"],"est":true,"info":false,"min":6,"min_text":4,"t":"Влей яйца поверх горошка, накрой крышкой и готовь 3–4 мин на слабом огне, не мешая, пока края не схватятся.","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":1,"min_text":2,"t":"Разложи сыр, накрой и держи ещё 2 мин, пока верх не перестанет быть жидким, а сыр не расплавится.","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":1,"min_text":null,"t":"Посыпь оставшимся укропом, сложи пополам, раздели по весу из таблицы и ешь сразу.","when":"day_of"}],"storage":"Не хранится: готовить утром и есть сразу. Остаток горошка без жидкости — в закрытом контейнере в холодильнике до 2 дней.","tags":["omelet"],"total_min":15},"omelet_peas_tomato":{"active_min":10,"base":{"c":8.5,"f":12.8,"g":280,"kcal":240,"p":21.7},"batch":{"cook":"same_day","keeps_d":3,"mode":"cook"},"eq":["board","bowl","pan","stove"],"eq_text":["плита","обычная сковорода 24–26 см с крышкой","миска","вилка или венчик","сито","силиконовая или деревянная лопатка","кисточка или бумажное полотенце"],"in_menu":true,"ing":[{"id":"egg","note":"","pcs":2},{"g":30,"id":"milk_25","note":"2 ст. л. (по 1 ст. л. на яйцо)"},{"g":40,"id":"ham","note":"нежирная ветчина кубиком 1 см; белок вместо третьего яйца"},{"g":40,"id":"green_peas_canned","note":"вес без жидкости; банка недели"},{"g":100,"id":"tomato","note":"кубиком 1,5 см"},{"g":1,"id":"sunflower_oil","note":"1/2 ч. л. (~2 г) на сковороду для двоих, растереть кисточкой"},{"g":0.7,"id":"salt","note":"щепотка: ветчина сама солёная"},{"g":0.1,"id":"black_pepper","note":"щепотка"},{"g":0.2,"id":"italian_herbs","note":"щепотка в яичную смесь: с помидором даёт вкус без сыра"}],"keeps_d":3,"light":"2 яйца на порцию вместо 3, а белок добран 40 г нежирной ветчины; овощей много — помидор и горошек ~140 г на порцию дают объём при малой калорийности; без колбасы, бекона и сыра; масла 1/2 ч. л. на сковороду для двоих, растёртого кисточкой; омлет томится под крышкой на слабом огне; молоко 2,5 %.","mode":"cook","name":"Омлет с горошком и помидором","notes":"Завтрак в Чт 1-й недели и в Сб 4-й недели (оба раза с батоном). Ветчина — пачка той же недели: в 1-й неделе она же идёт на рулетики из лаваша (Чт–Пт), в 4-й — на карбонару в Сб (вскрытая хранится 4 дня). Горошек: в 1-й неделе банка вскрыта в Ср для риса с горошком и кукурузой, омлет в Чт её доедает; в 4-й неделе банку вскрыть для омлета в Сб, остаток без жидкости в закрытом контейнере убрать в холодильник — он идёт в салат с кальмаром в Вс. Укроп сюда не кладём, чтобы в 4-й неделе не покупать пучок ради одного блюда; аромат дают итальянские травы из той же пачки, что на пиццу, фокаччу и салаты. Если омлет прилипает, положите на дно сковороды кружок пергамента чуть больше дна и смажьте его тем же маслом.","portion":{},"reheat":"Не разогревают: едят сразу. Если омлет успел остыть, прогрейте свою порцию в микроволновке 30–40 секунд под крышкой.","role":"breakfast","steps":[{"active":false,"eq":[],"est":false,"info":true,"min":0,"min_text":null,"t":"Готовится утром на 2 порции (ей и ему) одним омлетом, примерно за 15 минут. Вес продуктов для её и его порции — в таблице выше; батон к омлету — отдельный компонент дня.","when":"day_of"},{"active":true,"eq":["board"],"est":true,"info":false,"min":1,"min_text":null,"t":"Откиньте горошек на сито, чтобы стекла вся жидкость. Помидор вымойте, вырежьте место крепления плодоножки и нарежьте кубиком 1,5 см. Ветчину нарежьте кубиком 1 см.","when":"day_of"},{"active":true,"eq":["bowl"],"est":true,"info":false,"min":1,"min_text":null,"t":"Разбейте яйца в миску, добавьте молоко, соль, перец и щепотку итальянских трав (разотрите их между пальцами) и взбейте вилкой или венчиком 30–40 секунд до однородности.","when":"day_of"},{"active":false,"eq":["pan"],"est":true,"info":false,"min":5,"min_text":120,"t":"Поставьте сковороду на средний огонь на 1–2 минуты. Налейте 1/2 ч. л. масла на двоих и разотрите его по всему дну кисточкой или сложенным бумажным полотенцем.","when":"day_of"},{"active":true,"eq":["stove"],"est":true,"info":false,"min":1,"min_text":2,"t":"Выложите ветчину и помидор и готовьте на среднем огне 2 минуты, помешивая лопаткой, чтобы испарился лишний сок (иначе омлет получится водянистым), а ветчина слегка подрумянилась. Добавьте горошек и прогрейте ещё 1 минуту.","when":"day_of"},{"active":true,"eq":["pan"],"est":true,"info":false,"min":1,"min_text":null,"t":"Разровняйте начинку ровным слоем по всему дну: эта «подушка» помогает омлету не прилипать к обычной сковороде.","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":5,"min_text":8,"t":"Убавьте огонь до слабого (примерно треть мощности конфорки). Влейте яичную смесь поверх овощей, не перемешивайте и сразу накройте крышкой. Готовьте 6–8 минут, пока омлет не схватится по всей поверхности (в центре допустим чуть влажный слой).","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":1,"min_text":null,"t":"Снимите с огня, проведите лопаткой по краю и под омлетом, разрежьте на 2 части по весу порций из таблицы (её часть меньше, его больше) и подавайте сразу с батоном.","when":"day_of"}],"storage":"Не хранится: готовить утром и есть сразу (партия на один завтрак).","tags":["omelet"],"total_min":15},"pasta_chicken_mush_smetana":{"active_min":30,"base":{"c":49.2,"f":11.9,"g":330,"kcal":466,"p":41},"batch":{"cook":"evening_before","keeps_d":3,"mode":"cook"},"eq":["board","bowl","container","fridge","pan","pot","stove"],"eq_text":["плита","кастрюля 3–4 л для пасты","сковорода 26–28 см с крышкой (или сотейник)","дуршлаг","лопатка","миска или стакан для соуса","нож и доска","контейнеры с крышками"],"in_menu":true,"ing":[{"g":55,"id":"fettuccine","note":"сухие гнёзда"},{"g":120,"id":"chicken_fillet","note":"филе грудки, кубиком 2 см"},{"g":80,"id":"champignons","note":"пластинками 4–5 мм"},{"g":25,"id":"onion","note":"мелким кубиком"},{"g":2,"id":"garlic","note":"мелко"},{"g":30,"id":"sour_cream_15","note":""},{"g":50,"id":"milk_25","note":""},{"g":3,"id":"wheat_flour","note":"размешать со сметаной: не даст ей свернуться"},{"g":0.1,"id":"nutmeg","note":"молотый"},{"g":1.1,"id":"sunflower_oil","note":"на курицу"},{"g":2,"id":"dill","note":"мелко порубить, в конце"},{"g":2,"id":"salt","note":"в соус по вкусу; плюс в воду для пасты 1 ч. л. на литр (почти вся сливается)"},{"g":0.2,"id":"black_pepper","note":"молотый"},{"g":0.4,"id":"thyme","note":"к курице; мягкая специя, не острая"},{"g":0.4,"id":"basil_dried","note":"в соус; мягкая специя, не острая"},{"g":1.5,"id":"mushroom_veg_seasoning","note":"к курице и грибам вместо части соли; в смеси может быть соль, пробуй до досаливания"}],"keeps_d":3,"light":"Соус на сметане 15 % с молоком 2,5 % вместо сливок 20–33 %; мука не даёт сметане свернуться, поэтому соус гладкий без масла. Грибы жарятся без масла до испарения влаги, на курицу 1 ч. л. на всю партию. Вкус «сливочного» соуса дают мускат, чеснок и обжаренные грибы, без сыра.","mode":"cook","name":"Паста с курицей и шампиньонами в сметанном соусе с мускатом","notes":"Пасту и соус можно хранить отдельно: тогда паста не впитает весь соус. Порции подгоняет программа: ему больше курицы и пасты, ей меньше пасты. Мускат — щепотками: в избытке горчит. Сметана — общая пачка 15 % недели (вскрытая хранится 5 дней).","portion":{"her":{"max_g":250},"him":{"max_g":330}},"reheat":"Добавить 1–2 ст. л. воды или молока, накрыть крышкой неплотно, микроволновка 2–2,5 мин на 800 Вт, перемешать на середине.","role":"main","steps":[{"active":false,"eq":["container"],"est":false,"info":true,"min":0,"min_text":null,"t":"Готовится вечером накануне или в день первого приёма партией на 2 приёма (ему — в контейнер). Вес продуктов на всю партию — в таблице «Вся партия». Поставь воду для пасты (3 л, 1 ч. л. соли на литр) сразу, пока режешь.","when":"day_of"},{"active":true,"eq":["pan","stove","bowl"],"est":true,"info":false,"min":5,"min_text":8,"t":"Сковороду прогрей на сильном огне 2 мин, выложи шампиньоны без масла. Жарь 6–8 мин, помешивая, пока вся вода не выпарится и грибы не начнут румяниться. Посоли щепоткой и переложи в миску.","when":"day_of"},{"active":true,"eq":["pan","stove"],"est":true,"info":false,"min":17,"min_text":60,"t":"В ту же сковороду налей 1 ч. л. масла, выложи курицу одним слоем и жарь на сильном огне 2 мин не трогая, затем перемешай и жарь ещё 2 мин. Добавь лук и 2 ст. л. воды, убавь до среднего и готовь 4 мин, пока лук не станет мягким. Добавь чеснок на 30 с.","when":"day_of"},{"active":true,"eq":["pot"],"est":true,"info":false,"min":6,"min_text":9,"t":"Тем временем отвари фетучини на 1 мин меньше, чем указано на пачке (обычно 8–9 мин). Перед сливом зачерпни 100 мл воды от пасты.","when":"day_of"},{"active":true,"eq":["pot"],"est":true,"info":false,"min":2,"min_text":3,"t":"В стакане размешай сметану с мукой до гладкости, затем влей молоко, добавь мускат, соль и перец. Верни грибы к курице, влей соус, убавь до слабого и, помешивая, доведи до едва заметного кипения; томи 2–3 мин, пока соус не загустеет. Сильно не кипяти.","when":"day_of"},{"active":true,"eq":["pan","stove","container"],"est":true,"info":false,"min":0,"min_text":1,"t":"Выложи пасту в сковороду, перемешай 1 мин на слабом огне. Если густо, добавь 2–4 ст. л. воды от пасты: в контейнере соус ещё загустеет. Посыпь укропом.","when":"day_of"},{"active":false,"eq":["fridge","container"],"est":true,"info":false,"min":5,"min_text":30,"t":"Разложи по 4 контейнерам, остуди без крышки 20–30 мин и убери в холодильник.","when":"day_of"}],"storage":"В холодильнике в закрытых контейнерах до 2 суток.","tags":["work_ok","pasta"],"total_min":35},"plov_mc":{"active_min":25,"base":{"c":64.7,"f":11.2,"g":360,"kcal":475,"p":30.5},"batch":{"cook":"evening_before","keeps_d":3,"mode":"cook"},"eq":["board","bowl","container","freezer","fridge","mc"],"eq_text":["мультиварка Cuckoo CMC-CHSS1004F","нож и доска","сито","миска для замачивания риса","мерный стакан","силиконовая или деревянная лопатка (не царапать чашу)","контейнеры с крышками"],"in_menu":true,"ing":[{"g":140,"id":"beef_shoulder","note":"нежирная лопатка с рынка, кубиком 2 см, жир срезать"},{"g":65,"id":"rice_long","note":"длиннозёрный, сухой; промыть и замочить"},{"g":90,"id":"carrot","note":"соломкой 4–5 мм"},{"g":45,"id":"onion","note":"полукольцами"},{"g":6,"id":"garlic","note":"головка целиком, только снять верхнюю шелуху"},{"g":0.6,"id":"cumin","note":"зира молотая или растёртая в ступке почти в порошок: целых семян быть не должно"},{"g":0.3,"id":"turmeric","note":"для цвета"},{"g":0.5,"id":"paprika_sweet","note":""},{"g":1.1,"id":"sunflower_oil","note":""},{"g":2.5,"id":"salt","note":"часть — к мясу, остальное — на рис"},{"g":0.2,"id":"black_pepper","note":"молотый"},{"g":0.6,"id":"coriander_ground","note":"к мясу и моркови; мягкая специя, не острая"},{"g":2,"id":"plov_seasoning","note":"к мясу и моркови вместо части соли; в смеси может быть соль, пробуй до досаливания"}],"keeps_d":3,"light":"Классический плов готовят на 150–200 г масла или курдюке на казан; здесь 1 ч. л. на партию, мясо томится под давлением без обжарки. Постная лопатка с срезанным жиром, моркови больше, чем риса. Вкус дают зира, чеснок и морковь, а не жир.","mode":"cook","name":"Плов с говядиной и зирой в мультиварке","notes":"Плов без томатов — это правильно (рис с томатным соусом не сочетаем). Подавать со свежей овощной нарезкой или салатом. Отложенный старт «Таймер» не используй: сырое мясо не должно лежать часами. Зира — пряность в семенах; ей нельзя семечки, поэтому лучше растереть в ступке почти в порошок. Порции подгоняет программа: ему больше мяса, ей меньше риса.","portion":{"her":{"max_g":300}},"reheat":"Сбрызнуть 1–2 ст. л. воды, крышка неплотно, микроволновка 2–2,5 мин на 800 Вт, перемешать на середине.","role":"main","steps":[{"active":false,"eq":["mc","fridge","freezer","container"],"est":false,"info":true,"min":0,"min_text":null,"t":"Готовится вечером накануне или в день первого приёма партией на 2 приёма (ему — в контейнер), хранится до 2 суток. Вес продуктов на всю партию — в таблице «Вся партия»; всё вместе не выше 2/3 чаши. Если говядина куплена на рынке заранее — в день покупки разложи её порционно по пакетам, заморозь сырой плоско и разморозь в холодильнике в ночь перед готовкой.","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":20,"min_text":30,"t":"Рис промой в 5–6 водах до почти прозрачной и залей тёплой водой на 30 мин, пока готовится мясо.","when":"day_of"},{"active":false,"eq":["mc"],"est":false,"info":false,"min":60,"min_text":60,"t":"Мясо (зирвак): в чашу налей 1 ч. л. масла, выложи лук, морковь, говядину, половину соли, зиру, куркуму, паприку и перец, влей 150 мл горячей воды и перемешай. Закрой крышку: ручку в «Открыто», опусти крышку, ручку в «Закрыто». Колесом «Меню/Выбор» выбери «Мультиповар», «Ввод», выставь 120 °C, «Ввод», время 20 мин, «Ввод», нажми «Варка/Турбо».","when":"day_of"},{"active":false,"eq":[],"est":false,"info":false,"min":10,"min_text":10,"t":"После сигнала дай пару выйти самому (10 мин) или удерживай «Отмена» 2 с для сброса пара; ручку силой не крути. Открой, когда ручка свободно повернётся.","when":"day_of"},{"active":true,"eq":["mc"],"est":true,"info":false,"min":1,"min_text":null,"t":"Рис слей и разровняй ровным слоем поверх мяса, не перемешивая. Посоли оставшейся солью. Аккуратно по стенке влей горячую воду так, чтобы она покрывала рис на 1 см. В центр вдави головку чеснока. Проверь: всё вместе не выше 2/3 чаши.","when":"day_of"},{"active":false,"eq":["mc"],"est":false,"info":false,"min":50,"min_text":50,"t":"Закрой крышку (ручку в «Открыто» → опустить → «Закрыто»). Колесом «Меню/Выбор» выбери «Плов» → «Ввод» → «Варка/Турбо»; программа идёт сама, около 40–50 мин. Если такой программы нет — «Мультиповар» 115 °C, 12 мин → «Ввод» → «Варка/Турбо» (под давлением). После сигнала пар сбросить естественно, 10 мин: ручку не крути.","when":"day_of"},{"active":true,"eq":["mc"],"est":true,"info":false,"min":4,"min_text":5,"t":"Открой крышку, достань чеснок, перемешай плов снизу вверх, чтобы морковь и мясо распределились по рису. Оставь в открытой чаше на 5 мин.","when":"day_of"},{"active":false,"eq":["fridge","container"],"est":false,"info":false,"min":30,"min_text":30,"t":"Разложи по контейнерам (чеснок раздели по порциям или выдави), остуди 30 мин без крышки и убери в холодильник.","when":"day_of"}],"storage":"В холодильнике в закрытых контейнерах до 2 суток (рис с мясом — не дольше 3).","tags":["work_ok","mc"],"total_min":100},"poached_egg_toast_mozz":{"active_min":15,"base":{"c":28.6,"f":15.4,"g":235,"kcal":341,"p":20.6},"batch":{"cook":"same_day","keeps_d":3,"mode":"cook"},"eq":["grater","oven","pan","pot","stove"],"eq_text":["плита","духовка с противнем или сковорода с крышкой","пергамент","широкая кастрюля 2–3 л","шумовка","чашки по числу яиц","крупная тёрка","бумажное полотенце"],"in_menu":true,"ing":[{"id":"egg","note":"самые свежие из упаковки","pcs":2},{"g":50,"id":"toast_bread","note":"2 ломтика по ~25 г"},{"g":20,"id":"mozzarella","note":"для пиццы; остаток бруска натереть и заморозить порциями"},{"g":80,"id":"tomato","note":"свежий, кружками 0,5 см, подаётся рядом или кладётся на горячий тост"},{"g":0.2,"id":"italian_herbs","note":"щепотка на сыр"},{"g":7,"id":"vinegar_9","note":"1 ст. л. на 1–1,5 л воды для варки; в блюдо почти не попадает"},{"g":0.3,"id":"salt","note":"на яйца и помидор; воду не солить"},{"g":0.1,"id":"black_pepper","note":"щепотка"}],"keeps_d":3,"light":"Яйца без масла, хлеб подсушен в духовке с сыром, а не обжарен; моцареллы 20 г — тонкий слой, а не «шапка»; свежий помидор вместо соуса.","mode":"cook","name":"Яйца пашот на тосте с моцареллой","notes":"Моцарелла — брусок недели; остаток натереть, разложить порциями и заморозить.","portion":{},"reheat":"Не разогревают.","role":"breakfast","steps":[{"active":false,"eq":["oven","pot"],"est":false,"info":true,"min":0,"min_text":null,"t":"Готовится утром на двоих за 15 мин. Вес её и его порции — в таблице. Налей в широкую кастрюлю 1–1,5 л воды, накрой крышкой и поставь на сильный огонь; духовку включи на 200 °C.","when":"day_of"},{"active":true,"eq":["oven","pan","stove"],"est":true,"info":false,"min":8,"min_text":6,"t":"Хлеб разложи на противень с пергаментом, посыпь моцареллой и щепоткой итальянских трав. Запекай 5–6 мин, пока сыр не расплавится, а края хлеба не зарумянятся. Без духовки: на сковороде на пергаменте под крышкой на слабом огне 3–4 мин.","when":"day_of"},{"active":true,"eq":["pot"],"est":true,"info":false,"min":1,"min_text":null,"t":"Когда вода закипит, убавь огонь до слабого-среднего (только мелкие пузырьки), влей уксус, не соли. Разбей каждое яйцо в отдельную чашку.","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":1,"min_text":null,"t":"Плавно опускай яйца у самой воды, по 3–4 за раз с интервалом 15–20 с в разные места.","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":3,"min_text":4,"t":"Вари 4–4,5 мин: белок плотный, желток загустевший, яйцо не мокрое. Жидкий желток (3–3,5 мин) — только тому, кто его любит.","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":1,"min_text":null,"t":"Тосты с моцареллой разложи по тарелкам, сверху или рядом — кружки свежего помидора.","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":1,"min_text":null,"t":"Доставай яйца шумовкой, промокни 2–3 с над полотенцем и выложи на тост (по весу из таблицы). Посоли, поперчи, ешь сразу.","when":"day_of"}],"storage":"Не хранится: готовить прямо перед едой. Вскрытая моцарелла — в закрытом пакете в холодильнике по сроку на упаковке (обычно до 5 дней); остаток лучше натереть и заморозить порциями.","tags":["sandwich","eggs","oven"],"total_min":15},"pollock_veg":{"active_min":25,"base":{"c":17.8,"f":11.4,"g":340,"kcal":311,"p":34.3},"batch":{"cook":"evening_before","keeps_d":2,"mode":"cook"},"eq":["board","bowl","container","freezer","fridge","grater","oven"],"eq_text":["духовка","форма для запекания ~25×35 см (стекло или керамика)","фольга (или крышка / второй противень)","крупная тёрка","доска и нож","миска","бумажные полотенца","контейнеры с крышками"],"in_menu":true,"ing":[{"g":180,"id":"pollock_fillet","note":"вес замороженного филе с глазурью; разморозить ночь в холодильнике"},{"g":10,"id":"lemon","note":"сок; лимон общий с другими блюдами недели"},{"g":40,"id":"onion","note":"очищенный, тонкими полукольцами"},{"g":60,"id":"carrot","note":"очищенная, на крупной тёрке"},{"g":40,"id":"bell_pepper","note":"соломкой"},{"g":60,"id":"tomato","note":"кружками 0,5 см"},{"g":2,"id":"garlic","note":"в сметану"},{"g":25,"id":"sour_cream_15","note":"тонким слоем вместо майонеза"},{"g":12,"id":"mozzarella","note":"моцарелла для пиццы (брусок), тонко натереть сверху; та же пачка, что для тёплого лаваша с курицей"},{"g":3,"id":"dill","note":""},{"g":3,"id":"sunflower_oil","note":"смазать форму"},{"g":2,"id":"salt","note":""},{"g":0.2,"id":"black_pepper","note":""},{"g":0.4,"id":"coriander_ground","note":"на рыбу; мягкая специя, не острая"},{"g":0.8,"id":"paprika_sweet","note":"на рыбу; мягкая специя, не острая"},{"g":0.3,"id":"turmeric","note":"на рыбу; мягкая специя, не острая"},{"g":1.5,"id":"fish_seasoning","note":"на рыбу вместо части соли; в смеси может быть соль, пробуй до досаливания"}],"keeps_d":2,"light":"Запекание под фольгой в собственном соку вместо жарки в панировке; тонкий слой сметаны 15 % вместо майонезной «шубы»; моцареллы всего ~12 г на порцию вместо жирного полутвёрдого сыра; масла 3 г только на смазку формы.","mode":"cook","name":"Минтай, запечённый с овощами","notes":"Гарнир — отдельным компонентом дня. Минтай можно заменить охлаждённым филе хека или трески — время то же. Моцарелла — брусок недели; остаток натереть и заморозить порциями. Лимон и перец — общие с другими блюдами недели.","portion":{},"reheat":"Микроволновка 1,5–2 мин на средней мощности под крышкой; разогревать только свою порцию и только один раз.","role":"main","steps":[{"active":false,"eq":["bowl","fridge","freezer","container"],"est":false,"info":true,"min":0,"min_text":null,"t":"Партия на 2 приёма на двоих: ужин в день готовки и обед на следующий день (ему — в контейнер на работу). Вес продуктов на всю партию — в таблице «Вся партия». Минтай купить накануне и сразу переложить в миску на нижнюю полку холодильника: за ночь он разморозится (не в морозилке и не в тёплой воде — рыба станет водянистой).","when":"day_of"},{"active":false,"eq":["board"],"est":false,"info":false,"min":10,"min_text":10,"t":"Вечером в день готовки слейте натёкшую воду, филе обсушите бумажными полотенцами, удалите остатки плавников и чешуи. Нарежьте на порционные куски (по 1–2 на порцию), сбрызните соком лимона, посыпьте половиной соли и перцем, оставьте на 10 мин.","when":"day_of"},{"active":true,"eq":["board","grater"],"est":true,"info":false,"min":5,"min_text":null,"t":"Тем временем нарежьте лук тонкими полукольцами, морковь натрите на крупной тёрке, перец нарежьте соломкой, помидоры — кружками 0,5 см. Лук с морковью перемешайте со щепоткой соли.","when":"day_of"},{"active":true,"eq":["grater"],"est":true,"info":false,"min":5,"min_text":null,"t":"Сметану смешайте с выдавленным чесноком и половиной мелко нарубленного укропа. Сыр натрите на крупной тёрке.","when":"day_of"},{"active":true,"eq":["oven"],"est":true,"info":false,"min":5,"min_text":null,"t":"Разогрейте духовку до 200 °C (верх-низ).","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":5,"min_text":null,"t":"Смажьте форму маслом кисточкой или салфеткой. Выложите половину лука с морковью, сверху рыбу в один слой, на неё — оставшиеся лук и морковь, перец и помидоры. Посолите овощи оставшейся солью и смажьте верх сметанным соусом.","when":"day_of"},{"active":false,"eq":["oven"],"est":false,"info":false,"min":25,"min_text":25,"t":"Плотно накройте форму фольгой (блестящей стороной внутрь), прижмите края. Запекайте на среднем уровне 25 мин.","when":"day_of"},{"active":false,"eq":["oven"],"est":false,"info":false,"min":12,"min_text":12,"t":"Осторожно снимите фольгу (выходит горячий пар), посыпьте сыром и запекайте без фольги ещё 10–12 мин, пока сыр не расплавится и слегка не зарумянится.","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":5,"min_text":null,"t":"Посыпьте оставшимся укропом и подавайте с рисом (гарнир дня).","when":"day_of"},{"active":false,"eq":["oven","fridge","container"],"est":true,"info":false,"min":45,"min_text":90,"t":"Сразу, как положили ужин на тарелки, разложите оставшиеся порции по отдельным контейнерам (на обед следующего дня, ей и ему), полейте соком из формы, остудите без крышки 20–30 мин и уберите в холодильник (не позже чем через 1,5 ч после того, как достали форму из духовки).","when":"day_of"}],"storage":"Рыба хранится 2 дня: в контейнерах в холодильнике, последнюю порцию съесть не позже чем через 2 дня после готовки.","tags":["work_ok","oven"],"total_min":70},"potato_baked_plain":{"active_min":12,"base":{"c":40.7,"f":4.5,"g":175,"kcal":221,"p":5},"batch":{"cook":"evening_before","keeps_d":3,"mode":"cook"},"eq":["board","bowl","container","fridge","oven"],"eq_text":["духовка","противень","пергамент","кисточка","миска","нож и доска","щётка для овощей","лопатка"],"in_menu":true,"ing":[{"g":230,"id":"potato","note":"с кожурой, хорошо вымыть щёткой; дольками ~2 см"},{"g":4,"id":"sunflower_oil","note":"наносится кисточкой"},{"g":0.8,"id":"smoked_paprika","note":""},{"g":0.8,"id":"paprika_sweet","note":""},{"g":1,"id":"garlic","note":"по желанию, через пресс — перемешать с горячими готовыми дольками (в духовке мелкий чеснок сгорит)"},{"g":0.2,"id":"italian_herbs","note":"по желанию, щепотка"},{"g":1.5,"id":"salt","note":""},{"g":0.2,"id":"black_pepper","note":"молотый"},{"g":0.4,"id":"oregano","note":"на картофель; мягкая специя, не острая"}],"keeps_d":3,"light":"Масло только кисточкой — 1 ч. л. на весь противень (около 2 г на порцию) вместо жарки или фритюра; без панировки; кожура оставлена; вкус «как с гриля» даёт копчёная паприка, а не жир.","mode":"cook","name":"Картофель запечённый дольками с паприкой","notes":"Копчёная паприка яркая — не больше 1/2 ч. л. на противень, вторая половина сладкая. Хорошо идёт к курице или рыбе со свежим помидором и йогуртовым соусом с укропом.","portion":{"her":{"max_g":150},"him":{"max_g":220}},"reheat":"Лучше в духовке или на сухой сковороде 5–7 мин; в микроволновке 1,5–2 мин без крышки — станет мягче, но вкус сохранится.","role":"side","steps":[{"active":false,"eq":["oven"],"est":false,"info":true,"min":0,"min_text":null,"t":"Готовится прямо к ужину на 2 человека (ей и ему), лучше есть сразу. Включи духовку на 200 °C (верх-низ; с конвекцией 190 °C), застели противень пергаментом.","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":0,"min_text":null,"t":"Картофель потри щёткой под водой, вырежи глазки, кожуру оставь. Разрежь клубень вдоль пополам, половинки — на 3–4 дольки толщиной ~2 см. Обсуши полотенцем досуха — мокрые дольки не румянятся.","when":"day_of"},{"active":true,"eq":["bowl"],"est":true,"info":false,"min":12,"min_text":120,"t":"В маленькой миске смешай обе паприки, соль, перец и травы. Отдельно в чашку налей 2 ч. л. масла.","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":0,"min_text":null,"t":"Разложи дольки на пергаменте кожурой вниз, в один слой, не касаясь друг друга. Кисточкой тонко смажь срезы маслом и сразу посыпь смесью специй.","when":"day_of"},{"active":false,"eq":["oven","board"],"est":true,"info":false,"min":38,"min_text":40,"t":"Запекай на средней полке 35–40 мин, через 20 мин переверни лопаткой. Готово, когда края золотистые, а нож входит в дольку легко.","when":"day_of"},{"active":true,"eq":["oven","bowl","fridge","container"],"est":true,"info":false,"min":0,"min_text":null,"t":"Если любишь чеснок — сразу из духовки переложи дольки в миску, добавь чеснок через пресс и перемешай. Подавай сразу. Остаток остуди и убери в контейнер в холодильник.","when":"day_of"}],"storage":"Лучше съесть в день готовки. Остаток — в закрытом контейнере в холодильнике до 2 суток.","tags":["work_ok","oven"],"total_min":50},"puree":{"active_min":20,"base":{"c":37.9,"f":5.5,"g":250,"kcal":224,"p":5.6},"batch":{"cook":"evening_before","keeps_d":3,"mode":"cook"},"eq":["blender","board","container","fridge","micro","pot","stove"],"eq_text":["плита","кастрюля 3–4 л с крышкой","овощечистка","нож и доска","толкушка для пюре (или миксер с венчиками)","кружка для молока","микроволновка","контейнеры с крышками"],"in_menu":true,"ing":[{"g":210,"id":"potato","note":"вес очищенного; нечищеного нужно ≈250 г. Рассыпчатый сорт (жёлтая или розовая кожура)"},{"g":45,"id":"milk_25","note":"горячее"},{"g":5,"id":"butter","note":"размягчённое"},{"g":1.5,"id":"salt","note":"в воду для варки и по вкусу в конце"}],"keeps_d":3,"light":"Молоко 2,5 % вместо сливок и 5 г сливочного масла на порцию вместо 15–20 г в классике, без яичного желтка. Пышность даёт подсушивание картофеля и горячее молоко, а не жир.","mode":"cook","name":"Картофельное пюре","notes":"Одна партия в месяце: Вс → ужины Вс 3-й недели, Пн и Вт 4-й недели (к минтаю, запечённому с овощами). Вес картофеля в рецепте — очищенного (по нему считается КБЖУ); покупать нечищеного примерно на 20 % больше. Молоко — общая бутылка «Станции Молочной» с кофе, масло — общая пачка с кашами, картофель — общий с другими блюдами.","portion":{},"reheat":"Микроволновка: добавить 1–2 ст. л. горячей воды, накрыть крышкой, 2–3 мин на полной мощности, на середине хорошо перемешать.","role":"side","steps":[{"active":false,"eq":[],"est":false,"info":true,"min":0,"min_text":null,"t":"Пюре готовится партией на 3 дня: в Вс вечером 3-й недели на ужины Вс–Вт к минтаю с овощами. Почистите картофель и взвесьте очищенный на всю партию: вес указан в карточке партии (ориентир — 210 г очищенного на порцию, на 6 порций ≈ 1,3 кг; нечищеного нужно примерно на 20 % больше, ≈ 1,5–1,6 кг).","when":"day_of"},{"active":true,"eq":["board"],"est":true,"info":false,"min":0,"min_text":null,"t":"Нарежьте клубни на одинаковые куски 4–5 см (крупные — на 4 части, средние — пополам), чтобы они сварились одновременно. Промойте.","when":"day_of"},{"active":true,"eq":["pot","stove"],"est":true,"info":false,"min":11,"min_text":60,"t":"Сложите картофель в кастрюлю и залейте холодной водой на 2 см выше картошки. Доведите до кипения на сильном огне, снимите пену, посолите (1 ч. л. без горки на 6 порций), убавьте огонь до среднего и накройте крышкой, оставив щель.","when":"day_of"},{"active":true,"eq":["board"],"est":true,"info":false,"min":8,"min_text":25,"t":"Варите 20–25 минут, пока нож не будет входить в картофель без усилия.","when":"day_of"},{"active":true,"eq":["pot","micro"],"est":true,"info":false,"min":1,"min_text":3,"t":"Пока картофель варится, достаньте сливочное масло, чтобы размягчилось. За 2–3 минуты до конца варки подогрейте молоко в кружке в микроволновке 40–60 секунд до горячего (не кипятить): с холодным молоком пюре получается серым и клейким.","when":"day_of"},{"active":true,"eq":["pot","stove"],"est":true,"info":false,"min":0,"min_text":2,"t":"Слейте воду полностью (через дуршлаг или придерживая картофель крышкой). Верните кастрюлю на плиту на минимальный огонь (на электроплите можно на выключенную, ещё горячую конфорку) на 1–2 минуты без крышки и встряхните пару раз: лишняя влага испарится, и пюре будет пышнее.","when":"day_of"},{"active":true,"eq":["blender"],"est":true,"info":false,"min":0,"min_text":null,"t":"Разомните картофель толкушкой до однородности, без комочков. Добавьте масло и вливайте горячее молоко в 2–3 приёма, каждый раз хорошо перемешивая. Вместо толкушки можно взбить миксером с венчиками на низкой скорости 30–40 секунд. Погружной блендер не используйте: от него пюре становится тягучим, как клейстер.","when":"day_of"},{"active":false,"eq":["fridge","container"],"est":true,"info":false,"min":25,"min_text":30,"t":"Попробуйте и при необходимости досолите щепоткой. Порции на сегодняшний ужин положите сразу. Остальное остудите 20–30 минут с открытой крышкой, разложите по контейнерам, разровняйте поверхность ложкой, закройте и уберите в холодильник.","when":"day_of"}],"storage":"Партия на 3 дня: в холодильнике в закрытых контейнерах до 3 суток. В холоде пюре густеет — это нормально.","tags":["work_ok"],"total_min":45},"rice":{"active_min":7,"base":{"c":44.5,"f":0.7,"g":170,"kcal":201,"p":4.2},"batch":{"cook":"evening_before","keeps_d":3,"mode":"cook"},"eq":["container","fridge","pot","stove"],"eq_text":["плита","кастрюля 2–3 л с толстым дном и плотной крышкой","сито","мерный стакан","контейнеры с крышками"],"in_menu":true,"ing":[{"g":60,"id":"rice_long","note":"длиннозёрный пропаренный (в магазине выбран именно пропаренный), сухой"},{"g":1,"id":"salt","note":"в воду для варки; на 6 порций — 1 ч. л. без горки"},{"g":0.3,"id":"turmeric","note":"в воду для риса; мягкая специя, не острая"},{"g":0.2,"id":"coriander_ground","note":"в воду; мягкая специя, не острая"}],"keeps_d":3,"light":"Без масла и без обжарки крупы: пропаренный рис и так получается рассыпчатым, а вкус даёт соус основного блюда (бефстроганов на сметане, мясо по-французски, тушёная капуста). Гарнир отдельной партией, поэтому ей можно положить меньше риса, а ему — больше мяса.","mode":"cook","name":"Рис отварной","notes":"Партии в месяце: Вс → ужины Пн–Вт 1-й недели (к мясу по-французски); Вс → обеды Пн–Ср 2-й недели (к бефстроганову); Ср → обеды Чт–Пт 4-й недели (к тушёной капусте с курицей). Нужен длиннозёрный пропаренный рис (rice_long) — та же пачка, что для плова, риса с горошком и пирога с рыбой; круглый рис — только для каши и ленивых суши. Если вместо пропаренного куплен обычный белый длиннозёрный рис: воды 180 мл на 100 г (1 стакан риса на 1,5 стакана воды), варить 15 минут, промывать дольше (1–2 минуты, перетирая зёрна); готового риса выйдет около 155 г на порцию.","portion":{},"reheat":"Микроволновка: сбрызнуть 1 ст. л. воды, накрыть, 1,5–2 мин на полной мощности до сильного пара, на середине перемешать. В контейнере вместе с основным блюдом — 2,5–3 мин.","role":"side","steps":[{"active":true,"eq":[],"est":true,"info":false,"min":0,"min_text":null,"t":"Рис варится партией на 2–3 дня на двоих. Взвесьте рис на всю партию: вес указан в карточке партии (ориентир — около 60 г сухого риса на порцию: на 4 порции ≈ 240 г, на 6 порций ≈ 360 г).","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":0,"min_text":null,"t":"Промойте рис в сите под холодной проточной водой 30–60 секунд, пока вода не станет почти прозрачной, и дайте стечь. Пропаренный рис почти не отдаёт крахмал и не слипается без масла, поэтому долго тереть его не нужно.","when":"day_of"},{"active":true,"eq":["pot","stove"],"est":true,"info":false,"min":4,"min_text":60,"t":"Отмерьте воду: 230 мл на каждые 100 г риса (по объёму — 1 стакан риса на 2 стакана воды, как в рисе с горошком и кукурузой). На 240 г риса — около 550 мл, на 360 г — около 830 мл. Влейте воду в кастрюлю, добавьте соль (1 ч. л. без горки на 6 порций) и доведите до кипения на сильном огне.","when":"day_of"},{"active":true,"eq":["pot"],"est":true,"info":false,"min":3,"min_text":20,"t":"Всыпьте рис, перемешайте один раз и дождитесь, пока вода снова закипит. Убавьте огонь до минимального, плотно накройте крышкой и варите 18–20 минут. Крышку не открывайте и не перемешивайте: рис доходит на пару.","when":"day_of"},{"active":false,"eq":["stove"],"est":false,"info":false,"min":10,"min_text":10,"t":"Проверьте: вода впиталась, зёрна мягкие. Если на дне осталась вода, подержите без крышки на слабом огне ещё 2–3 минуты. Выключите огонь и оставьте рис под крышкой ещё на 10 минут. Затем разрыхлите вилкой.","when":"day_of"},{"active":false,"eq":["fridge","container"],"est":true,"info":false,"min":38,"min_text":60,"t":"Остудите рис с открытой крышкой 20–30 минут и уберите в закрытых контейнерах в холодильник не позже чем через 1 час после варки: варёный рис нельзя подолгу держать тёплым при комнатной температуре.","when":"day_of"},{"active":true,"eq":["container"],"est":true,"info":false,"min":0,"min_text":null,"t":"Утром (для обеда на работе) или перед ужином положите порцию риса в контейнер или тарелку рядом с основным блюдом. Вес порции для неё и для него указан в карточке дня.","when":"day_of"}],"storage":"Партия на 2–3 дня: в холодильнике в закрытых контейнерах до 3 суток после варки. Разогревать только свою порцию и только один раз.","tags":["work_ok"],"total_min":45},"rice_plain":{"active_min":7,"base":{"c":44.5,"f":4,"g":165,"kcal":230,"p":4.2},"batch":{"cook":"evening_before","keeps_d":2,"mode":"cook"},"eq":["container","fridge","pot","stove"],"eq_text":["плита","кастрюля 2–3 л с толстым дном и плотной крышкой","сито","мерный стакан","вилка","контейнеры с крышками"],"in_menu":true,"ing":[{"g":60,"id":"rice_long","note":"лучше взвесить"},{"g":4,"id":"butter","note":"сливочное, кусочек в готовый горячий рис"},{"g":1,"id":"salt","note":"в воду"},{"g":0.3,"id":"turmeric","note":"в воду для риса; мягкая специя, не острая"}],"keeps_d":2,"light":"Немного сливочного масла (~4 г на базовую порцию) в готовый рис вместо обжарки крупы на масле; остальной вкус дают соус или подлива основного блюда; гарнир отдельной партией, поэтому ей легко положить меньше риса, а ему больше.","mode":"cook","name":"Рис отварной (заготовка)","notes":"Не подавать с томатными соусами (тефтели в томате и т. п.) — для них гречка или паста. Хорошо идёт к сметанным и сливочно-молочным блюдам, курице, рыбе.","portion":{"her":{"max_g":180},"him":{"max_g":250}},"reheat":"Микроволновка: сбрызнуть 1 ст. л. воды, накрыть крышкой, 1,5–2 мин на полной мощности до сильного пара, на середине перемешать. В контейнере вместе с основным блюдом — 2,5–3 мин. Рис должен прогреться до пара по всей толщине.","role":"side","steps":[{"active":false,"eq":[],"est":false,"info":true,"min":0,"min_text":null,"t":"Варится вечером накануне или в день первого приёма, партией на 1–2 приёма; хранится до 2 суток. Вес крупы на всю партию — в таблице «Вся партия» (лучше взвесить).","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":0,"min_text":1,"t":"Промой рис в сите под холодной водой 1 мин, перетирая рукой, пока вода не станет почти прозрачной. Дай стечь.","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":0,"min_text":null,"t":"Отмерь воду: 1,5 объёма воды на 1 объём риса (на 360 г риса ≈1¾ стакана — ~2,5 стакана воды, ~650 мл; если рис пропаренный — 2 объёма, ~870 мл). Доведи до кипения, посоли.","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":7,"min_text":15,"t":"Всыпь рис, перемешай один раз, дождись кипения, убавь огонь до минимального и плотно накрой. Вари 15 мин (пропаренный — 18–20), крышку не открывай.","when":"day_of"},{"active":false,"eq":[],"est":false,"info":false,"min":10,"min_text":10,"t":"Проверь: вода впиталась, зёрна мягкие. Выключи огонь и оставь под крышкой 10 мин, затем разрыхли вилкой.","when":"day_of"},{"active":false,"eq":["fridge","container"],"est":true,"info":false,"min":33,"min_text":60,"t":"Положи в горячий рис сливочное масло (вес — в таблице) и аккуратно перемешай вилкой. Сразу раскрой и остуди 20–30 мин, разложи по контейнерам и убери в холодильник не позже чем через 1 час после варки: тёплый рис при комнатной температуре быстро портится.","when":"day_of"},{"active":true,"eq":["container"],"est":true,"info":false,"min":0,"min_text":null,"t":"Утром кладёшь порцию в рабочий контейнер рядом с основным блюдом (вес её и его порции — в карточке дня).","when":"day_of"}],"storage":"В закрытых контейнерах в холодильнике до 2 суток (не дольше 3). Разогревать только свою порцию и только один раз.","tags":["work_ok"],"total_min":40},"rice_porridge":{"active_min":10,"base":{"c":60.5,"f":7.3,"g":320,"kcal":348,"p":9.3},"batch":{"cook":"same_day","keeps_d":3,"mode":"cook"},"eq":["micro","pot","stove"],"eq_text":["плита","кастрюля с толстым дном 1,5–2 л с крышкой","сито","ложка или лопатка","микроволновка (подогреть молоко, по желанию)"],"in_menu":true,"ing":[{"g":60,"id":"rice_round","note":"≈ 3 ст. л. с небольшой горкой; плюс 150 мл воды из-под крана (вода в список не входит)"},{"g":180,"id":"milk_25","note":"молоко пополам с водой"},{"g":7,"id":"sugar","note":"1 ч. л. с горкой; обычный сахар, не сахарозаменитель"},{"g":3,"id":"butter","note":"кусочек с ноготь, в готовую кашу"},{"g":0.5,"id":"salt","note":"щепотка"}],"keeps_d":3,"light":"Молоко 2,5 % пополам с водой вместо цельного; сахара 7 г на порцию вместо 1–2 ст. л.; масла 3 г вместо щедрого куска; белок добирается варёными яйцами, а не сливками и маслом.","mode":"cook","name":"Рисовая каша на молоке","notes":"Завтрак в Вс 1-й недели, подаётся с варёными яйцами (отдельная партия того же утра). Рис круглозёрный — та же пачка, что на ленивые суши во 2-й неделе; ей рис разрешён. Густоту можно поправить: жиже — добавьте 30–50 мл горячей воды на порцию в конце варки, калорий и белка это не меняет.","portion":{},"reheat":"Не разогревают: едят сразу. Остывшую кашу прогреть в микроволновке 1–1,5 минуты, добавив 1–2 ст. л. молока и перемешав на середине.","role":"breakfast","steps":[{"active":false,"eq":[],"est":false,"info":true,"min":0,"min_text":null,"t":"Выходной завтрак на 2 порции (ей и ему) ровно на одно утро, примерно 35 минут, из них активно около 10. Вес продуктов для её и его порции — в таблице выше. Пропорция на каждые 60 г риса: 150 мл воды и 180 мл молока.","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":0,"min_text":null,"t":"На соседней конфорке поставьте вариться яйца (отдельный рецепт «Яйца варёные»): каша подаётся с ними для белка.","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":0,"min_text":null,"t":"Рис насыпьте в сито и промойте под холодной водой 2–3 раза, перемешивая рукой, пока вода не станет почти прозрачной.","when":"day_of"},{"active":true,"eq":["pot"],"est":true,"info":false,"min":2,"min_text":12,"t":"В кастрюле доведите до кипения воду, всыпьте рис и соль, перемешайте. Убавьте огонь до слабого, накройте крышкой, оставив щель, и варите 10–12 минут, пока рис не впитает почти всю воду. За это время перемешайте 1–2 раза.","when":"day_of"},{"active":true,"eq":["micro"],"est":true,"info":false,"min":0,"min_text":2,"t":"Пока варится рис, подогрейте молоко в микроволновке 1–1,5 минуты: горячее молоко не остановит кипение и каша сварится быстрее.","when":"day_of"},{"active":true,"eq":["stove"],"est":true,"info":false,"min":0,"min_text":null,"t":"Влейте молоко в рис, добавьте сахар и на среднем огне доведите до кипения, помешивая. Не отходите: молоко может быстро подняться пеной и убежать.","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":7,"min_text":15,"t":"Убавьте огонь до самого слабого и варите без крышки 12–15 минут, помешивая каждые 2–3 минуты и обязательно проводя ложкой по дну, чтобы каша не пригорела. Готова, когда рис мягкий, а каша густая, как жидкая сметана: при остывании она ещё загустеет.","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":1,"min_text":5,"t":"Снимите с огня, положите сливочное масло, накройте крышкой и оставьте на 5 минут.","when":"day_of"},{"active":true,"eq":["pot"],"est":true,"info":false,"min":0,"min_text":null,"t":"Разложите по тарелкам по весу из таблицы (её порция меньше, его больше) и ешьте с варёными яйцами. Кастрюлю сразу залейте горячей водой — так она легко отмоется.","when":"day_of"}],"storage":"Не хранится: варить утром ровно на один завтрак. Если всё же осталось, в закрытой посуде в холодильнике до 1 суток.","tags":[],"total_min":35},"rice_porridge_mc":{"active_min":10,"base":{"c":56.7,"f":6.4,"g":320,"kcal":324,"p":9},"batch":{"cook":"same_day","keeps_d":3,"mode":"cook"},"eq":["mc"],"eq_text":["мультиварка Cuckoo CMC-CHSS1004F","сито","мерный стакан","силиконовая или деревянная ложка"],"in_menu":true,"ing":[{"g":55,"id":"rice_round","note":"круглозёрный; плюс 140 мл воды на каждые 55 г риса (вода в список не входит)"},{"g":180,"id":"milk_25","note":"холодное, прямо из холодильника"},{"g":7,"id":"sugar","note":"обычный сахар"},{"g":2,"id":"butter","note":"кубик 1,5 см ≈ 5 г"},{"g":0.5,"id":"salt","note":""}],"keeps_d":3,"light":"Молоко 2,5 % пополам с водой вместо цельного; сахара 7 г на порцию; масла 1 ч. л. (5 г) на двоих, и треть его работает как барьер от пены, а не в тарелке; без сливок. Белок добирается отдельным компонентом — бутербродом с лёгким сыром или варёными яйцами.","mode":"cook","name":"Рисовая каша в мультиварке к утру","notes":"Подавать с бутербродом с лёгким сыром (toast_cheese) или варёными яйцами. Первый раз проверь «Таймер» в выходной: если каша готова раньше или позже нужного, в следующий раз сдвинь время на эту разницу. Рис — та же пачка круглозёрного, что для роллов и онигири.","portion":{"her":{"max_g":260}},"reheat":"Прогреть в микроволновке 1–1,5 мин, добавив 1–2 ст. л. молока и перемешав на середине.","role":"breakfast","steps":[{"active":false,"eq":["mc"],"est":false,"info":false,"min":10,"min_text":10,"t":"Два варианта. А) С вечера на отложенный старт: в чашу идут только рис, вода, соль, сахар и масло — без молока; утром вливаешь молоко и доводишь кашу 10 мин. Б) Утром без таймера: всё сразу, запуск около 6:10 — к 7:00 каша готова. Вес продуктов — в таблице «Вся партия». Пропорция на 55 г риса: 140 мл воды и 180 мл молока. Жидкости всегда ниже отметки 2/3 чаши — молоко пенится.","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":1,"min_text":null,"t":"Рис промой в сите под холодной водой 4–5 раз, перетирая рукой, пока вода не станет почти прозрачной: без лишнего крахмала каша меньше пенится и не забрызгивает клапан.","when":"day_of"},{"active":true,"eq":["mc"],"est":true,"info":false,"min":1,"min_text":null,"t":"Смажь внутренние стенки чаши полоской масла (примерно треть всего масла) по кругу на 2–3 см выше уровня будущей жидкости — это барьер для пены. Засыпь рис, соль и сахар, влей холодную воду. Молоко: в варианте Б — сразу, холодным; в варианте А — только утром (шаг 7).","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":1,"min_text":null,"t":"Закрой крышку: ручку поверни в «Открыто», опусти крышку и поверни ручку в «Закрыто».","when":"day_of"},{"active":false,"eq":["mc"],"est":true,"info":false,"min":50,"min_text":720,"t":"Вариант А (вечером): колесом «Меню/Выбор» выбери «Каша» → «Ввод», нажми «Таймер» и колесом выставь время (диапазон 30 мин–13 ч) так, чтобы каша была готова к ~6:30 — например 7 ч при закладке в 23:00 → «Варка/Турбо». Вариант Б (утром): «Меню/Выбор» → «Каша» → «Ввод» → «Варка/Турбо» (программа идёт около 40–50 мин). Температуру и время программы не меняй; «Мультиповар» на 120 °C для каши не включай — для молока и каш 120 °C запрещены.","when":"day_of"},{"active":true,"eq":["mc"],"est":true,"info":false,"min":5,"min_text":10,"t":"После сигнала мультиварка сама перейдёт на подогрев. Давление выходит само: подожди 5–10 мин, пока ручка не начнёт поворачиваться без усилия; силой не крути. Если нужно быстрее — удерживай «Отмена» 2 с для ручного сброса, лицо и руки держи подальше от клапана: с молоком он может брызнуть.","when":"day_of"},{"active":false,"eq":["mc"],"est":false,"info":false,"min":10,"min_text":10,"t":"Только для варианта А: ручку в «Открыто», открой крышку, влей холодное молоко и перемешай. Закрой крышку, колесом «Меню/Выбор» выбери «Мультиповар» → «Ввод», выставь 100 °C → «Ввод», время 10 мин → «Ввод» → «Варка/Турбо» и сразу нажми «Настройки» (без давления). Через 5 мин открой и помешай.","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":1,"min_text":null,"t":"Ручку в «Открыто», открой крышку, добавь оставшееся масло и перемешай. Если каша густая, влей 2–3 ст. л. горячей воды или молока на порцию. Разложи по тарелкам по весу из таблицы.","when":"day_of"},{"active":true,"eq":["mc"],"est":true,"info":false,"min":1,"min_text":null,"t":"Сразу вынь чашу и замочи горячей водой; сними и промой внутреннюю крышку, уплотнитель и клапан от молочных брызг — иначе засохнут и будут пахнуть.","when":"day_of"}],"storage":"Не хранится: варить ровно на один завтрак. Остаток — в закрытой посуде в холодильнике до 1 суток.","tags":["mc"],"total_min":60},"salad_bcc":{"active_min":15,"base":{"c":15.3,"f":2.8,"g":175,"kcal":90,"p":2.5},"batch":{"cook":"evening_before","keeps_d":3,"mode":"cook"},"eq":["board","bowl","container","fridge","grater"],"eq_text":["нож и доска","крупная тёрка (или тёрка для корейской моркови)","большая миска","контейнер с крышкой","баночка с крышкой для заправки","маленькая баночка или соусник с крышкой для заправки на работу"],"in_menu":true,"ing":[{"g":75,"id":"white_cabbage","note":"остаток маленького вилка, тонкой соломкой"},{"g":50,"id":"carrot","note":"натереть на крупной тёрке"},{"g":50,"id":"beet_cooked","note":"варёная в вакууме, соломкой; на 6 порций 300 г"},{"g":2.5,"id":"sunflower_oil","note":"½ ч. л., в заправку (на партию 6 порций 1 ст. л. ≈15 г)"},{"g":20,"id":"lemon","note":"~1/6 лимона, около 1,5 ч. л. сока, в заправку (на партию 1 небольшой лимон ≈120 г)"},{"g":1.5,"id":"salt","note":"перетереть капусту, щепотка в заправку"}],"keeps_d":3,"light":"Без майонеза: ½ ч. л. масла на порцию, а основа заправки — лимонный сок (1,5 ч. л. на порцию); капуста перетёрта с солью, поэтому салат сочный и без лишнего масла; варёная свёкла из вакуума экономит час варки.","mode":"cook","name":"Салат «Щётка»: морковь, варёная свёкла, капуста","notes":"К пастушьему пирогу, обеды Пн–Ср 3-й недели (готовится в Вс 2-й недели). Капуста — остаток маленького вилка, разрезанного в Ср 1-й недели для салата капуста–морковь–кукуруза (~450 г на 6 порций). Свёкла: на этот салат 300 г; пачка 250–300 г уходит целиком; если продаётся только 500 г, остаток ~200 г идёт в свёклу с чесноком в Ср, но её на 4 порции нужно ~480 г, так что вторая пачка всё равно понадобится. Лимон на партию — 1 небольшой (≈120 г); он хранится 2 недели.","portion":{},"reheat":"Не разогревать, есть холодным; в рабочий контейнер класть отдельно от горячего пастушьего пирога (отдельный маленький контейнер).","role":"salad","steps":[{"active":false,"eq":["container"],"est":false,"info":true,"min":0,"min_text":null,"t":"Партия на 3 дня: готовится в Вс вечером на обеды Пн–Ср в контейнер (по порции ей и ему каждый день, всего 6 порций). Варить ничего не нужно.","when":"day_of"},{"active":true,"eq":["bowl"],"est":true,"info":false,"min":0,"min_text":2,"t":"С остатка вилка снимите заветренный верхний лист и срежьте тонкий слой с подсохшего среза. Нашинкуйте капусту как можно тоньше (соломка 2–3 мм), сложите в большую миску, посолите и 1–2 мин перетирайте руками, пока капуста не даст сок и не станет мягче.","when":"day_of"},{"active":true,"eq":["grater"],"est":true,"info":false,"min":0,"min_text":null,"t":"Морковь очистите и натрите на крупной тёрке или на тёрке для корейской моркови.","when":"day_of"},{"active":true,"eq":["board","grater","fridge"],"est":true,"info":false,"min":0,"min_text":null,"t":"Отмерьте свёклу (по 50 г на порцию, на партию 300 г), слейте сок из пачки и нарежьте соломкой или натрите на крупной тёрке. Если пачка была больше (500 г), остаток плотно заверните в плёнку и уберите в холодильник: он пойдёт в свёклу с чесноком в Ср (не позже 3 дней после вскрытия).","when":"day_of"},{"active":true,"eq":["fridge","container"],"est":true,"info":false,"min":0,"min_text":null,"t":"Смешайте капусту, морковь и свёклу, переложите в контейнер под крышкой и уберите в холодильник незаправленными.","when":"day_of"},{"active":true,"eq":["fridge"],"est":true,"info":false,"min":9,"min_text":90,"t":"Заправка на все 3 дня: выжмите в баночку сок 1 небольшого лимона (по 1,5 ч. л. сока на порцию), добавьте 1 ст. л. подсолнечного масла (на всю партию) и щепотку соли, закройте и храните в холодильнике. Лимона в заправке больше, чем масла: салат получается свежим и кисловатым, как и положено «Щётке».","when":"day_of"},{"active":true,"eq":["container"],"est":true,"info":false,"min":6,"min_text":120,"t":"Каждое утро в будни: переложите свою порцию салата в отдельный маленький контейнер (не к горячему пирогу). Встряхните баночку, налейте 2 ч. л. заправки в маленькую баночку или соусник и полейте салат на работе перед едой, перемешайте. Если отдельной баночки нет, можно заправить утром: капуста, морковь и свёкла с маслом и лимоном за полдня не раскиснут.","when":"day_of"}],"storage":"Незаправленный салат — в контейнере под крышкой в холодильнике до 3 дней (до обеда Ср). Заправка (масло с лимонным соком) — в закрытой баночке в холодильнике, перед использованием встряхнуть.","tags":["work_ok"],"total_min":15},"salad_cabbage_carrot":{"active_min":10,"base":{"c":12.8,"f":1.2,"g":160,"kcal":62,"p":2},"batch":{"cook":"evening_before","keeps_d":3,"mode":"cook"},"eq":["board","bowl","container","fridge","grater"],"eq_text":["нож и доска (или шинковка)","крупная тёрка","большая миска","контейнер с крышкой"],"in_menu":true,"ing":[{"g":120,"id":"white_cabbage","note":"тонкой соломкой"},{"g":40,"id":"carrot","note":"на крупной тёрке или соломкой"},{"g":1.5,"id":"vinegar_9","note":"развести тёплой водой 1:2"},{"g":1.5,"id":"sugar","note":"в заправку"},{"g":1.2,"id":"salt","note":""},{"g":1,"id":"sunflower_oil","note":"добавлять перед едой в порцию, не в партию"},{"g":2,"id":"dill","note":"мелко, по желанию"}],"keeps_d":3,"light":"Капуста перетирается с солью и даёт сок, поэтому масла нужно всего 1 ч. л. на всю партию на двоих; без кукурузы и майонеза; сладость даёт морковь и щепотка сахара.","mode":"cook","name":"Салат из капусты и моркови","notes":"Классический «витаминный» салат без кукурузы. Капусту брать небольшим
