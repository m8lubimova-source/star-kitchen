вилком или половинкой; разрезанный вилок хранить в плёнке.","portion":{},"reheat":"Не разогревать, едят холодным.","role":"salad","steps":[{"active":true,"eq":["board"],"est":true,"info":false,"min":3,"min_text":15,"t":"Можно нарезать к еде или вечером накануне партией на 2 приёма; без масла хранится 2 дня. Активно 10 мин, настояться 15 мин. Вес продуктов на всю партию — в таблице «Вся партия».","when":"day_of"},{"active":true,"eq":["bowl"],"est":true,"info":false,"min":0,"min_text":1,"t":"Капусту нашинкуй как можно тоньше (1–2 мм), сложи в большую миску, посыпь солью и сахаром и 1 мин мни руками, пока капуста не станет мягче и не даст сок.","when":"day_of"},{"active":true,"eq":["board","grater"],"est":true,"info":false,"min":0,"min_text":null,"t":"Морковь натри на крупной тёрке или нарежь соломкой, добавь к капусте.","when":"day_of"},{"active":false,"eq":[],"est":true,"info":false,"min":15,"min_text":120,"t":"Уксус разведи 2 ч. л. тёплой воды, полей салат, перемешай и дай постоять 15 мин — капуста станет сочной.","when":"day_of"},{"active":true,"eq":["fridge","container"],"est":true,"info":false,"min":0,"min_text":null,"t":"Переложи в контейнер с крышкой и убери в холодильник. Масло в партию не добавляй.","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":7,"min_text":120,"t":"Перед едой возьми порции, добавь по 1/4–1/2 ч. л. масла на двоих и укроп, перемешай. С собой — масло можно не добавлять вовсе: салат и так сочный.","when":"day_of"}],"storage":"Без масла — в закрытом контейнере в холодильнике до 2 дней; с маслом съесть в тот же день.","tags":["work_ok"],"total_min":25},"smetana":{"active_min":0,"base":{"c":0.7,"f":3,"g":20,"kcal":32,"p":0.5},"batch":{"cook":"evening_before","keeps_d":3,"mode":"ready"},"eq":["container"],"eq_text":["ложка"],"in_menu":true,"ing":[{"g":20,"id":"sour_cream_15","note":"1 ст. л. без горки ≈ 20 г"}],"keeps_d":3,"light":"Сметана 15 %, а не 20–25 %; добавлена программой только там, где день недобирает жиры.","mode":"ready","name":"Сметана 15 % к блюду","notes":"Добавка «по расчёту»: появляется в меню только там, где нужна для попадания в норму КБЖУ дня.","portion":{"addon_min_g":15,"her":{"max_g":20},"him":{"max_g":40}},"reheat":"Не греть: добавлять в уже горячее блюдо.","role":"addon","steps":[{"active":true,"eq":[],"est":true,"info":false,"min":0,"min_text":null,"t":"Положите сметану в тарелку прямо к горячему блюду (вес её и его порции — в меню дня; 1 ст. л. без горки ≈ 20 г).","when":"day_of"},{"active":true,"eq":["container"],"est":true,"info":false,"min":0,"min_text":null,"t":"На работу ему — сметану в маленький отдельный контейнер, добавить после разогрева.","when":"day_of"}],"storage":"Вскрытая сметана в холодильнике до 5 дней.","tags":["work_ok","ready"],"total_min":1},"syrniki_oven":{"active_min":20,"base":{"c":35.5,"f":16.7,"g":220,"kcal":411,"p":30.4},"batch":{"cook":"same_day","freeze_d":30,"keeps_d":3,"mode":"cook","no_thaw":true,"sunday_prep":true},"eq":["blender","board","bowl","container","freezer","fridge","micro","oven"],"eq_text":["духовка","противень","пергамент для выпечки (или силиконовый коврик)","миска","вилка или погружной блендер","силиконовая кисточка","широкая лопатка"],"in_menu":true,"ing":[{"g":150,"id":"tvorog_5","note":"творог 5 %, вес по таблице «Вся партия» (обычно 1 пачка 300 г); купить в день выпечки"},{"id":"egg","note":"1 яйцо на 2 порции","pcs":0.5},{"g":25,"id":"wheat_flour","note":"~20 г в тесто и ~5 г на обваливание"},{"g":12,"id":"sugar","note":"обычный сахар"},{"g":0.5,"id":"salt","note":"щепотка"},{"g":2,"id":"sunflower_oil","note":"смазать пергамент и верх сырников кисточкой"},{"g":30,"id":"sour_cream_15","note":"к подаче, ≈ 1,5 ст. л."}],"keeps_d":3,"light":"Без жарки: пекутся в духовке на пергаменте, масла 2 г на порцию вместо 10–15 г при жарке на сковороде. Творог 5 %, сметана 15 %, сахара умеренно, без изюма и сухофруктов.","mode":"cook","name":"Сырники в духовке со сметаной","notes":"Творог ей можно только в сырниках, это единственное блюдо с ним. Антипригарная сковорода не нужна. Если сырники липнут к пергаменту, значит он не силиконизированный: смажьте его чуть лучше или возьмите силиконовый коврик. Вес готовой порции 220 г: около 190 г сырников и 30 г сметаны.","portion":{"her":{"max_g":185},"him":{"max_g":225}},"reheat":"Микроволновка под крышкой: 1 порция 40–60 секунд, 2 порции на одной тарелке 1–1,5 минуты. Или духовка 160 °C 8 минут на пергаменте. Сметану кладите холодной после разогрева. Из морозилки: Не размораживай: из морозилки на противень с пергаментом, духовка 180 °C 12–15 мин или сковорода под крышкой по 3 мин с каждой стороны. Сметану подавай свежую.","role":"breakfast","steps":[{"active":true,"eq":["micro"],"est":true,"info":false,"min":0,"min_text":null,"t":"Пекутся вечером накануне завтрака вместе с другими заготовками или утром. Творог — вес по таблице «Вся партия» (обычно 1 пачка 300 г); покупать в день выпечки. Испечённые заранее сырники утром разогреть 40–60 с в микроволновке под крышкой и есть горячими.","when":"day_of"},{"active":true,"eq":["oven"],"est":true,"info":false,"min":0,"min_text":null,"t":"Включите духовку на 190 °C (режим верх-низ). Застелите противень пергаментом и смажьте его тонким слоем масла кисточкой (это примерно половина масла по рецепту).","when":"day_of"},{"active":true,"eq":["blender","bowl"],"est":true,"info":false,"min":0,"min_text":null,"t":"Выложите творог в миску. Если в пачке есть жидкость (сыворотка), слейте её. Разомните творог вилкой до однородности, а для нежной текстуры пробейте погружным блендером 20–30 секунд.","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":14,"min_text":120,"t":"Добавьте яйцо, сахар и соль, перемешайте. Всыпьте муку по 1 ст. л. (примерно 4/5 всей муки по рецепту) и перемешайте ложкой. Тесто должно быть мягким, держать форму и лишь слегка липнуть к мокрым рукам. Если оно растекается, добавьте ещё 1–2 ч. л. муки.","when":"day_of"},{"active":true,"eq":["board"],"est":true,"info":false,"min":0,"min_text":null,"t":"Насыпьте оставшуюся муку на тарелку. Набирайте тесто столовой ложкой (около 50 г, из пачки творога выйдет 8–9 штук), обваляйте в муке шариком, расплющите в шайбу толщиной 1,5–2 см и диаметром 6–7 см. Края подровняйте ножом.","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":0,"min_text":null,"t":"Выложите сырники на пергамент на расстоянии 2 см. Остатком масла тонко смажьте их сверху кисточкой: так они зарумянятся без жарки.","when":"day_of"},{"active":false,"eq":["oven"],"est":false,"info":false,"min":15,"min_text":15,"t":"Поставьте противень на средний уровень и выпекайте 15 минут. Затем переверните каждый сырник широкой лопаткой и пеките ещё 8–10 минут, пока обе стороны не станут золотистыми.","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":1,"min_text":5,"t":"Достаньте и дайте постоять 5 минут: горячие сырники мягкие, а при остывании схватываются.","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":0,"min_text":null,"t":"Подавайте со сметаной 15 % (порция сметаны из таблицы). Раздели по весу из таблицы.","when":"day_of"},{"active":true,"eq":["oven","fridge","container"],"est":true,"info":false,"min":5,"min_text":15,"t":"Если в духовке есть другие заготовки при 190–200 °C (котлеты, курица), сырники можно поставить ярусом ниже: 15 минут, перевернуть, ещё 10–12 минут (внизу они румянятся медленнее). Полностью остывшие сырники сложите в контейнер с крышкой и уберите в холодильник. Сметану держите отдельно.","when":"day_of"},{"active":false,"eq":["freezer","container"],"est":false,"freeze_step":true,"info":true,"min":0,"min_text":null,"t":"Заморозка (сырники): порции, которые не съедят в ближайшие 3 суток, сразу уйдут в морозилку. Остуди на решётке до комнатной температуры, разложи на доске в один слой и заморозь 1 час, потом пересыпь в пакет по порциям: одна порция = один завтрак одного человека, на пакете подпиши блюдо и дату. Срок в морозилке — до 30 суток. Размораживать не нужно: бери порцию прямо из морозилки.","when":"day_of"}],"storage":"Готовишь большой партией. В холодильнике в закрытом контейнере до 3 суток — столько, сколько съедят в ближайшие приёмы; остальное сразу после остывания в морозилку (до 30 суток). Остуди на решётке до комнатной температуры, разложи на доске в один слой и заморозь 1 час, потом пересыпь в пакет по порциям: одна порция = один завтрак одного человека, на пакете подпиши блюдо и дату. Размораживать не нужно: бери порцию прямо из морозилки.","tags":["work_ok","oven"],"total_min":45},"toast":{"active_min":3,"base":{"c":24.8,"f":1.8,"g":46,"kcal":133,"p":4},"batch":{"cook":"assembled","keeps_d":1,"mode":"assemble"},"eq":["oven","pan","stove"],"eq_text":["плита","сковорода (сухая, без масла) или духовка с решёткой","лопатка или щипцы"],"in_menu":true,"ing":[{"g":50,"id":"toast_bread","note":"2 ломтика по ~25 г; хлеб без семян и кунжута"}],"keeps_d":1,"light":"Хлеб подсушен без масла, а не обжарен; хрустящий тост сытнее мягкого ломтика по ощущениям при том же весе.","mode":"assemble","name":"Тост из тостового хлеба","notes":"Проверяй состав: тостовый хлеб без кунжута и семечек. На работу тост в контейнере не берут: в микроволновке он размякает; Сереже лучше просто ломтики хлеба в пакете.","portion":{"addon_min_g":25,"her":{"max_g":80}},"reheat":"Не разогревают.","role":"bread","steps":[{"active":false,"eq":[],"est":false,"info":true,"min":0,"min_text":null,"t":"Подсушивается утром прямо перед едой, пока готовится основное блюдо. Вес её и его порции — в таблице.","when":"day_of"},{"active":true,"eq":["pan"],"est":true,"info":false,"min":0,"min_text":1,"t":"Поставь сухую сковороду на средний огонь на 1 мин. Масло не нужно.","when":"day_of"},{"active":true,"eq":["oven","pan"],"est":true,"info":false,"min":3,"min_text":5,"t":"Выложи ломтики и подсуши 1–1,5 мин до золотистых пятен, переверни и держи ещё 1 мин. Если сковорода занята омлетом — духовка: решётка в середине, 200 °C, 4–5 мин без переворачивания (или гриль 2–3 мин, не отходя: подгорает быстро).","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":0,"min_text":null,"t":"Сразу поставь тосты на ребро или положи на решётку, а не стопкой на тарелку: так снизу не отсыреют от пара.","when":"day_of"}],"storage":"Подсушивать перед едой. Хлеб в закрытом пакете при комнатной температуре — по сроку на упаковке (обычно 4–5 дней).","tags":["assembled","sandwich","oven"],"total_min":5},"turkey_cutlets":{"active_min":25,"base":{"c":9.8,"f":7.6,"g":160,"kcal":250,"p":36.1},"batch":{"cook":"evening_before","freeze_d":21,"keeps_d":3,"mode":"cook","sunday_prep":true},"eq":["blender","board","bowl","container","freezer","fridge","grater","oven","stove"],"eq_text":["духовка","противень","пергамент","погружной блендер с чоппером (или острый нож и доска)","мелкая тёрка","большая миска","кисточка","контейнеры с крышками"],"in_menu":true,"ing":[{"g":150,"id":"chicken_fillet","note":"эскалоп курицы: порубить ножом в мелкий кубик 4–5 мм или измельчить чоппером погружного блендера импульсами"},{"g":35,"id":"onion","note":"на мелкой тёрке или в чоппере вместе с соком: даёт сочность"},{"id":"egg","note":"","pcs":0.17},{"g":5,"id":"potato_starch","note":"крахмал держит сок внутри"},{"g":10,"id":"sour_cream_15","note":"в фарш для нежности"},{"g":2,"id":"dill","note":"мелко порубить"},{"g":1,"id":"garlic","note":"на мелкой тёрке"},{"g":0.7,"id":"sunflower_oil","note":"только смазать верх котлет кисточкой"},{"g":1.5,"id":"salt","note":""},{"g":0.2,"id":"black_pepper","note":"молотый"},{"g":0.4,"id":"thyme","note":"в фарш; мягкая специя, не острая"},{"g":0.4,"id":"coriander_ground","note":"в фарш; мягкая специя, не острая"},{"g":1,"id":"paprika_sweet","note":"в фарш; мягкая специя, не острая"},{"g":1.5,"id":"chicken_turkey_seasoning","note":"в фарш вместо части соли; в смеси может быть соль, пробуй до досаливания"}],"keeps_d":3,"light":"Чистая куриная грудка вместо свино-говяжьего фарша; без хлеба в молоке и без обжарки в масле — запекание на пергаменте, масла 1 ч. л. на противень. Сочность дают тёртый лук, сметана 15 % и крахмал.","mode":"cook","name":"Котлеты из курицы в духовке","notes":"К гречке, пюре или тёплым овощам; к тёплым котлетам — свежий помидор, не огурец. Укроп и сметана — общие упаковки недели. Порции подгоняет программа: ему больше котлет, ей меньше гарнира.","portion":{"her":{"max_g":130}},"reheat":"Под неплотной крышкой с 1 ст. л. воды, микроволновка 1–1,5 мин на 800 Вт (вместе с гарниром — 2–2,5 мин). Из морозилки: микроволновка 2–3 мин под крышкой или сковорода без масла под крышкой 5–6 мин; сверху ложка воды.","role":"main","steps":[{"active":false,"eq":["oven","stove","fridge","freezer","container"],"est":false,"info":true,"min":0,"min_text":null,"t":"Готовится вечером накануне или в день первого приёма партией на несколько приёмов (ему — в контейнер), хранится до 3 суток. Вес продуктов на всю партию — в таблице «Вся партия». Пока котлеты в духовке, на плите можно сварить гречку или пюре. Курицу из морозилки разморозь в холодильнике за ночь.","when":"day_of"},{"active":true,"eq":["board"],"est":true,"info":false,"min":5,"min_text":null,"t":"Курицу обсуши и нарежь полосками 1 см. Измельчи в чоппере короткими импульсами по 2–3 с до мелкой крошки (не в пасту) или поруби ножом в кубик 4–5 мм — рубленые котлеты получаются сочнее.","when":"day_of"},{"active":false,"eq":["oven","grater","bowl"],"est":false,"info":false,"min":10,"min_text":10,"t":"Лук натри на мелкой тёрке. В миске смешай курицу, лук с соком, яйцо, крахмал, сметану, укроп, чеснок, соль и перец. Вымешивай рукой 2–3 мин и отбей фарш о дно миски 10–15 раз: так котлеты не развалятся. Дай постоять 10 мин, пока греется духовка.","when":"day_of"},{"active":true,"eq":["oven"],"est":true,"info":false,"min":5,"min_text":null,"t":"Разогрей духовку до 200 °C (верх-низ). Противень застели пергаментом. Мокрыми руками сформируй котлеты по ~100 г, толщиной 2 см, и выложи с промежутком 2 см.","when":"day_of"},{"active":false,"eq":["oven"],"est":true,"info":false,"min":30,"min_text":60,"t":"Смажь верх котлет маслом кисточкой (1 ч. л. на весь противень) и запекай на среднем уровне 20–22 мин.","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":15,"min_text":5,"t":"Проверь: котлета упругая, сок при проколе прозрачный. Если хочется румянее — ещё 3–5 мин на верхнем уровне. Дольше не держи: курица пересохнет.","when":"day_of"},{"active":false,"eq":["fridge","container"],"est":false,"info":false,"min":30,"min_text":30,"t":"Дай постоять на противне 5 мин, затем остуди 30 мин, разложи по контейнерам и убери в холодильник.","when":"day_of"},{"active":false,"eq":["freezer","container"],"est":false,"freeze_step":true,"info":true,"min":0,"min_text":null,"t":"Заморозка (котлеты): порции, которые не съедят в ближайшие 3 суток, сразу уйдут в морозилку. Остуди (не дольше 2 часов на столе), разложи по порциям в плоские зип-пакеты или контейнеры: одна порция = один приём пищи одного человека, на пакете подпиши блюдо и дату. Пакеты клади в морозилку плоско, после замерзания ставь стопкой или на ребро. Срок в морозилке — до 21 суток. Накануне вечером переложи нужную порцию из морозилки на полку холодильника (на ночь), утром она готова к разогреву. Если забыла — микроволновка в режиме разморозки 5–6 мин.","when":"day_of"}],"storage":"Готовишь большой партией. В холодильнике в закрытом контейнере до 3 суток — столько, сколько съедят в ближайшие приёмы; остальное сразу после остывания в морозилку (до 21 суток). Заморозка: Остуди (не дольше 2 часов на столе), разложи по порциям в плоские зип-пакеты или контейнеры: одна порция = один приём пищи одного человека, на пакете подпиши блюдо и дату. Пакеты клади в морозилку плоско, после замерзания ставь стопкой или на ребро.  Накануне вечером переложи нужную порцию из морозилки на полку холодильника (на ночь), утром она готова к разогреву. Если забыла — микроволновка в режиме разморозки 5–6 мин.","tags":["work_ok","oven"],"total_min":55},"udon_chicken_mush":{"active_min":30,"base":{"c":64.5,"f":6.2,"g":335,"kcal":463,"p":39},"batch":{"cook":"evening_before","keeps_d":3,"mode":"cook"},"eq":["board","bowl","container","fridge","grater","pan","pot","stove"],"eq_text":["плита","кастрюля 4–5 л для лапши","сковорода 28 см или вок","дуршлаг","стакан для соуса","лопатка","нож и доска","мелкая тёрка","контейнеры с крышками"],"in_menu":true,"ing":[{"g":60,"id":"udon","note":"сухая пшеничная лапша без соуса и кунжута; на партию из 4 порций ~250 г (больше половины пачки 400 г)"},{"g":120,"id":"chicken_fillet","note":"филе грудки, тонкими полосками 5 мм × 5 см; на партию ~500 г (2 филе)"},{"g":60,"id":"champignons","note":"пластинками 4 мм; на партию ~250 г (2/3 пачки 400 г)"},{"g":50,"id":"white_cabbage","note":"тонкой соломкой; на партию ~200 г"},{"g":30,"id":"carrot","note":"тонкой соломкой; на партию 1 средняя морковь"},{"g":40,"id":"bell_pepper","note":"полосками 5 мм; на партию 1 небольшой перец"},{"g":25,"id":"onion","note":"тонкими полукольцами; на партию 1 средняя луковица"},{"g":2,"id":"garlic","note":"на мелкой тёрке; на партию 3 зубчика"},{"g":0.5,"id":"ginger_ground","note":"на партию 1/2 ч. л."},{"g":15,"id":"soy_sauce","note":"без кунжута; на партию 4 ст. л."},{"g":5,"id":"sugar","note":"в соус терияки; на партию 1 ст. л. с небольшой горкой (~20 г)"},{"g":3,"id":"rice_vinegar","note":"в соус; на партию 1 ст. л."},{"g":2,"id":"potato_starch","note":"в соус; на партию 2,5 ч. л."},{"g":1.25,"id":"sunflower_oil","note":"на курицу; на партию 1 ч. л. (5 г)"},{"g":0.4,"id":"coriander_ground","note":"к курице; мягкая специя, не острая"},{"g":1.5,"id":"mushroom_veg_seasoning","note":"к курице и грибам вместо части соли; в смеси может быть соль, пробуй до досаливания"},{"g":0.5,"id":"curry_powder","note":"в соус, мягкая добавка; мягкая специя, не острая"}],"keeps_d":3,"light":"Соус терияки домашний: сладость от 1 ст. л. сахара на всю партию, густота от крахмала, а не от масла. Масла 1 ч. л. на партию, грибы жарятся без масла. Овощей по объёму больше, чем лапши.","mode":"cook","name":"Удон с курицей, шампиньонами и овощами в соусе терияки","notes":"Терияки здесь именно соус для лапши (Маше так нравится); просто курицу терияки отдельным блюдом не делать. Без кунжута: проверить составы удона и соевого соуса. Остаток удона (~150 г) хранится в закрытой пачке. Остаток шампиньонов (~150 г) — в омлет или фрикасе в ближайшие 2 дня. Порции подгоняет программа: ему больше курицы и лапши.","portion":{"her":{"max_g":300}},"reheat":"Сбрызнуть 1–2 ст. л. воды, крышку неплотно, микроволновка 2–2,5 мин на 800 Вт, перемешать на середине.","role":"main","steps":[{"active":false,"eq":[],"est":false,"info":true,"min":0,"min_text":null,"t":"Готовится партией на 2 дня (4 порции). На партию: ~250 г удона, ~500 г филе, ~250 г шампиньонов, ~200 г капусты, 1 морковь, 1 перец, 1 луковица, 3 зубчика чеснока, 4 ст. л. соевого соуса, 1 ст. л. сахара с небольшой горкой, 1 ст. л. рисового уксуса, 1/2 ч. л. молотого имбиря, 2,5 ч. л. крахмала, 1 ч. л. масла. Поставь 3 л воды для лапши (не солить).","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":1,"min_text":null,"t":"Соус терияки: в стакане размешай соевый соус, сахар, рисовый уксус, имбирь, чеснок, крахмал и 100 мл холодной воды до растворения сахара.","when":"day_of"},{"active":true,"eq":["pot"],"est":true,"info":false,"min":6,"min_text":10,"t":"Отвари удон по пачке (обычно 8–10 мин), разделяя пучки вилкой. Откинь на дуршлаг и промой холодной водой 30 с, чтобы не слиплась.","when":"day_of"},{"active":true,"eq":["pan","stove","bowl"],"est":true,"info":false,"min":4,"min_text":6,"t":"Сковороду прогрей на сильном огне 2 мин, выложи грибы без масла и жарь 5–6 мин, пока вода не выпарится. Переложи в миску.","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":15,"min_text":60,"t":"Налей 1 ч. л. масла, выложи курицу одним слоем, жарь 2 мин не трогая, перемешай и жарь ещё 2 мин до белизны. Переложи к грибам.","when":"day_of"},{"active":true,"eq":["pan","stove"],"est":true,"info":false,"min":3,"min_text":5,"t":"В ту же сковороду выложи лук, морковь, капусту и перец с 3 ст. л. воды и жарь на сильном огне 4–5 мин, помешивая: овощи станут мягче, но останутся хрустящими.","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":1,"min_text":2,"t":"Верни курицу и грибы, перемешай соус (крахмал оседает) и влей. Помешивая, прогревай 1–2 мин, пока соус не загустеет и не станет глянцевым.","when":"day_of"},{"active":false,"eq":["fridge","container"],"est":true,"info":false,"min":5,"min_text":30,"t":"Добавь лапшу и перемешай 1–2 мин, чтобы она вся покрылась соусом. Разложи по 4 контейнерам, остуди 20–30 мин без крышки и убери в холодильник.","when":"day_of"}],"storage":"Партия на 2 дня: в холодильнике в закрытых контейнерах до 2 суток.","tags":["work_ok","pasta"],"total_min":35},"yogurt_him":{"active_min":0,"base":{"c":10.5,"f":5,"g":250,"kcal":167,"p":20},"batch":{"cook":"assembled","keeps_d":1,"mode":"ready"},"eq":["board","container","fridge"],"eq_text":["ложка","маленький холодильный пакет или холодильник на работе"],"in_menu":true,"ing":[{"g":250,"id":"yogurt_teos","note":"его йогурт Teos греческий, 1 стаканчик 250 г"}],"keeps_d":1,"light":"Плотный густой йогурт с высоким белком: сытный перекус без сахара и выпечки.","mode":"ready","name":"Йогурт Teos (для него)","notes":"Только для него (ей Teos не подходит: это греческий йогурт). Порция — 1 стаканчик Teos 250 г целиком.","portion":{"fixed_g":250},"reheat":"Не разогревать.","role":"snack","steps":[{"active":false,"eq":[],"est":false,"info":true,"min":0,"min_text":null,"t":"Готовить ничего не нужно: это его порция, ей в этот перекус — персиковый питьевой йогурт.","when":"day_of"},{"active":true,"eq":["fridge","container"],"est":true,"info":false,"min":0,"min_text":null,"t":"Утром положи стаканчик в сумку рядом с контейнером, на работе — сразу в холодильник.","when":"day_of"},{"active":true,"eq":["board"],"est":true,"info":false,"min":0,"min_text":null,"t":"Ест холодным ложкой; можно нарезать в него грушу или банан из того же перекуса.","when":"day_of"},{"active":true,"eq":["fridge"],"est":true,"info":false,"min":0,"min_text":180,"t":"Без холодильника — не дольше 2–3 ч.","when":"day_of"}],"storage":"Закрытый — в холодильнике до даты на упаковке; вскрытый — съесть в тот же день.","tags":["work_ok","assembled","ready"],"total_min":1},"zharkoe_turkey":{"active_min":25,"base":{"c":53.1,"f":7.9,"g":460,"kcal":451,"p":43},"batch":{"cook":"evening_before","keeps_d":3,"mode":"cook"},"eq":["board","bowl","container","fridge","kettle","oven"],"eq_text":["духовка","глубокая форма для запекания 3–4 л или глубокий противень (если формы меньше — две формы)","фольга","доска и нож","миска","чайник для горячей воды","контейнеры с крышкой"],"in_menu":true,"ing":[{"g":160,"id":"chicken_fillet","note":"эскалоп (пласты филе куриной грудки толщиной 1–1,5 см), куски ~3×3 см; на ~6 порций 2 пачки по 500 г"},{"g":220,"id":"potato","note":"вес очищенного (≈260 г нечищеного); куски 3–4 см"},{"g":60,"id":"carrot","note":"очищенная, кружки 1 см"},{"g":40,"id":"onion","note":"очищенный, крупные полукольца"},{"g":40,"id":"tomato","note":"свежий, кубик 1–2 см; из той же покупки, что для нарезки недели"},{"g":10,"id":"tomato_paste","note":"развести в горячей воде для заливки; на ~6 порций почти весь стик 70 г"},{"g":3,"id":"garlic","note":"1 небольшой зубчик, раздавить и мелко нарезать"},{"g":2.5,"id":"sunflower_oil","note":"на всю форму (~6 порций) 1 ст. л. без горки: половину на картофель, половину на курицу"},{"g":1.5,"id":"paprika_sweet","note":"≈3/4 ч. л.: половину на картофель, половину на курицу"},{"g":2.5,"id":"salt","note":"≈1/2 ч. л. без горки: половину на картофель, половину на курицу"},{"g":0.2,"id":"black_pepper","note":"щепотка"},{"g":0.1,"id":"bay_leaf","note":"1–2 листа на всю форму"},{"g":0.5,"id":"coriander_ground","note":"к мясу; мягкая специя, не острая"},{"g":0.3,"id":"thyme","note":"к мясу; мягкая специя, не острая"},{"g":1.5,"id":"chicken_turkey_seasoning","note":"к мясу вместо части соли; в смеси может быть соль, пробуй до досаливания"}],"keeps_d":3,"light":"Куриное филе вместо свиного окорока: жира в 10 раз меньше, белка почти вдвое больше. Без обжарки: всё тушится под фольгой, масла 1 ст. л. на всю форму (~2,5 г на порцию). Курицу закладывают на последние 35 мин, а не на полтора часа, поэтому она остаётся сочной. Вкус дают томатная паста, помидор, чеснок и паприка, а не жир; без майонеза и сметаны. Картофеля и моркови больше, чем мяса, гарнир уже внутри.","mode":"cook","name":"Жаркое с курицей и картофелем","notes":"Курица — эскалоп из филе грудки в пачках по 500 г; купить в день готовки или накануне. Томатная паста — стик 70 г; если немного останется, хранить в холодильнике под плёнкой до 7 дней и добавить в пастуший пирог или креветки в соусе в Вс. Если формы на 3–4 л нет, разделите на две формы и поставьте их рядом на один уровень или на два уровня, поменяв местами при закладке курицы. Порции подгонит программа: ему больше, ей меньше; к жаркому идёт только овощная нарезка.","portion":{},"reheat":"Микроволновка 2–2,5 мин под крышкой, добавив 1 ст. л. воды, перемешать на середине; курицу не перегревать. Или всю форму в духовке при 180 °C 15 мин под фольгой.","role":"main","steps":[{"active":false,"eq":["oven"],"est":false,"info":true,"min":0,"min_text":null,"t":"Готовится в Ср вечером одной партией на ужины Ср, Чт и Пт на двоих (около 6 порций). Сколько взять на всю партию, видно в столбце «Вся партия»; ориентир на 6 порций: 2 пачки курицы по 500 г, ~1,3 кг очищенного картофеля, 3–4 моркови, 2 луковицы, 2 помидора, стик томатной пасты 70 г. Начните сессию готовки с жаркого: картофель с овощами ставится в духовку первым, а пока он томится, можно делать остальные блюда. Включите духовку на 200 °C (режим верх-низ).","when":"day_of"},{"active":true,"eq":["board"],"est":true,"info":false,"min":3,"min_text":null,"t":"Картофель очистите и нарежьте крупно, 3–4 см (мелкие кусочки разварятся). Морковь нарежьте кружками 1 см, лук — крупными полукольцами, помидор — кубиком 1–2 см.","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":3,"min_text":null,"t":"Выложите в форму картофель, морковь и лук, полейте половиной масла, посыпьте половиной соли и половиной паприки и перемешайте руками прямо в форме. Сверху разложите помидор и лавровый лист.","when":"day_of"},{"active":false,"eq":["kettle"],"est":false,"info":false,"min":40,"min_text":40,"t":"Разведите томатную пасту в горячей воде из чайника — примерно 70 мл воды на порцию (на 6 порций ≈ 400 мл) — и влейте в форму: жидкость должна доходить до 1/3 высоты овощей, не больше, чтобы картофель тушился, а не варился. Плотно накройте фольгой и загните края за борта формы. Поставьте на средний уровень на 40 мин.","when":"day_of"},{"active":true,"eq":["board","bowl"],"est":true,"info":false,"min":3,"min_text":null,"t":"Пока картофель томится, обсушите курицу полотенцем и нарежьте эскалопы кусками примерно 3×3 см. В миске перемешайте курицу с оставшимся маслом, паприкой, солью, перцем и чесноком и оставьте до закладки.","when":"day_of"},{"active":false,"eq":["oven"],"est":false,"info":false,"min":40,"min_text":40,"t":"Через 40 мин достаньте форму и осторожно приподнимите фольгу от себя (выйдет горячий пар). Разложите курицу поверх картофеля одним слоем и слегка утопите в соус. Снова плотно накройте фольгой и запекайте ещё 25 мин. Грудка курицы при долгом тушении сохнет, поэтому её кладут позже картофеля.","when":"day_of"},{"active":true,"eq":["board"],"est":true,"info":false,"min":16,"min_text":10,"t":"Проверьте готовность: картофель легко протыкается ножом, самый крупный кусок курицы на разрезе белый, без розового. Если картофель ещё твёрдый, накройте и подержите ещё 10 мин.","when":"day_of"},{"active":false,"eq":["oven"],"est":false,"info":false,"min":10,"min_text":10,"t":"Снимите фольгу, аккуратно перемешайте снизу вверх и запекайте без фольги ещё 10 мин при 200 °C, чтобы верх подрумянился, а лишняя жидкость выпарилась. На дне должно остаться немного густого соуса: он не даст курице пересохнуть при разогреве. Выньте лавровый лист.","when":"day_of"},{"active":false,"eq":["fridge","container"],"est":false,"info":false,"min":40,"min_text":40,"t":"Порции на ужин в Ср разложите сразу. Остальное остудите 30–40 мин, разложите по контейнерам вместе с соусом со дна (или оставьте в форме, накрыв крышкой или плёнкой) и уберите в холодильник.","when":"day_of"}],"storage":"Партия на 3 дня (ужины Ср–Пт): в холодильнике до 3 дней в закрытых контейнерах или в форме под плёнкой.","tags":["work_ok","oven"],"total_min":95}},"equipment":{"blender":"Блендер","board":"Нож и доска","bowl":"Миска","container":"Контейнеры","freezer":"Морозилка","fridge":"Холодильник","grater":"Тёрка","grinder":"Мясорубка Polaris","kettle":"Чайник","mc":"Мультиварка Cuckoo","micro":"Микроволновка","oven":"Духовка","pan":"Сковорода","pot":"Кастрюля / ковш","stove":"Плита"},"experiments":[],"freezer":[{"freeze":"portioned","g":728,"id":"pollock_fillet","name":"Филе минтая замороженное","put":0,"put_date":"2026-11-22","sold_frozen":true,"src":["v01b55"],"take":3,"take_date":"2026-11-25","thaw_on":2,"wrap":false},{"freeze":"raw","g":396,"id":"chicken_fillet","name":"Филе куриной грудки охлаждённое","put":0,"put_date":"2026-11-22","sold_frozen":false,"src":["v01b52"],"take":6,"take_date":"2026-11-28","thaw_on":5,"wrap":false},{"freeze":"raw","g":3054,"id":"chicken_fillet","name":"Филе куриной грудки охлаждённое","put":0,"put_date":"2026-11-22","sold_frozen":false,"src":["v01b40","v02b26","v02b27"],"take":7,"take_date":"2026-11-29","thaw_on":6,"wrap":false},{"freeze":"raw","g":652,"id":"chicken_fillet","name":"Филе куриной грудки охлаждённое","put":0,"put_date":"2026-11-22","sold_frozen":false,"src":["v02b88"],"take":10,"take_date":"2026-12-02","thaw_on":9,"wrap":false},{"freeze":"raw","g":555,"id":"chicken_fillet","name":"Филе куриной грудки охлаждённое","put":0,"put_date":"2026-11-22","so   function fmtRemain(sec) { if (sec <= 0) return 'время!'; var m = Math.floor(sec / 60), r = sec % 60; return m + ':' + (r < 10 ? '0' : '') + r; }

  App.on('step-next', function (el) {

/* js/screens/sync.js */
/* sync.js — экран «Перенос данных» (#sync): код со всеми отметками, чтобы перенести их с телефона на компьютер и обратно.
   Нужен, когда сайт открыт без общей базы (локальная копия или GitHub Pages): там всё хранится только в браузере устройства.
   Код = «ZK1:» + base64(JSON { коллекция: { id: документ } }). Загрузка кода заменяет только совпадающие записи. */
(function () {
  'use strict';
  var esc = App.esc;
  var msg = '';

  function pack() {
    var out = {}, n = 0;
    Store.COLLS.forEach(function (c) { Store.list(c).forEach(function (p) { (out[c] = out[c] || {})[p[0]] = p[1]; n++; }); });
    return { code: 'ZK1:' + btoa(unescape(encodeURIComponent(JSON.stringify(out)))), n: n };
  }
  function unpack(code) {
    code = String(code || '').replace(/\s+/g, '');
    if (code.indexOf('ZK1:') !== 0) throw new Error('код должен начинаться с ZK1:');
    return JSON.parse(decodeURIComponent(escape(atob(code.slice(4)))));
  }

  App.on('sync-copy', function () {
    var p = pack(), ta = document.getElementById('sync-out'); if (ta) ta.value = p.code;
    Shopping.copy(p.code).then(function (ok) { msg = ok ? 'Код скопирован: ' + p.n + ' записей. Вставь его на другом устройстве.' : 'Не удалось скопировать: выдели код ниже и скопируй вручную.'; App.toast(msg); App.rerender(); });
  });
  App.on('sync-load', function () {
    var ta = document.getElementById('sync-in'), n = 0;
    try {
      var d = unpack(ta && ta.value);
      Object.keys(d).forEach(function (c) { if (Store.COLLS.indexOf(c) < 0) return; Object.keys(d[c]).forEach(function (id) { Store.set(c, id, d[c][id]); n++; }); });
      msg = 'Загрузила ' + n + ' записей.';
    } catch (e) { msg = 'Не получилось прочитать код: ' + e.message; }
    App.toast(msg); App.rerender();
  });

  /* общая база (Supabase): код подключения */
  function keyLink() { return location.origin + location.pathname + '#key=' + Store.cloudCode(); }
  App.on('sync-code-new', function () { Store.setCloudCode(Store.newCloudCode()); location.reload(); });
  App.on('sync-code-set', function () {
    var i = document.getElementById('sync-code'), v = i ? String(i.value || '').trim() : '';
    if (!Store.setCloudCode(v)) { App.toast('Код: 16–64 символов, только латиница, цифры, - и _'); return; }
    location.reload();
  });
  App.on('sync-code-off', function () { Store.setCloudCode(''); location.reload(); });
  App.on('sync-code-copy', function () { Shopping.copy(keyLink()).then(function (ok) { App.toast(ok ? 'Ссылка скопирована. Открой её на другом устройстве.' : 'Не удалось скопировать'); }); });

  function cloudCard() {
    if (!Store.cloudConfigured || Store.backend === 'db') return '';
    if (Store.backend === 'cloud') {
      var st = Store.cloudOk === false ? 'нет связи с базой, данные сохраняются на устройстве и отправятся позже' : Store.cloudOk ? 'связь с базой есть' : 'подключаюсь…';
      return '<section class="card g8"><div style="font-size:15px;font-weight:800">Общая база подключена</div><div class="small">Отметки с этого устройства сохраняются в общую базу и появляются на других устройствах (обновление примерно раз в 20 секунд или при открытии). Сейчас: ' + esc(st) + '.</div>' +
        '<div class="small">Другие устройства подключаются сами: достаточно открыть этот сайт.</div>' +
        '<button type="button" class="textbtn" data-act="sync-code-off">Отключить общую базу на этом устройстве</button></section>';
    }
    return '<section class="card g8"><div style="font-size:15px;font-weight:800">Общая база: не подключена</div>' +
      '<div class="small">Если подключить общую базу, отметки с телефона и компьютера будут одинаковыми. На первом устройстве создай код, на остальных открой ссылку с кодом или впиши код сюда.</div>' +
      Ui.btn('Подключить общую базу', { primary: true, act: 'sync-code-set' }) +
      '<input class="inp" id="sync-code" maxlength="64" placeholder="Или впиши уже созданный код" aria-label="Код общей базы">' +
      Ui.btn('Подключить по коду', { act: 'sync-code-set' }) + '</section>';
  }

  App.screen('sync', {
    tab: null, title: 'Общая база и перенос',
    render: function () {
      var shared = Store.backend === 'db' || Store.backend === 'cloud', p = pack();
      return '<main class="screen">' + Ui.backRow('Ещё', '#more') +
        '<div class="col g2"><h1 class="h-greet">Общая база и перенос</h1><div class="cap bold" style="font-size:13px;font-weight:700">' + (shared ? 'Здесь данные общие: телефон и компьютер видят одно и то же.' : 'Здесь данные хранятся только на этом устройстве.') + '</div></div>' + cloudCard() +
        (shared ? '' : '<section class="card g6"><div class="small">Чтобы то, что ты отметила на телефоне, появилось на компьютере: нажми «Скопировать мои данные» на телефоне, пришли код себе (заметки, мессенджер) и вставь его на компьютере в поле «Загрузить».</div></section>') +
        '<section class="card g8"><div style="font-size:15px;font-weight:800">Мои данные · ' + p.n + ' записей</div>' +
        Ui.btn('Скопировать мои данные', { primary: true, act: 'sync-copy' }) +
        '<textarea class="inp" id="sync-out" rows="3" readonly aria-label="Код с моими данными" onfocus="this.select()">' + esc(p.code) + '</textarea></section>' +
        '<section class="card g8"><div style="font-size:15px;font-weight:800">Загрузить данные с другого устройства</div>' +
        '<div class="small">Вставь код. Записи из кода заменят такие же записи здесь, остальное останется как есть.</div>' +
        '<textarea class="inp" id="sync-in" rows="3" placeholder="ZK1:…" aria-label="Код с другого устройства"></textarea>' +
        Ui.btn('Загрузить', { act: 'sync-load' }) + '</section>' +
        '</main>';
    }
  });
})();

/* js/screens/receipt.js */
/* receipt.js — «Чек» (#receipt-<id>) и список чеков (#receipt). Фото чека грузится через capability assets.
   Запись чека: Store 'shop' / 'receipts' = { list:[ { id, asset, store, tripId, k, week, date, at, lines?:[{name,plan,fact}], factTotal? } ] }.
   Разбор строк (lines, factTotal) пишет Claude по просьбе в тот же документ (state-shop/receipts). Без assets кнопка загрузки скрыта.
   Отладка: ?mockassets — подставляет фальшивую загрузку (только для локального просмотра). */
(function () {
  'use strict';
  var esc = App.esc, D = App.D;

  Shopping.css('css-b-receipt', '' +
    '.paper{width:100%;border-radius:14px;overflow:hidden;background:var(--text);padding:0}.paper img{width:100%;max-height:200px;object-fit:cover;display:block}' +
    '.paper button{display:block;width:100%}' +
    '.rrow{display:flex;align-items:baseline;gap:10px;padding:3px 0}.rrow .nm{flex:1;min-width:0;font-size:14px;font-weight:700}.rrow .pl{font-size:13px;font-weight:600;color:var(--text-2)}.rrow .fc{font-size:14px;font-weight:800;min-width:34px;text-align:right}.rrow .dl{font-size:12px;font-weight:700;min-width:34px;text-align:right}' +
    '.rlist{display:flex;align-items:center;gap:12px;width:100%;text-align:left}.rlist .th{width:56px;height:56px;border-radius:12px;object-fit:cover;background:var(--text);flex:none}' +
    '.rlist .nm{font-size:14px;font-weight:800}.rbig{width:100%;border-radius:14px;display:block;max-height:70vh;object-fit:contain;background:var(--bg)}');

  var Receipts = window.Receipts = {
    assets: null, ready: false, mock: /[?&]mockassets/.test(location.search), _map: {},
    can: function () { return !!Receipts.assets; },
    urlFor: function (r) {
      if (!r || !r.asset) return '';
      if (Receipts._map[r.asset]) return Receipts._map[r.asset];
      return '/_blob/' + r.asset;
    },
    get: function (id) { return Shopping.receipts().filter(function (r) { return r.id === id; })[0] || null; },
    pick: function (ctx) {
      if (!Receipts.assets) { App.toast('Загрузка фото здесь недоступна'); return; }
      Receipts._ctx = ctx || {};
      var inp = Receipts._inp;
      if (!inp) {
        inp = Receipts._inp = document.createElement('input');
        inp.type = 'file'; inp.accept = 'image/*'; inp.setAttribute('capture', 'environment'); inp.hidden = true; inp.setAttribute('aria-hidden', 'true');
        inp.addEventListener('change', onFile); document.body.appendChild(inp);
      }
      inp.value = ''; inp.click();
    }
  };

  function init() {
    var p;
    if (Receipts.mock) {
      Receipts.assets = {
        upload: function (blob) {
          return new Promise(function (res, rej) {
            var fr = new FileReader(); fr.onload = function () { var id = 'mock' + Date.now().toString(36); Receipts._map[id] = fr.result; res({ id: id, url: fr.result }); }; fr.onerror = function () { rej({ code: 'upstream_error' }); }; fr.readAsDataURL(blob);
          });
        }
      };
      Receipts.ready = true; App.rerender(); return;
    }
    p = Promise.resolve().then(function () { return window.claude && window.claude.use ? window.claude.use('assets') : null; });
    p.then(function (a) { Receipts.assets = a || null; }, function () { Receipts.assets = null; }).then(function () { Receipts.ready = true; App.rerender(); });
  }
  (Store.ready || Promise.resolve()).then(init, init);

  function onFile() {
    var inp = Receipts._inp, f = inp && inp.files && inp.files[0]; if (!f) return;
    var ctx = Receipts._ctx || {};
    App.toast('Загружаю фото…');
    Receipts.assets.upload(f).then(function (res) {
      var id = 'r' + Date.now().toString(36);
      if (Receipts.mock) Receipts._map[res.id] = res.url;
      Store.mutate('shop', 'receipts', function (d) {
        d.list = d.list || [];
        d.list.push({ id: id, asset: res.id, store: ctx.store || null, tripId: ctx.tripId || null, k: ctx.k == null ? 0 : ctx.k, week: ctx.week || null, date: ctx.date || App.D.now().date, at: Date.now() });
      });
      App.toast('Фото сохранено', { icon: 'check' });
      App.go(App.href('receipt', id));
    }, function (e) {
      var c = e && e.code;
      App.toast(c === 'too_large' ? 'Фото слишком большое' : c === 'unsupported_type' ? 'Нужен снимок: jpg, png или webp' : c === 'quota_or_state' ? 'Место для файлов закончилось' : c === 'rate_limited' ? 'Слишком часто — попробуй через минуту' : 'Не получилось загрузить фото');
    });
  }

  /* ---------- действия ---------- */
  App.on('rcpt-big', function (el) {
    var r = Receipts.get(el.getAttribute('data-id')); if (!r) return;
    App.sheet({ render: function () { return '<img class="rbig" src="' + esc(Receipts.urlFor(r)) + '" alt="Чек">' + Ui.btn('Закрыть', { act: 'sheet-close' }); } });
  });
  App.on('rcpt-store', function (el) {
    var id = el.getAttribute('data-id'), store = el.getAttribute('data-s'), r = Receipts.get(id); if (!r) return;
    var trip = null;
    if (r.week) { var W = Shopping.weeks()[r.week - 1]; trip = W && W.trips.filter(function (t) { return t.store === store; })[0]; }
    Store.mutate('shop', 'receipts', function (d) { (d.list || []).forEach(function (x) { if (x.id === id) { x.store = store; x.tripId = trip ? trip.id : null; } }); });
  });
  function planLines(r) {
    var f = r.tripId ? Shopping.findTrip(r.tripId) : null;
    return f ? f.trip.items.map(function (it) { return { name: Shopping.itemName(it), plan: it.cost, cap: Shopping.itemCap(it) }; }) : [];
  }
  App.on('rcpt-copy', function (el) {
    var r = Receipts.get(el.getAttribute('data-id')); if (!r) return;
    var pl = planLines(r), url = Receipts.urlFor(r);
    var text = 'Разбери, пожалуйста, чек из приложения «' + App.cfg.APP_NAME + '».\n' +
      'Чек: ' + (r.store ? Shopping.storeName(r.store) : 'магазин не указан') + ', ' + D.dm(r.date) + '. Фото: артефакт, файл ' + url + ' (id ' + r.asset + ').\n' +
      'План закупки (' + pl.length + ' поз., по ценам плана):\n' + pl.map(function (l) { return '- ' + l.name + ' (' + l.cap + ') — план ' + l.plan + ' ₽'; }).join('\n') + '\n' +
      'Что сделать: сопоставь строки чека с позициями плана, затем допиши в документ базы state-shop/receipts в запись list[id=' + r.id + '] поля lines: [{name, plan, fact}] и factTotal (число, ₽). ' +
      'Если цена за кг на рынке отличается, обнови state-prices/main → perKg[<id продукта>] = {v, date, src:"receipt"}.';
    Shopping.copy(text).then(function (ok) { App.toast(ok ? 'Запрос скопирован — вставь его в чат с Claude' : 'Не удалось скопировать'); });
  });

  function minus(n) { return n < 0 ? '−' + Math.abs(n) : n > 0 ? '+' + n : '0'; }

  function detail(r) {
    var sName = r.store ? Shopping.storeName(r.store) : 'магазин не указан', url = Receipts.urlFor(r);
    var kind = r.store ? Shopping.storeKind(r.store) : '';
    var sub = (kind === 'delivery' ? 'доставка, ' : kind === 'market' ? 'рынок, ' : '') + D.dm(r.date);
    var f = r.tripId ? Shopping.findTrip(r.tripId) : null, planTot = f ? f.trip.cost : null;
    var lines = r.lines || [];
    var stores = []; Object.keys(Data.plan.stores || {}).forEach(function (s) { var kd = Shopping.storeKind(s); if (kd === 'delivery' || kd === 'market' || kd === 'shop') stores.push(s); });
    var storeChips = '<div class="chips scroll" role="group" aria-label="Магазин чека">' + stores.map(function (s) {
      return '<button type="button" class="chip tiny' + (r.store === s ? ' on' : '') + '" data-act="rcpt-store" data-id="' + esc(r.id) + '" data-s="' + esc(s) + '">' + esc(Shopping.storeName(s)) + '</button>';
    }).join('') + '</div>';
    var rows = lines.map(function (l) {
      var d = (l.fact != null && l.plan != null) ? Math.round(l.fact - l.plan) : null;
      return '<div class="rrow"><span class="nm">' + esc(l.name) + '</span><span class="pl num">' + (l.plan != null ? esc(App.num(l.plan)) : '') + '</span><span class="fc num">' + (l.fact != null ? esc(App.num(l.fact)) : '—') + '</span><span class="dl num" style="color:' + (d == null ? 'var(--text-2)' : d <= 0 ? 'var(--mint)' : 'var(--danger)') + '">' + (d == null ? '' : minus(d)) + '</span></div>';
    }).join('');
    var total = '';
    if (r.factTotal != null && planTot != null) {
      var diff = Math.round(planTot - r.factTotal);
      total = '<section class="card hi g6"><div class="row"><span style="font-size:16px;font-weight:800">Итого</span><span class="spacer"></span><span class="num" style="font-size:16px;font-weight:800">' + esc(App.num(planTot) + ' → ' + App.num(Math.round(r.factTotal)) + ' ₽') + '</span></div>' +
        '<div class="row g6" style="font-size:13px;font-weight:700;color:' + (diff >= 0 ? 'var(--mint)' : 'var(--danger)') + '">' + (diff >= 0 ? 'Сэкономлено ' + App.num(diff) + ' ₽' : 'Дороже плана на ' + App.num(-diff) + ' ₽') + '</div></section>';
    } else if (r.factTotal != null) {

/* noprep.js — «День без заготовок» (#noprep): заготовку не успели. Два пути:
   А) «Начать короткую» — подмножество блюд (≤ PrepFlow.SHORT_MIN мин активной работы, нужные до среды), остальное откладывается;
   Б) «Перестроить меню» — приёмы пн–вт, зависящие от заготовки, заменяются быстрыми блюдами (через Data.setOverride, тип replace).
   Выбор хранится в Store 'prep' / '<id>' (status:'short'|'skipped'). */
(function () {
  'use strict';
  var esc = App.esc, D = App.D;

  var QUICK_MIN = 20;
  /* что заменить на быстрые блюда: приёмы пн–вт, где есть разогрев или еда из заготовок */
  function quickMenu(sunday) {
    var out = [], used = {};
    [1, 2].forEach(function (off) {
      var date = D.add(sunday, off);
      Data.meals(date).forEach(function (m) {
        if (m.status !== 'open') return;
        var all = m.items.her.concat(m.items.him);
        if (!all.some(function (it) { return it.act === 'reheat' || it.act === 'from_prep'; })) return;
        var best = null;
        Data.days.forEach(function (day) {
          var c = Data.rawMeal(day.d, m.slot), items = c.items.her.concat(c.items.him);
          if (!items.length || c.minutes > QUICK_MIN || used[c.title]) return;
          if (!items.every(function (it) { return it.act === 'cook' || it.act === 'assemble' || it.act === 'ready'; })) return;
          var diff = Math.abs(c.kcal.her - m.kcal.her) / (m.kcal.her || 1); if (diff > 0.15) return;
          if (!best || diff < best.diff - 1e-9 || (Math.abs(diff - best.diff) < 1e-9 && c.minutes < best.c.minutes)) best = { c: c, diff: diff };
        });
        if (best) { used[best.c.title] = 1; out.push({ date: date, slot: m.slot, m: m, c: best.c }); }
      });
    });
    out.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : D.hm(a.m.time.her) - D.hm(b.m.time.her); });

      d.status = 'short'; d.short = true; d.shortB = pick.take.map(function (t) { return t.b; }); d.deferredB = pick.deferred.map(function (t) { return t.b; }); d.decidedAt = Date.now(); d.date = date;

    render: function () {
      var cur = PrepFlow.current();
      if (cur.mode !== 'missed') return PrepFlow.redirect(cur.mode === 'run' ? '#prep' : '#prep-start');

      var names = pick.take.map(function (t) { return App.lowerFirst(Data.shortCut(t.dish, 24)); });
      var qm = quickMenu(date), shown = qm.slice(0, 4);
      var mins = Math.max(15, pick.active);
      return '<main class="screen has-tabs">' +
        '<section class="card tip"><div class="row g12">' + Ui.art('gibby', 64, 60, '') + '<div class="col g2 grow"><div style="font-size:20px;font-weight:800;line-height:1.2">Заготовку не успели?</div><div class="small" style="font-size:13px;line-height:18px">Бывает. Неделя не сломалась — вот два пути.</div></div></div></section>' +
        '<section class="card hero g8"><div class="row g8">' + Ui.icon('bolt', 18) + '<span style="font-size:16px;font-weight:800">Короткая заготовка · ' + mins + ' мин</span></div>' +
        '<div class="small" style="font-size:13px;line-height:18px">Только самое нужное до среды: ' + esc(names.join(', ') || 'самое срочное') + '.' + (pick.deferred.length ? ' Остальное — в среду.' : '') + '</div>' +
        Ui.btn('Начать короткую', { primary: true, icon: 'fire', iconCls: 'keep', act: 'noprep-short', attrs: 'data-date="' + date + '"' }) + '</section>' +
        '<section class="card g8"><div class="row g8">' + Ui.art('alarmM', 18, 13.5, '') + '<span style="font-size:16px;font-weight:800">Неделя без заготовок</span></div>' +
        '<div class="small" style="font-size:13px;line-height:18px">Меню на пн–вт меняется на блюда, которые готовятся за ' + QUICK_MIN + ' минут или быстрее, без заготовок.</div>' +
        Ui.btn('Перестроить меню', { act: 'noprep-rebuild', attrs: 'data-date="' + date + '"' }) + '</section>' +
        '<section class="card g4">' + Ui.art('potSleepy', 81, 65.81, '') + '<div class="label l13">Что будет на пн–вт</div>' +
        (shown.length ? shown.map(function (x) {
          return '<div class="row g8" style="padding:4px 0"><svg class="ic" width="16" height="12" viewBox="0 0 16 12" aria-hidden="true" style="color:var(--text-2)"><path d="M1 4h14v5a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2zM3 2h10" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><span class="grow" style="font-size:13px;font-weight:700">' + esc(D.wdShort(x.date) + ', ' + x.m.labelLc + ' · ' + App.lowerFirst(x.c.title) + ' · ' + x.c.minutes + ' мин') + '</span></div>';

(function () {

    '.r-top{border:1.5px solid var(--yellow);box-shadow:0 4px 0 rgba(0,0,0,.35)}.r-top .nm{font-size:17px;font-weight:800;line-height:22px}' +
    '.r-row{display:flex;align-items:center;gap:10px;padding:7px 0;min-height:48px;width:100%;text-align:left}.r-row .tx{flex:1;min-width:0}.r-row .dn{font-size:14px;font-weight:700;display:block}.r-row .ms{font-size:12px;font-weight:600;color:var(--text-2);display:block}' +

  function missText(d, who) {

    var keys = Object.keys(m).filter(function (k) { return k !== 'great'; }).sort(function (a, b) { return m[b] - m[a] || (a < b ? -1 : 1); });

    return t;
  }
  function times(n) { return n + ' ' + L.plural(n, ['раз', 'раза', 'раз']); }

  function changes(A) {

    if (worst && worst.avg < 7) {
      var role = (Data.dishes[worst.id] || {}).role, alt = A.rated.filter(function (d) { return d.id !== worst.id && d.avg >= 8 && (Data.dishes[d.id] || {}).role === role; })[0];
      if (alt) { out.push(Data.short(worst.id) + ' → ' + App.lowerFirst(Data.short(alt.id)) + ', он понравился больше'); used[worst.id] = 1; used[alt.id] = 1; }
    }
    A.rated.slice().sort(function (a, b) { return a.avg - b.avg; }).forEach(function (d) {
      if (out.length >= 3 || used[d.id] || d.avg >= 8.5) return;

      if (ks.length) { out.push(Data.short(d.id) + ': ' + ks.slice(0, 2).map(function (k) { return FIX[k]; }).join(' и ')); used[d.id] = 1; }

  L.ratingsText = function () {

  function filt() { var v = L.ls.get('ratings.filter'); return FILTERS.some(function (f) { return f[0] === v; }) ? v : 'all'; }

      }).join('') + '</div>';
      if (!A.dishes.length) {
        return '<main class="screen">' + Ui.backRow('Ещё', '#more') + head + Ui.empty('star', 'Оценок за этот месяц пока нет. Они появятся, когда отметишь приём на экране «Готово» и поставишь оценку.') +

      var who = f === 'him' ? 'him' : null;

        '<section class="card tip g6">' + Ui.label('Что поменяю в следующем месяце') + (ch.length ? '<div class="m-bul">' + ch.map(function (c) { return '<span>· ' + esc(c) + '</span>'; }).join('') + '</div>' : '<div class="m-body">Пока мало оценок — подсказки появятся, когда накопится неделя-две.</div>') + '</section>' +

      var rew;
      if (rw.text) {
        var goal = rw.goalWeeks || L.CFG.REWARD_DEFAULT_WEEKS, prog = Math.min(goal, L.weeksOnPlan(rw.since || t));
        rew = '<section class="card tip g6 w-rew">' + Ui.label('Своя награда') + '<div style="font-size:13px;font-weight:700">' + esc(goal + ' ' + L.plural(goal, ['неделя', 'недели', 'недель']) + ' по плану → ' + rw.text) + '</div>' +
          '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="' + goal + '" aria-valuenow="' + prog + '"><i style="width:' + (prog / goal * 100).toFixed(1) + '%"></i></div>' +
          '<div class="cap">' + (prog >= goal ? 'Заработано! Можно идти за наградой.' : prog + ' из ' + goal + ' ' + L.plural(goal, ['недели', 'недель', 'недель'])) + '</div>' +
          '<button type="button" class="textbtn" data-act="rw-edit" style="justify-content:flex-start;min-height:36px">Изменить награду</button></section>';
      } else {
        rew = '<section class="card tip g6">' + Ui.label('Своя награда') + '<div class="m-body">Придумай награду за недели по плану — например, поход в любимое место. Я буду считать недели.</div><button type="button" class="btn" data-act="rw-edit" style="min-height:48px">Придумать награду</button></section>';
      }
      return '<main class="screen">' + Ui.backRow('Ещё', '#more') + sk + lvl + badges + '<div class="label l13">Достижения</div>' + grid + rew + '</main>';
    }
  });

  App.on('rw-ach', function (el) {
    var id = el.getAttribute('data-id'), a = unlocked().list.filter(function (x) { return x.id === id; })[0]; if (!a) return;
    App.sheet({ render: function () {
      return '<div class="row g12"><span class="ico" style="height:32px;display:flex;align-items:center">' + (a.ok ? a.icon : LOCK) + '</span><span class="m-sheet-h">' + esc(a.title) + '</span></div>' +
        '<div class="m-body tx">' + esc(a.how) + '</div><div class="cap">' + (a.ok ? 'Получено' + (a.date ? ' · ' + esc(D.dm(a.date)) : '') + '. Достижения не отзываются.' : (a.prog ? 'Сейчас: ' + esc(a.prog) : 'Пока не получено')) + '</div>' +
        '<button type="button" class="btn" data-act="sheet-close"><span>Закрыть</span></button>';
    } });
  });
  function editRender() {
    var rw = Store.get('misc', 'reward');
    return '<div class="m-sheet-h">Своя награда</div><label class="col g4"><span class="cap bold">Что хочу получить</span><input id="rw-text" class="m-input" type="text" maxlength="80" placeholder="например, ужин в суши-баре" value="' + esc(sheetEdit.text) + '"></label>' +
      '<div class="col g4"><span class="cap bold">За сколько недель по плану</span><div class="w-goals">' + [1, 2, 3, 4, 6, 8].map(function (n) { return '<button type="button" class="chip' + (sheetEdit.goal === n ? ' on' : '') + '" data-act="rw-goal" data-v="' + n + '" aria-pressed="' + (sheetEdit.goal === n) + '">' + n + '</button>'; }).join('') + '</div></div>' +
      '<div class="cap">Неделя по плану — когда отмечены приёмы не меньше чем в ' + L.CFG.WEEK_DAYS_OK + ' днях из 7.</div>' +
      '<button type="button" class="btn primary" data-act="rw-save"><span>Сохранить</span></button>' + (rw.text ? '<button type="button" class="textbtn" data-act="rw-clear">Убрать награду</button>' : '');
  }
  function editSheet() { App.sheet({ onClose: function () { sheetEdit = null; }, render: editRender }); }
  App.on('rw-edit', function () {
    var rw = Store.get('misc', 'reward');
    sheetEdit = { goal: rw.goalWeeks || L.CFG.REWARD_DEFAULT_WEEKS, text: rw.text || '' };
    editSheet();
  });
  App.on('rw-goal', function (el) { var i = document.getElementById('rw-text'); if (i) sheetEdit.text = i.value; sheetEdit.goal = +el.getAttribute('data-v'); editSheet(); });

  App.on('rw-save', function () {
    var i = document.getElementById('rw-text'), text = ((i && i.value) || '').trim();
    if (!text) { App.toast('Напиши, какая награда'); return; }
    var old = Store.get('misc', 'reward'), keepSince = old.text && old.since;
    Store.set('misc', 'reward', { text: text, goalWeeks: sheetEdit.goal, since: keepSince || L.today() });
    App.closeSheet(); App.toast('Награда сохранена', { icon: 'star' });
  });
  App.on('rw-clear', function () { Store.del('misc', 'reward'); App.closeSheet(); App.toast('Убрала награду'); });
})();

;
</script></body></html>
