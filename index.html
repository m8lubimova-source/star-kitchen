<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body><link rel="preconnect" href="https://fonts.googleapis.com">

<style>/* Звёздная кухня — единая таблица стилей.
   Один ночной вид (dark-first): приложение намеренно держит «ночное небо».
   Каталог классов — в README_DEV.md. */
:root{
  color-scheme:dark;
  --bg:#1e1a33; --bg-dim:#120f22; --card:#2b2547; --card-hi:#3a2f66; --card-tip:#2a2450; --chip:#3d3566;
  --text:#f1eeff; --text-2:#a9a2cc; --yellow:#ffb84d; --on-accent:#2b1d00;
  --purple:#9b8cff; --pink:#ff9bc1; --mint:#7ee0c3; --star-hi:#ffe08a; --art-outline:#7a68c9;
  --fire:#ff8a3d; --danger:#ff8f8f;
  --night:linear-gradient(#3b2f7a,#241d47); --sunrise:linear-gradient(#5a3f8f,#c9806a);
  --shadow-btn:0 4px 0 rgba(0,0,0,.35);
  --gutter-l:max(16px,env(safe-area-inset-left)); --gutter-r:max(16px,env(safe-area-inset-right));
  --tabbar-h:81px;
}
*{box-sizing:border-box}
html{background:#1e1a33;color-scheme:dark;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;font-weight:600;line-height:1.3}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;-webkit-tap-highlight-color:transparent;text-align:inherit}
a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
img{display:block;max-width:none}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--yellow);outline-offset:2px;border-radius:8px}
.pix{image-rendering:pixelated;image-rendering:crisp-edges;flex:none}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#app{max-width:430px;margin:0 auto;min-height:100vh;position:relative}
.screen{display:flex;flex-direction:column;gap:12px;padding:8px var(--gutter-r) 24px var(--gutter-l);min-height:100vh}
.screen.has-tabs{padding-bottom:calc(var(--tabbar-h) + 16px + env(safe-area-inset-bottom))}
.screen.gap14{gap:14px}.screen.gap18{gap:18px}
.screen.center{align-items:stretch}
.loading{padding:80px 16px;text-align:center;color:var(--text-2);font-weight:700}
.loading img{margin:0 auto 12px}
.errbanner{position:fixed;top:0;left:0;right:0;z-index:99;background:#7a1f2b;color:#fff;font-size:12px;padding:6px 10px;white-space:pre-wrap}

/* ---- typography ---- */
.h1{font-size:24px;line-height:30px;font-weight:800}
.h1.s22{font-size:22px;line-height:28px}
.h-greet{font-size:26px;font-weight:800;line-height:1.15}
.h-greet.s24{font-size:24px}
.label{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.96px;color:var(--yellow)}
.label.l13{font-size:13px;letter-spacing:1.04px}
.label.l11{font-size:12px;letter-spacing:.88px}
.t2{color:var(--text-2)}.tyellow{color:var(--yellow)}.tmint{color:var(--mint)}.tpink{color:var(--pink)}.tpurple{color:var(--purple)}
.cap{font-size:12px;font-weight:600;color:var(--text-2)}
.small{font-size:12px;line-height:17px;font-weight:600;color:var(--text-2)}
.bold{font-weight:800}
.num{font-variant-numeric:tabular-nums}

/* ---- cards ---- */
.card{background:var(--card);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px}
.card.tip{background:var(--card-tip)}
.card.hi{background:var(--card-hi)}
.card.dim{background:var(--bg)}
.card.g2{gap:2px}.card.g4{gap:4px}.card.g6{gap:6px}.card.g10{gap:10px}.card.g12{gap:12px}
.card.hero{background:var(--card-hi);border:1.5px solid var(--yellow);gap:10px;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.card.sel{background:var(--card-hi);border:1.5px solid var(--yellow);box-shadow:none}
.card.pick{text-align:left;width:100%;cursor:pointer;color:var(--text)}
.card.pick.on-bg{background:var(--bg)}
.card.shadow{box-shadow:0 4px 0 rgba(0,0,0,.35)}
.card.link{cursor:pointer}
.row{display:flex;align-items:center;gap:10px}
.row.top{align-items:flex-start}
.row.g6{gap:6px}.row.g8{gap:8px}.row.g12{gap:12px}
.spacer{flex:1}
.col{display:flex;flex-direction:column}
.col.g2{gap:2px}.col.g4{gap:4px}.col.g5{gap:5px}.col.g8{gap:8px}
.grow{flex:1;min-width:0}

/* ---- sky hero ---- */
.sky{position:relative;border-radius:22px;overflow:hidden;height:150px;background:var(--night);flex:none}
.sky.sunrise{background:var(--sunrise)}
.sky.h170{height:170px}.sky.h190{height:190px}
.sky .speck{position:absolute;width:2px;height:2px;background:#fff;pointer-events:none}
.sky .speck.s3{width:3px;height:3px}
.sky .speck.y{background:#ffb84d}
.sky .abs{position:absolute}
.sky .txt{position:absolute;left:18px;top:20px;display:flex;flex-direction:column;gap:2px;max-width:62%;z-index:1}
.sky.h170 .txt{top:24px}
.sky .date{font-size:13px;font-weight:600;color:var(--text-2)}
.sky.sunrise .date{color:#f1e4ff}
.sky .accent{font-size:13px;font-weight:700;color:var(--yellow)}
.sky .twinkle{animation:twinkle 2.4s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.35}50%{opacity:1}}

/* ---- chips / segmented / buttons ---- */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--chip);color:var(--text);font-size:12px;font-weight:700;line-height:1.2;white-space:nowrap;min-height:28px}
button.chip,a.chip{cursor:pointer}
.chips.quick{gap:5px}.chips.quick .chip{padding:5px 9px;gap:5px;flex:none}.chips.quick .seg{flex:none}.chips.quick .seg button{padding:4px 8px;gap:3px}
.chip.on{background:var(--yellow);color:var(--on-accent);font-weight:800}
.chip.mint.on{background:var(--mint);color:var(--on-accent)}
.chip.pink.on{background:var(--pink);color:var(--on-accent)}
.chip.purple.on{background:var(--purple);color:var(--on-accent)}
.chip.hi{background:var(--card-hi);color:var(--yellow)}
.chip.tiny{font-size:12px;padding:3px 9px;min-height:24px}
.chip.meta{font-size:12px;padding:4px 9px}
.chip.bg{background:var(--bg)}
.chip.cardbg{background:var(--card)}
.chip.wrap{white-space:normal}
.chip.ell{max-width:48%;overflow:hidden;text-overflow:ellipsis;display:block;line-height:1.7}
.chip .pix{flex:none}
.seg{display:inline-flex;background:var(--chip);border-radius:999px;padding:3px;gap:2px}
.seg button{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;color:var(--text-2);min-height:28px;white-space:nowrap}
.seg button.on{background:var(--yellow);color:var(--on-accent);font-weight:800}
.seg.pink button.on{background:var(--pink)}.seg.purple button.on{background:var(--purple)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 18px;border-radius:16px;font-size:16px;font-weight:800;box-shadow:var(--shadow-btn);background:var(--chip);color:var(--text);text-align:center;min-height:52px;transition:transform .06s}
.btn.primary{background:var(--yellow);color:var(--on-accent)}
.btn:active{transform:translateY(4px);box-shadow:none}
.btn[disabled]{opacity:.5}
.btn.small-btn{padding:10px 14px;font-size:14px;min-height:44px;border-radius:14px}
.btn.primary svg:not(.keep),.btn.primary .ic:not(.keep){color:var(--on-accent)}
.btn.pair{padding:14px 16px}
.btns{display:flex;gap:10px}.btns .btn{flex:1}
.textbtn{display:flex;align-items:center;justify-content:center;min-height:44px;font-size:14px;font-weight:700;color:var(--text-2);width:100%}
.backrow{display:inline-flex;align-items:center;gap:6px;min-height:44px;font-size:14px;font-weight:700;color:var(--text-2);align-self:flex-start;padding-right:12px}
.topbar{display:flex;align-items:center;gap:8px;min-height:44px}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px}
.sticky-actions{position:sticky;bottom:0;z-index:5;margin:0 calc(var(--gutter-l) * -1) 0 calc(var(--gutter-r) * -1);padding:16px var(--gutter-r) calc(14px + env(safe-area-inset-bottom)) var(--gutter-l);background:linear-gradient(rgba(30,26,51,0),var(--bg) 28%)}
.ic{display:inline-block;flex:none;vertical-align:middle}
.ic.fire{color:var(--fire)}.ic.star{color:var(--yellow)}.ic.heart{color:var(--pink)}.ic.moon{color:var(--star-hi)}.ic.check{color:var(--mint)}.ic.bolt{color:var(--yellow)}.ic.candy{color:var(--pink)}.ic.box{color:var(--mint)}

/* ---- checkbox / progress ---- */
.cb{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:7px;border:1.5px solid var(--text-2);background:transparent;flex:none;color:var(--on-accent)}
.cb.sm{width:22px;height:22px;border-radius:6px}
.cb.on{background:var(--mint);border-color:var(--mint)}
.cb svg{opacity:0}.cb.on svg{opacity:1}
.cbrow{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;padding:3px 0;text-align:left}
.cbrow.top{align-items:flex-start}
.cbrow .nm{flex:1;font-size:14px;font-weight:700;min-width:0}
.cbrow .g{font-size:13px;font-weight:800;text-align:right;min-width:52px;white-space:nowrap}
.cbrow.done .nm{color:var(--text-2);text-decoration:line-through}
.cbrow.done .g{color:var(--text-2)!important}
.prog{display:flex;gap:4px}
.prog i{flex:1;height:6px;border-radius:9px;background:var(--chip)}
.prog i.on{background:var(--mint)}
.prog.step{gap:3px}.prog.step i{height:8px}.prog.step i.on{background:var(--yellow)}
.bar{height:10px;border-radius:999px;background:var(--chip);overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--yellow);border-radius:999px}
.levelrow{display:flex;align-items:center;gap:8px}
.gram-h{display:flex;gap:8px;align-items:center;font-size:12px;font-weight:800}
.gcol{display:inline-block;text-align:right;min-width:54px;font-weight:800;font-size:15px}
.gcol.s13{font-size:13px}
.gcol.her{color:var(--pink)}.gcol.him{color:var(--purple)}.gcol.dim{color:var(--text-2)}
.compr{display:flex;align-items:center;gap:8px;padding:6px 0}
.compr .nm{flex:1;font-size:14px;font-weight:700;min-width:0}
.compr .src{display:block;font-size:12px;font-weight:600;color:var(--text-2)}

/* ---- gram tiles ---- */
.tiles{display:flex;gap:10px}
.tile{flex:1;background:var(--bg);border-radius:14px;padding:8px 12px;display:flex;flex-direction:column;min-width:0}
.tile .who{font-size:12px;font-weight:700}
.tile .gr{font-size:22px;font-weight:800;color:var(--text)}
.tile.her .who{color:var(--pink)}.tile.him .who{color:var(--purple)}
.tile.off{opacity:.55}

/* ---- meal list ---- */
.meallist{padding:14px;gap:2px}
.mrow{display:flex;align-items:center;gap:10px;padding:8px 0;min-height:44px;width:100%;text-align:left}
.mrow .tm{font-size:13px;font-weight:800;width:42px;flex:none}
.mrow .tx{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.mrow .tt{font-size:14px;font-weight:700;color:var(--text)}
.mrow .cp{font-size:12px;font-weight:600;color:var(--text-2)}
.mrow.done{opacity:.5}.mrow.done .tm{color:var(--text-2)}
.mrow.plain{padding:5px 0}
.mrow.sum{padding:6px 0;opacity:.65}

/* ---- steps ---- */
.steprow{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:2px 0}
.steprow .tx{font-size:14px;line-height:19px;font-weight:700;display:block}
.steprow.done .tx{color:var(--text-2);text-decoration:line-through}
.steprow .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.hint{font-size:12px;font-weight:600;color:var(--yellow);margin-top:5px;display:block}
.dishhead{font-size:12px;font-weight:800;color:var(--text-2);margin:6px 0 2px}
.numsteps{display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:20px;font-weight:600;margin:0;padding:0;list-style:none}
.stepbig{font-size:28px;line-height:36px;font-weight:800}
.stepbig.sm{font-size:22px;line-height:29px}.stepbig.xs{font-size:18px;line-height:25px}
.bigtime{font-size:44px;line-height:1;font-weight:800}
.badge{background:var(--yellow);color:var(--on-accent);border-radius:14px;padding:10px 16px;font-size:15px;font-weight:800}

/* ---- rating ---- */
.rate{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rate button{padding:9px 0;border-radius:12px;background:var(--chip);font-size:15px;font-weight:800;text-align:center;min-height:44px}
.rate button.on{background:var(--yellow);color:var(--on-accent)}

/* ---- tab bar ---- */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:430px;z-index:20;background:var(--card);display:flex;justify-content:space-between;padding:10px var(--gutter-r) max(26px,env(safe-area-inset-bottom)) var(--gutter-l);border-radius:0}
.tab{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:56px;min-height:44px;opacity:.85;font-size:12px;font-weight:700;color:var(--text-2);justify-content:flex-end}
.tab.on{opacity:1;font-weight:800;color:var(--yellow)}
.tab .ti{height:26px;display:flex;align-items:flex-end}

/* ---- bottom sheet / scrim / toast ---- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(18,15,34,.78)}
.sheetwrap{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:430px;z-index:41;max-height:92vh;overflow:auto}
.sheet{background:var(--card);border-radius:28px 28px 0 0;padding:10px var(--gutter-r) calc(30px + env(safe-area-inset-bottom)) var(--gutter-l);display:flex;flex-direction:column;gap:12px;animation:slideup .22s ease-out}
.grabber{width:40px;height:5px;border-radius:9px;background:rgba(169,162,204,.5);align-self:center;margin:2px 0}
@keyframes slideup{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.under{opacity:.3;pointer-events:none}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:100%;max-width:430px;padding:0 16px}
.toast{background:var(--card-hi);border:1.5px solid var(--yellow);color:var(--text);border-radius:14px;padding:10px 14px;font-weight:800;font-size:14px;display:flex;gap:8px;align-items:center;animation:pop .2s ease-out;box-shadow:0 4px 0 rgba(0,0,0,.35)}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.empty{text-align:center;padding:28px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--text-2);font-weight:700}
.empty .pix{margin:0 auto}
.tipcard .who{display:flex;gap:10px;align-items:flex-start}
.tipcard .tx{font-size:14px;line-height:19px;font-weight:600}
textarea.inp,input.inp{width:100%;background:var(--bg);border:1.5px solid var(--chip);border-radius:14px;padding:12px;font-size:16px;color:var(--text)}
.divider{height:1px;background:var(--chip);border:0;margin:4px 0}
.clock{font-variant-numeric:tabular-nums}
.pill-ok{color:var(--mint)}
.rowlink{display:flex;align-items:center;gap:10px;min-height:44px;width:100%}

  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}

щает запах чеснока на работе, положите его вдвое меньше. Подаётся к гуляшу с гречкой (1-я неделя), к бефстроганову с рисом (2-я неделя) и к курице с грибами и брокколи с пастой (3-я неделя). В 3-й неделе (готовка в Ср, обеды Чт–Пт) возьмите свежую маленькую пачку, купленную в Пн–Ср: пачка, вскрытая в Вс для салата «Щётка», к Пт пойдёт уже на 5-й день после вскрытия. Майонез не добавлять. Уксус — та же бутылка 9 %, что для салатов и маринадов (хранится полгода).","portion":{},"reheat":"Не разогревать — едят холодной; на работе держать контейнер в холодильнике или поставить салат в отдельный отсек от горячего.","role":"salad","steps":[{"active":false,"eq":[],"est":false,"info":true,"min":0,"min_text":null,"t":"Готовится одной партией на 2–3 обеда на двоих — вечером в день готовки основного блюда (Вс или Ср), занимает 3–5 мин, варить ничего не нужно.","when":"day_of"},{"active":true,"eq":["board","grater","container"],"est":true,"info":false,"min":0,"min_text":null,"t":"Наденьте перчатки или пакет на руку — свёкла красит. Вскройте вакуумную упаковку, слейте сок, обсушите свёклу бумажным полотенцем. Натрите на крупной тёрке или нарежьте кубиком 1 см (кубик меньше пускает сок в контейнере).","when":"day_of"},{"active":true,"eq":["grater"],"est":true,"info":false,"min":5,"min_text":180,"t":"Очистите чеснок и натрите на мелкой тёрке или пропустите через пресс. Перемешайте со свёклой, солью и уксусом 9 % (на партию из 6 порций ≈1 ч. л., на 4 порции ≈2/3 ч. л.): капля кислоты подчёркивает сладость свёклы и остроту чеснока, поэтому масла нужно совсем немного.","when":"day_of"},{"active":true,"eq":["fridge","container"],"est":true,"info":false,"min":0,"min_text":null,"t":"Разложите по контейнерам на нужные дни (ему порция больше, ей меньше), закройте и уберите в холодильник.","when":"day_of"},{"active":true,"eq":["container"],"est":true,"info":false,"min":0,"min_text":null,"t":"В день еды, утром при сборе обеда, полейте порцию маслом (½ ч. л.) и перемешайте. Можно заправить и всю партию сразу — растительное масло за 3 дня не испортит свёклу, но с заправкой утром вкус свежее и меньше сока в контейнере.","when":"day_of"}],"storage":"Партия на 2–3 дня: в закрытых контейнерах в холодильнике до 3 дней. Считайте срок от вскрытия вакуумной пачки: салат должен быть съеден не позже чем через 3 дня после вскрытия, поэтому делайте его из только что вскрытой пачки.","tags":["work_ok"],"total_min":5},"blini":{"active_min":25,"base":{"c":42.3,"f":7.6,"g":150,"kcal":282,"p":10.9},"batch":{"cook":"same_day","freeze_d":30,"keeps_d":1,"mode":"cook","no_thaw":true},"eq":["bowl","freezer","micro","pan","stove"],"eq_text":["плита","сковорода с ровным дном 22–24 см","миска","венчик или миксер","сито","половник ~50 мл","кисточка","тонкая лопатка","тарелка с крышкой"],"in_menu":true,"ing":[{"g":45,"id":"wheat_flour","note":"лучше взвесить"},{"g":110,"id":"milk_25","note":"комнатной температуры"},{"id":"egg","note":"","pcs":0.5},{"g":5,"id":"sugar","note":"обычный сахар"},{"g":0.4,"id":"salt","note":"щепотка"},{"g":2,"id":"sunflower_oil","note":"1/2 ч. л. на двоих в тесто + остальное каплей кисточкой на сковороду перед первым блином и каждые 2–3 блина; всего на двоих 1 ч. л. (5 г)"}],"keeps_d":1,"light":"Молоко 2,5 % вместо жирного; всего 1 ч. л. (5 г) масла на двоих: 1/2 ч. л. в тесте вместо смазывания каждой лепёшки, остальное — каплей кисточкой; сахар умеренно; сметана 15 %.","mode":"cook","name":"Тонкие блины","notes":"Сладость — обычным сахаром, не сахарозаменителем. Сметана 15 % к блинам — отдельной строкой меню дня (компонент «Сметана 15 % к блюду»), поэтому в ингредиентах её нет. Первый блин часто выходит комом — это норма, сковорода в этот момент ещё набирает ровную температуру.","portion":{"her":{"max_g":190}},"reheat":"Микроволновка 20–30 с под крышкой или на сухой сковороде по 20 с с каждой стороны. Из морозилки: на сухую сковороду по 30 с с каждой стороны или микроволновка 20 с на 2 блина. Сметану и сыр подавай свежие.","role":"breakfast","steps":[{"active":false,"eq":["micro"],"est":false,"info":true,"min":0,"min_text":null,"t":"Завтрак на двоих: блины диаметром 22–24 см, ~40 мин. Вес продуктов на всю партию — в таблице «Вся партия», порции её и его — в таблице порций. Молоко подогрей в микроволновке 20–30 с до комнатной температуры.","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":5,"min_text":null,"t":"Яйцо с сахаром и солью взбей венчиком 30 с. Влей половину молока, всыпь всю муку через сито и вымешай до гладкости: густое тесто легче размешать без комков.","when":"day_of"},{"active":false,"eq":[],"est":true,"info":false,"min":15,"min_text":120,"t":"Влей остальное молоко и 1/2 ч. л. масла, перемешай: тесто жидкое, чуть гуще молока. Оставь на 15 мин — блины меньше рвутся.","when":"day_of"},{"active":true,"eq":["pan"],"est":true,"info":false,"min":4,"min_text":2,"t":"Прогрей сковороду на средне-сильном огне 2 мин и тонко смажь кисточкой. Сковорода должна быть горячей: капля теста схватывается сразу. Масло в тесте не даёт блинам прилипать.","when":"day_of"},{"active":true,"eq":["pan"],"est":true,"info":false,"min":4,"min_text":null,"t":"Влей половник теста в центр и, вращая сковороду, разведи тонким слоем по всему дну.","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":4,"min_text":2,"t":"Жарь 1–1,5 мин, пока края не подсохнут и не начнут отходить, а низ не станет золотистым. Подцепи лопаткой, переверни и держи ещё 30–40 с.","when":"day_of"},{"active":true,"eq":["pan"],"est":true,"info":false,"min":4,"min_text":null,"t":"Складывай блины стопкой на тарелку под крышку. Сковороду смазывай кисточкой каждые 2–3 блина. Если блин рвётся при перевороте — сковорода недогрета, дай ей ещё минуту.","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":4,"min_text":null,"t":"Подавай со сметаной (её вес — отдельной строкой меню дня): раздели по весу из таблицы.","when":"day_of"},{"active":false,"eq":["freezer","container"],"est":false,"freeze_step":true,"info":true,"min":0,"min_text":null,"t":"Заморозка (блины): порции, которые не съедят в ближайшие 1 суток, сразу уйдут в морозилку. Остуди на решётке до комнатной температуры, разложи на доске в один слой и заморозь 1 час, потом пересыпь в пакет по порциям: одна порция = один завтрак одного человека, на пакете подпиши блюдо и дату. Срок в морозилке — до 30 суток. Размораживать не нужно: бери порцию прямо из морозилки.","when":"day_of"}],"storage":"Готовишь большой партией. В холодильнике в закрытом контейнере до 1 суток — столько, сколько съедят в ближайшие приёмы; остальное сразу после остывания в морозилку (до 30 суток). Остуди на решётке до комнатной температуры, разложи на доске в один слой и заморозь 1 час, потом пересыпь в пакет по порциям: одна порция = один завтрак одного человека, на пакете подпиши блюдо и дату. Размораживать не нужно: бери порцию прямо из морозилки.","tags":[],"total_min":40},"boiled_eggs":{"active_min":3,"base":{"c":0.7,"f":9.7,"g":95,"kcal":139,"p":12.3},"batch":{"cook":"assembled","keeps_d":1,"mode":"assemble"},"eq":["bowl","container","fridge","pot","stove"],"eq_text":["плита","небольшая кастрюля","шумовка или ложка","миска с холодной водой"],"in_menu":true,"ing":[{"id":"egg","note":"С1","pcs":2},{"g":0.5,"id":"salt","note":"щепотка при подаче, по желанию"}],"keeps_d":1,"light":"Без масла и майонеза: чистый белок к каше, оладьям или перекусу.","mode":"assemble","name":"Яйца варёные","notes":"Белковая добавка к манной и рисовой каше, оладьям и перекусу «йогурт + фрукт». В один день яйца идут либо к завтраку, либо к перекусу, не дважды. Яйцо, треснувшее при варке, съедают первым.","portion":{"her":{"max_g":100,"min_g":90}},"reheat":"К горячему завтраку яйца варят утром и подают тёплыми, не холодными из холодильника. Сваренные заранее (на перекус) едят холодными или комнатной температуры; целое яйцо в микроволновке греть нельзя — лопнет, но его можно прогреть в скорлупе 3–4 мин в горячей воде.","role":"side","steps":[{"active":true,"eq":[],"est":true,"info":false,"min":0,"min_text":null,"t":"Если яйца идут к горячему завтраку — вари их утром, пока готовится основное блюдо, и подавай тёплыми. К перекусу их можно сварить вечером накануне вместе с гарнирами; в скорлупе они хранятся до 3 суток. Сколько яиц — в таблице «Вся партия».","when":"day_of"},{"active":true,"eq":["pot","fridge"],"est":true,"info":false,"min":0,"min_text":null,"t":"Положите яйца в кастрюлю в один слой и залейте холодной водой так, чтобы она покрывала их на 2 см. Яйца прямо из холодильника не опускайте в кипяток: они треснут.","when":"day_of"},{"active":false,"eq":["pot"],"est":false,"info":false,"min":10,"min_text":10,"t":"Поставьте на сильный огонь. Когда вода закипит, убавьте огонь до среднего, чтобы вода слегка булькала, и варите 9–10 мин. Желток будет полностью твёрдым, такие яйца лучше хранятся.","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":3,"min_text":10,"t":"Слейте горячую воду и залейте яйца холодной водой: к завтраку — на 1–2 мин, чтобы легче чистились и остались тёплыми; на хранение — на 5–10 мин (можно со льдом), так желток не сереет.","when":"day_of"},{"active":true,"eq":["fridge","container"],"est":true,"info":false,"min":0,"min_text":null,"t":"Яйца на перекус или на следующий день обсушите и уберите в холодильник прямо в скорлупе, в контейнер или в лоток для яиц. Удобно подписать карандашом на скорлупе день варки.","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":0,"min_text":null,"t":"Чистите прямо перед едой: постучите яйцом о стол, прокатайте ладонью и снимите скорлупу под струйкой воды. Посолите по вкусу.","when":"day_of"},{"active":true,"eq":["container"],"est":true,"info":false,"min":0,"min_text":null,"t":"На перекус на работу берите яйца в скорлупе в контейнере и чистите на месте.","when":"day_of"}],"storage":"К завтраку — есть сразу, тёплыми. Сваренные заранее — в скорлупе в холодильнике до 3 суток. Очищенные яйца едят в тот же день.","tags":["work_ok","assembled"],"total_min":20},"buckwheat_plain":{"active_min":7,"base":{"c":40.8,"f":5.6,"g":185,"kcal":248,"p":7.8},"batch":{"cook":"evening_before","keeps_d":3,"mode":"cook"},"eq":["container","fridge","pan","pot","stove"],"eq_text":["плита","кастрюля 2–3 л с толстым дном и плотной крышкой","сито","сковорода (по желанию)","мерный стакан","вилка","контейнеры с крышками"],"in_menu":true,"ing":[{"g":60,"id":"buckwheat","note":"ядрица, сухая; лучше взвесить"},{"g":5,"id":"butter","note":"сливочное, в готовую горячую гречку"},{"g":1,"id":"salt","note":"в воду"}],"keeps_d":3,"light":"Масла немного (~5 г на базовую порцию, в готовую гречку); аромат даёт короткое прогревание крупы на сухой сковороде, а сочность — соус основного блюда; гарнир отдельно, поэтому порции ей и ему легко подогнать.","mode":"cook","name":"Гречка отварная (заготовка)","notes":"Гречка хорошо дружит и с томатными соусами (в отличие от риса), и с грибами, и с тушёным мясом. Пачка 900 г закрывается зажимом и хранится месяцами.","portion":{"her":{"max_g":220}},"reheat":"Микроволновка: сбрызнуть 1 ст. л. воды, накрыть, 1,5–2 мин на полной мощности, перемешать. В контейнере вместе с основным блюдом — 2,5–3 мин.","role":"side","steps":[{"active":false,"eq":[],"est":false,"info":true,"min":0,"min_text":null,"t":"Варится вечером накануне или в день первого приёма партией на несколько приёмов; хранится до 3 суток. Вес крупы на всю партию — в таблице «Вся партия» (лучше взвесить).","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":0,"min_text":null,"t":"Перебери крупу на тарелке от тёмных зёрен и камешков, промой в сите холодной водой и дай стечь.","when":"day_of"},{"active":true,"eq":["pan","stove"],"est":true,"info":false,"min":1,"min_text":4,"t":"По желанию для аромата: прогрей мокрую гречку на сухой сковороде на среднем огне 3–4 мин, помешивая, пока зёрна не станут сухими и не запахнут орехом.","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":0,"min_text":null,"t":"Отмерь воду: 2 объёма на 1 объём крупы (на 360 г ≈1¾ стакана — 3,5 стакана воды, ~870 мл). Доведи до кипения, посоли, всыпь гречку и дождись кипения.","when":"day_of"},{"active":true,"eq":["pot"],"est":true,"info":false,"min":6,"min_text":17,"t":"Убавь огонь до минимального, плотно накрой и вари 15–17 мин без помешивания, пока вода полностью не впитается (наклони кастрюлю — на дне не должно быть жидкости).","when":"day_of"},{"active":false,"eq":["fridge","container"],"est":true,"info":false,"min":28,"min_text":30,"t":"Выключи огонь, оставь под крышкой ещё 10 мин, разрыхли вилкой. Положи сливочное масло (вес — в таблице) и перемешай. Остуди без крышки 20–30 мин, разложи по контейнерам и убери в холодильник.","when":"day_of"}],"storage":"В закрытых контейнерах в холодильнике до 3 суток.","tags":["work_ok"],"total_min":35},"butter_pat":{"active_min":0,"base":{"c":0,"f":4.1,"g":5,"kcal":38,"p":0},"batch":{"cook":"evening_before","keeps_d":3,"mode":"ready"},"eq":["board","fridge"],"eq_text":["нож"],"in_menu":true,"ing":[{"g":5,"id":"butter","note":"тонкий слой на хлеб или кусочек в кашу/гречку, 1 ч. л. без горки ≈ 5 г"}],"keeps_d":3,"light":"Не больше ~8 г ей и ~10 г ему за завтрак. Масло добавлено программой только в те дни, где меню недобирает жиры до нормы, и только в количестве, нужном для этого.","mode":"ready","name":"Сливочное масло к завтраку","notes":"Добавка «по расчёту»: появляется в меню только там, где нужна для попадания в норму КБЖУ дня.","portion":{"addon_min_g":3,"her":{"max_g":3}},"reheat":"Не нужно.","role":"butter","steps":[{"active":true,"eq":[],"est":true,"info":false,"min":0,"min_text":60,"t":"Отрежьте масло по весу из меню дня (1 ч. л. без горки ≈ 5 г) и намажьте тонким слоем на хлеб или тост (к яйцам пашот — на горячий тост первым слоем; к ленивым хачапури — растопите на горячей лепёшке, как в аджарском хачапури), положите в горячую кашу или дайте растаять на горячем омлете или яичнице; к сырникам, драникам, блинам и оладьям масло не кладётся — там уже есть сметана.","when":"day_of"},{"active":true,"eq":["fridge"],"est":true,"info":false,"min":0,"min_text":null,"t":"Остаток масла держите в маслёнке или фольге в холодильнике.","when":"day_of"}],"storage":"Сливочное масло в маслёнке или фольге в холодильнике до 30 дней.","tags":["work_ok","ready"],"total_min":1},"cheese_slice":{"active_min":0,"base":{"c":0,"f":2,"g":20,"kcal":36,"p":4.4},"batch":{"cook":"evening_before","keeps_d":3,"mode":"ready"},"eq":["board","fridge","micro","oven"],"eq_text":["нож"],"in_menu":true,"ing":[{"g":20,"id":"cheese_100t_light","note":"сыр «100 тонн» с рынка: нарезан тонкими пластинками дома (или натёрт и заморожен порциями)"}],"keeps_d":3,"light":"Лёгкий сыр «100 тонн»: белка много, жира мало.","mode":"ready","name":"Ломтик сыра к завтраку","notes":"Белковая добавка к «тестяным» и картофельным завтракам (драники, оладьи), где иначе почти одни углеводы. Сыр режешь сама из куска с рынка или достаёшь из морозилки пластинку.","portion":{"addon_min_g":10,"her":{"max_g":20,"min_g":15}},"reheat":"Не нужно.","role":"addon","steps":[{"active":true,"eq":["board"],"est":true,"info":false,"min":0,"min_text":null,"t":"Нарежьте сыр тонкими ломтиками: вес её и его порции — в меню дня (1 тонкий ломтик ≈ 20 г).","when":"day_of"},{"active":true,"eq":["oven","micro"],"est":true,"info":false,"min":0,"min_text":null,"t":"Подавайте к завтраку. К блинам — положите ломтик на горячий блин и сверните, сыр подтает. К драникам — положите ломтик на горячие драники сразу из духовки (или на 15 с в микроволновку). Так завтрак получает белок, а не только тесто или картофель.","when":"day_of"},{"active":true,"eq":["fridge"],"est":true,"info":false,"min":0,"min_text":null,"t":"Остаток сыра заверните в пергамент или плёнку и уберите в холодильник.","when":"day_of"}],"storage":"Вскрытый сыр в пергаменте или контейнере в холодильнике до 10 дней.","tags":["work_ok","ready","oven"],"total_min":1},"chicken_paprika_baked":{"active_min":10,"base":{"c":3.4,"f":5.9,"g":112,"kcal":205,"p":35.3},"batch":{"cook":"evening_before","freeze_d":21,"keeps_d":3,"mode":"cook"},"eq":["board","bowl","container","freezer","fridge","grater","oven"],"eq_text":["духовка","противень","пергамент","миска или пакет для маринада","нож и доска","мелкая тёрка","контейнеры с крышками"],"in_menu":true,"ing":[{"g":150,"id":"chicken_fillet","note":"филе грудки без кожи целиком, толстую часть надрезать «книжкой», чтобы толщина была ровной ~2 см; на партию ~1 кг (4–5 филе)"},{"g":15,"id":"yogurt","note":"питьевой натуральный, основа маринада: курица не сохнет; на партию ~100 г (чуть меньше половины бутылки 260 г)"},{"g":1.5,"id":"paprika_sweet","note":"на партию 1 ст. л. без горки"},{"g":0.5,"id":"smoked_paprika","note":"на партию 1 ч. л. без горки"},{"g":2,"id":"garlic","note":"на мелкой тёрке; на партию 3 зубчика"},{"g":0.8,"id":"sunflower_oil","note":"в маринад; на партию 1 ч. л. (5 г)"},{"g":1.5,"id":"salt","note":"на партию 1,5 ч. л. без горки"},{"g":0.2,"id":"black_pepper","note":"молотый, щепотка на филе"},{"g":0.5,"id":"oregano","note":"в маринад; мягкая специя, не острая"},{"g":0.4,"id":"coriander_ground","note":"в маринад; мягкая специя, не острая"},{"g":1.5,"id":"chicken_seasoning","note":"в маринад вместо части соли; в смеси может быть соль, пробуй до досаливания"}],"keeps_d":3,"light":"Грудка без кожи; масла 1 ч. л. на килограмм мяса, сочность даёт йогуртовый маринад, а не жир. Без панировки, майонеза и сыра. Запекание на пергаменте при высокой температуре: быстро и без пересушивания.","mode":"cook","name":"Курица, запечённая с паприкой","notes":"Серёжа может брать ломтики на работу в отдельном контейнере и собирать бутерброды там (доска, нож, тарелка, микроволновка): хлеб, курица и свежий помидор отдельно, собрать перед едой. Огурец к тёплой курице не класть, только к холодной. Йогурт: остаток бутылки (~160 г) — на йогуртовый соус с укропом к обедам тех же дней (вскрытый живёт 3 дня). Порции подгоняет программа: ему больше, ей меньше.","portion":{},"reheat":"Обед: в контейнере под неплотной крышкой с 1 ст. л. воды, микроволновка 1–1,5 мин на 800 Вт. Для бутерброда не греть, есть холодной. Из морозилки: микроволновка 1,5–2 мин или духовка 180 °C 8 мин под фольгой.","role":"main","steps":[{"active":false,"eq":["oven","container"],"est":false,"info":true,"min":0,"min_text":null,"t":"Заготовка в Вс (или Ср) на 3 дня: для обедов в контейнере и для бутербродов. На партию ~1 кг филе (4–5 штук), 100 г йогурта, 1 ст. л. сладкой и 1 ч. л. копчёной паприки, 3 зубчика чеснока, 1 ч. л. масла, 1,5 ч. л. соли. Удобно ставить в духовку вместе с другим блюдом на 200 °C.","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":5,"min_text":null,"t":"Обсуши филе полотенцем, срежь плёнки. Толстую часть надрежь вдоль и раскрой «книжкой», чтобы филе было ровным ~2 см: тогда оно пропекается одновременно и не пересыхает с краёв.","when":"day_of"},{"active":false,"eq":["bowl","fridge"],"est":true,"info":false,"min":45,"min_text":720,"t":"В миске смешай йогурт, обе паприки, чеснок, масло, соль и перец. Обваляй филе в маринаде и оставь минимум на 20 мин при комнатной температуре или до 12 ч в холодильнике.","when":"day_of"},{"active":true,"eq":["oven"],"est":true,"info":false,"min":5,"min_text":null,"t":"Разогрей духовку до 210 °C (верх-низ). Выложи филе на противень с пергаментом в один слой, с промежутками 2 см, остатки маринада сверху.","when":"day_of"},{"active":false,"eq":["oven"],"est":false,"info":false,"min":22,"min_text":22,"t":"Запекай на среднем уровне 20–22 мин. Готовность: в самом толстом месте сок прозрачный, мясо белое без розового; по термометру 72 °C. Дольше не держи: грудка пересохнет.","when":"day_of"},{"active":false,"eq":["bowl"],"est":false,"info":false,"min":10,"min_text":10,"t":"Накрой фольгой или миской и дай отдохнуть 10 мин, чтобы сок разошёлся по мясу.","when":"day_of"},{"active":false,"eq":["board","fridge","container"],"est":false,"info":false,"min":40,"min_text":40,"t":"Для обедов оставь филе целым или нарежь толстыми ломтиками 1,5 см; для бутербродов остуди полностью и нарежь тонко, 4–5 мм, поперёк волокон. Сок с противня слей в контейнер к мясу. Убери в холодильник после остывания, через 30–40 мин.","when":"day_of"},{"active":false,"eq":["freezer","container"],"est":false,"freeze_step":true,"info":true,"min":0,"min_text":null,"t":"Заморозка (запечённую курицу): порции, которые не съедят в ближайшие 3 суток, сразу уйдут в морозилку. Остуди (не дольше 2 часов на столе), разложи по порциям в плоские зип-пакеты или контейнеры: одна порция = один приём пищи одного человека, на пакете подпиши блюдо и дату. Пакеты клади в морозилку плоско, после замерзания ставь стопкой или на ребро. Срок в морозилке — до 21 суток. Накануне вечером переложи нужную порцию из морозилки на полку холодильника (на ночь), утром она готова к разогреву. Если забыла — микроволновка в режиме разморозки 5–6 мин.","when":"day_of"}],"storage":"Готовишь большой партией. В холодильнике в закрытом контейнере до 3 суток — столько, сколько съедят в ближайшие приёмы; остальное сразу после остывания в морозилку (до 21 суток). Заморозка: Остуди (не дольше 2 часов на столе), разложи по порциям в плоские зип-пакеты или контейнеры: одна порция = один приём пищи одного человека, на пакете подпиши блюдо и дату. Пакеты клади в морозилку плоско, после замерзания ставь стопкой или на ребро.  Накануне вечером переложи нужную порцию из морозилки на полку холодильника (на ночь), утром она готова к разогреву. Если забыла — микроволновка в режиме разморозки 5–6 мин.","tags":["work_ok","oven"],"total_min":55},"fish_cutlets":{"active_min":30,"base":{"c":13,"f":6.8,"g":160,"kcal":215,"p":25},"batch":{"cook":"evening_before","freeze_d":14,"keeps_d":2,"mode":"cook"},"eq":["blender","board","bowl","container","freezer","fridge","grater","mc","oven"],"eq_text":["духовка","противень","пергамент для выпечки","острый нож и большая доска (или чаша-измельчитель погружного блендера, если есть)","большая миска","кисточка (можно смазать пальцами)","лопатка","бумажные полотенца","контейнеры с крышками","кухонные весы"],"in_menu":true,"ing":[{"g":130,"id":"pollock_fillet","note":"вес замороженного филе; разморозить ночь в холодильнике"},{"g":30,"id":"onion","note":"очень мелким кубиком или на мелкой тёрке"},{"id":"egg","note":"≈1 яйцо на 400 г рыбы","pcs":0.33},{"g":12,"id":"semolina","note":"связка вместо хлеба"},{"g":10,"id":"sour_cream_15","note":"в фарш для сочности (минтай постный и суховат)"},{"g":3,"id":"dill","note":"свежий, мелко порубить (не семена)"},{"g":2,"id":"sunflower_oil","note":"смазать верх котлет кисточкой или пальцами"},{"g":1.5,"id":"salt","note":""},{"g":0.3,"id":"black_pepper","note":""},{"g":0.4,"id":"coriander_ground","note":"в фарш; мягкая специя, не острая"},{"g":0.3,"id":"turmeric","note":"в фарш; мягкая специя, не острая"},{"g":0.8,"id":"paprika_sweet","note":"в фарш; мягкая специя, не острая"},{"g":1.5,"id":"fish_seasoning","note":"в фарш вместо части соли; в смеси может быть соль, пробуй до досаливания"}],"keeps_d":2,"light":"Котлеты запекаются на пергаменте, а не жарятся в масле (масла всего 2 г на порцию — смазать верх); связка — яйцо и манка вместо батона и сливочного масла; для сочности ложка сметаны 15 % вместо сала или сливок; без панировки.","mode":"cook","name":"Рыбные котлеты из минтая в духовке (рубленые)","notes":"Минтай можно заменить охлаждённым филе хека или трески — тогда размораживать не нужно, купить в день готовки. Мясорубка не нужна. Сметана — общая пачка 15 % недели; укроп — общий пучок недели (если закончился, новую пачку ради котлет не брать — без укропа тоже вкусно). Яйца — из общего лотка.","portion":{},"reheat":"Разогревать только свою порцию: микроволновка 600–700 Вт 1,5–2 минуты под крышкой, сбрызнув 1 ч. л. воды (через минуту перевернуть); или духовка 180 °C 8–10 минут под фольгой. Повторно не разогревать. Из морозилки: микроволновка 2 мин под крышкой или духовка 180 °C 8–10 мин под фольгой. Рыбу в морозилке держи не дольше 2 недель.","role":"main","steps":[{"active":false,"eq":["bowl","fridge","freezer","container"],"est":false,"info":true,"min":0,"min_text":null,"t":"Готовится в день первого приёма партией на 2 приёма (ужин и обед на следующий день, ему — в контейнер). Вес рыбы и остальных продуктов на всю партию — в таблице «Вся партия». Минтай купить накануне и сразу переложить на тарелку или в миску на полку холодильника — за ночь и полдня он разморозится. В морозилку не убирать. Гарнир — отдельным компонентом дня.","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":4,"min_text":null,"t":"Слейте с размороженного филе воду, промокните его бумажными полотенцами и слегка отожмите руками. Прощупайте пальцами и удалите случайные косточки.","when":"day_of"},{"active":true,"eq":["mc","board","blender","bowl"],"est":true,"info":false,"min":6,"min_text":3,"t":"Нарежьте филе полосками 1 см, затем поперёк мелким кубиком и порубите ножом ещё 2–3 минуты до кусочков 3–5 мм — получится рубленый фарш с текстурой. Если есть чаша-измельчитель для блендера, можно измельчить короткими импульсами 5–6 раз (не в пюре: котлеты станут резиновыми). Переложите в большую миску.","when":"day_of"},{"active":true,"eq":["board","grater"],"est":true,"info":false,"min":4,"min_text":null,"t":"Лук нарежьте очень мелким кубиком или натрите на мелкой тёрке. Укроп мелко порубите. Добавьте к рыбе.","when":"day_of"},{"active":false,"eq":[],"est":true,"info":false,"min":45,"min_text":90,"t":"Вбейте яйца, добавьте манку, сметану, соль (на 2 пачки рыбы ≈ 1,5 ч. л. без горки) и перец. Вымешивайте рукой или ложкой 1–2 минуты, пока фарш не станет однородным и липким. Оставьте на 15 минут: манка набухнет, фарш загустеет и будет хорошо держать форму.","when":"day_of"},{"active":true,"eq":["oven"],"est":true,"info":false,"min":4,"min_text":null,"t":"Пока фарш стоит, включите духовку на 200 °C (верх-низ) и застелите противень пергаментом.","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":12,"min_text":5,"t":"Смочите руки холодной водой и сформуйте котлеты по ~90 г (размером с ладонь, толщиной 1,5–2 см). Если фарш расползается, вмешайте ещё 1 ст. л. манки и подождите 5 минут. Выкладывайте на пергамент на расстоянии 2 см. Смажьте верх котлет маслом кисточкой (или пальцами, обмакнув их в масло).","when":"day_of"},{"active":false,"eq":["oven"],"est":false,"info":false,"min":20,"min_text":20,"t":"Запекайте на средней решётке при 200 °C 20 минут, затем аккуратно переверните лопаткой и запекайте ещё 7–10 минут до румяной корочки. Готовность: внутри котлета белая и непрозрачная, при нажатии выделяется прозрачный сок.","when":"day_of"},{"active":false,"eq":["fridge","container"],"est":false,"info":false,"min":30,"min_text":30,"t":"Котлеты на ужин подавайте сразу с гарниром из меню дня (вес порции — в карточке дня). Остальные остудите на противне 20–30 минут, переложите в контейнер с крышкой и уберите в холодильник.","when":"day_of"},{"active":false,"eq":["freezer","container"],"est":false,"freeze_step":true,"info":true,"min":0,"min_text":null,"t":"Заморозка (рыбные котлеты): порции, которые не съедят в ближайшие 2 суток, сразу уйдут в морозилку. Остуди (не дольше 2 часов на столе), разложи по порциям в плоские зип-пакеты или контейнеры: одна порция = один приём пищи одного человека, на пакете подпиши блюдо и дату. Пакеты клади в морозилку плоско, после замерзания ставь стопкой или на ребро. Срок в морозилке — до 14 суток. Накануне вечером переложи нужную порцию из морозилки на полку холодильника (на ночь), утром она готова к разогреву. Если забыла — микроволновка в режиме разморозки 5–6 мин.","when":"day_of"}],"storage":"Готовишь большой партией. В холодильнике в закрытом контейнере до 2 суток — столько, сколько съедят в ближайшие приёмы; остальное сразу после остывания в морозилку (до 14 суток). Заморозка: Остуди (не дольше 2 часов на столе), разложи по порциям в плоские зип-пакеты или контейнеры: одна порция = один приём пищи одного человека, на пакете подпиши блюдо и дату. Пакеты клади в морозилку плоско, после замерзания ставь стопкой или на ребро.  Накануне вечером переложи нужную порцию из морозилки на полку холодильника (на ночь), утром она готова к разогреву. Если забыла — микроволновка в режиме разморозки 5–6 мин.","tags":["work_ok","oven","mc"],"total_min":75},"fricassee_chicken":{"active_min":25,"base":{"c":13,"f":11.9,"g":280,"kcal":319,"p":40.6},"batch":{"cook":"evening_before","freeze_d":21,"keeps_d":3,"mode":"cook"},"eq":["board","bowl","container","freezer","fridge","pot","stove"],"eq_text":["плита","широкая кастрюля 3–4 л или сотейник с крышкой","миска или стакан для соуса","венчик или вилка","лопатка","нож и доска","контейнеры с крышками"],"in_menu":true,"ing":[{"g":150,"id":"chicken_fillet","note":"филе грудки, кусками 3 см"},{"g":70,"id":"champignons","note":"четвертинками"},{"g":30,"id":"onion","note":"мелким кубиком"},{"g":20,"id":"carrot","note":"кружочками 3–4 мм"},{"g":30,"id":"sour_cream_15","note":""},{"g":60,"id":"milk_25","note":""},{"g":4,"id":"wheat_flour","note":"развести в холодном молоке, не жарить"},{"g":3,"id":"lemon","note":"сок, в конце: классическая кислинка фрикасе"},{"g":0.05,"id":"nutmeg","note":"щепотка"},{"g":0.1,"id":"bay_leaf","note":""},{"g":2,"id":"dill","note":"к подаче"},{"g":0.8,"id":"sunflower_oil","note":"на лук"},{"g":2,"id":"salt","note":""},{"g":0.2,"id":"black_pepper","note":"молотый белый или чёрный"},{"g":0.4,"id":"thyme","note":"к курице; мягкая специя, не острая"},{"g":0.3,"id":"basil_dried","note":"в соус; мягкая специя, не острая"}],"keeps_d":3,"light":"Классическое фрикасе делают на сливках 20–33 % со сливочной мучной заправкой; здесь соус на молоке 2,5 % и сметане 15 %, мука разводится в холодном молоке, а не обжаривается в масле. Курица припускается в воде, масла 1 ч. л. на всю партию, грибы жарятся без масла.","mode":"cook","name":"Фрикасе из курицы с шампиньонами","notes":"К рису (белый соус, без томатов — сочетать можно) или к пюре. Сметана — общая пачка 15 % недели. Порции подгоняет программа: ему больше курицы, ей меньше гарнира.","portion":{},"reheat":"Добавить 1–2 ст. л. воды или молока, крышку неплотно, микроволновка 2 мин на 600–800 Вт, перемешать на середине. Из морозилки: Заморозь вместе с соусом. Разогрев: кастрюлька на малом огне 6–8 мин, помешивая; соус может расслоиться — размешай, при необходимости добавь ложку молока.","role":"main","steps":[{"active":false,"eq":["container"],"est":false,"info":true,"min":0,"min_text":null,"t":"Готовится вечером накануне или в день первого приёма партией на 2 приёма (ему — в контейнер), к рису или пюре отдельным компонентом; хранится до 3 суток. Вес продуктов на всю партию — в таблице «Вся партия».","when":"day_of"},{"active":true,"eq":["pot","stove","bowl"],"est":true,"info":false,"min":6,"min_text":7,"t":"Прогрей кастрюлю на сильном огне, выложи шампиньоны без масла и жарь 6–7 мин, помешивая, пока вода не выпарится и грибы не подрумянятся. Переложи в миску.","when":"day_of"},{"active":false,"eq":["pot","stove"],"est":true,"info":false,"min":20,"min_text":60,"t":"В ту же кастрюлю налей 1 ч. л. масла, выложи лук и морковь с 3 ст. л. воды, накрой и томи на среднем огне 6 мин до мягкости. Лук не должен румяниться: фрикасе — белое рагу.","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":13,"min_text":10,"t":"Выложи курицу, посоли, добавь лавровый лист и 200 мл горячей воды. Доведи до кипения, убавь до слабого, накрой и припускай 10 мин, перемешав один раз: курица станет белой и мягкой.","when":"day_of"},{"active":true,"eq":["pot","bowl"],"est":true,"info":false,"min":1,"min_text":null,"t":"В миске размешай муку с холодным молоком до гладкости, затем вмешай сметану, мускат и перец. Верни грибы в кастрюлю, влей соус тонкой струйкой, помешивая.","when":"day_of"},{"active":true,"eq":["pot","stove"],"est":true,"info":false,"min":4,"min_text":5,"t":"Доведи до едва заметного кипения и томи на слабом огне без крышки 4–5 мин, помешивая, пока соус не станет густым, как жидкая сметана. Бурно не кипяти, чтобы сметана не свернулась.","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":1,"min_text":null,"t":"Вынь лавровый лист, добавь лимонный сок, попробуй и досоли. Укроп — при подаче.","when":"day_of"},{"active":false,"eq":["fridge","container"],"est":true,"info":false,"min":20,"min_text":40,"t":"Остуди без крышки 30–40 мин, разложи по контейнерам и убери в холодильник.","when":"day_of"},{"active":false,"eq":["freezer","container"],"est":false,"freeze_step":true,"info":true,"min":0,"min_text":null,"t":"Заморозка (фрикасе): порции, которые не съедят в ближайшие 3 суток, сразу уйдут в морозилку. Остуди (не дольше 2 часов на столе), разложи по порциям в плоские зип-пакеты или контейнеры: одна порция = один приём пищи одного человека, на пакете подпиши блюдо и дату. Пакеты клади в морозилку плоско, после замерзания ставь стопкой или на ребро. Срок в морозилке — до 21 суток. Накануне вечером переложи нужную порцию из морозилки на полку холодильника (на ночь), утром она готова к разогреву. Если забыла — микроволновка в режиме разморозки 5–6 мин.","when":"day_of"}],"storage":"Готовишь большой партией. В холодильнике в закрытом контейнере до 3 суток — столько, сколько съедят в ближайшие приёмы; остальное сразу после остывания в морозилку (до 21 суток). Заморозка: Остуди (не дольше 2 часов на столе), разложи по порциям в плоские зип-пакеты или контейнеры: одна порция = один приём пищи одного человека, на пакете подпиши блюдо и дату. Пакеты клади в морозилку плоско, после замерзания ставь стопкой или на ребро.  Накануне вечером переложи нужную порцию из морозилки на полку холодильника (на ночь), утром она готова к разогреву. Если забыла — микроволновка в режиме разморозки 5–6 мин.","tags":["work_ok"],"total_min":45},"frikadelki_tomato":{"active_min":30,"base":{"c":15.1,"f":7.4,"g":330,"kcal":297,"p":42.4},"batch":{"cook":"evening_before","freeze_d":21,"keeps_d":3,"mode":"cook"},"eq":["blender","board","bowl","container","freezer","fridge","grater","pan","pot","stove"],"eq_text":["плита","глубокая сковорода с крышкой или широкая кастрюля с крышкой (из тех, что есть дома)","погружной блендер с насадкой-измельчителем (или острый нож и доска)","миска","мелкая тёрка","нож и доска","чистая баночка с крышкой для остатка томатов","контейнеры с крышкой"],"in_menu":true,"ing":[{"g":100,"id":"chicken_fillet","note":"куриное филе куском; прокрутить на мясорубке в фарш при заготовке, фарш заморозить порциями"},{"g":70,"id":"chicken_fillet","note":"филе грудки на развес, ~280 г на партию; измельчить блендером или очень мелко порубить ножом и смешать с покупным фаршем; купить вместе с фаршем"},{"g":45,"id":"onion","note":"половину натереть в фарш, половину мелко нарезать в соус; на партию 2 средние луковицы"},{"id":"egg","note":"в фарш, 1 яйцо на всю партию","pcs":0.25},{"g":7,"id":"semolina","note":"связка вместо батона; на партию 3 ст. л. без горки (~28 г)"},{"g":25,"id":"carrot","note":"в соус, на мелкой тёрке; на партию 1 небольшая морковь (~100 г)"},{"g":55,"id":"tomatoes_canned","note":"на партию ~220 г из банки 400 г (чуть больше половины); остаток ~180 г пойдёт на соус для пиццы в Сб"},{"g":2,"id":"garlic","note":"в соус; на партию 2 зубчика"},{"g":1.2,"id":"sunflower_oil","note":"для овощей соуса, которые дальше томятся с водой; на партию 1 ч. л."},{"g":1,"id":"sugar","note":"обычный сахар, на партию неполная ч. л. (~4 г), чтобы смягчить кислинку томатов"},{"g":0.4,"id":"italian_herbs","note":"половину в фарш, половину в соус"},{"g":0.05,"id":"bay_leaf","note":"1 лист на партию"},{"g":2,"id":"salt","note":"половину в фарш, половину в соус; покупной фарш уже немного подсолен"},{"g":0.2,"id":"black_pepper","note":"молотый, в фарш"}],"keeps_d":3,"light":"Фарш из куриной грудки, в котором почти половину покупного фарша заменило рубленое филе грудки (в покупном фарше 10 г жира на 100 г, в филе меньше 3 г): белка больше, жира меньше, а мягкость фарша сохраняется. Связка из яйца и ложки манки вместо батона с молоком; фрикадельки не обжариваются, а сразу тушатся в соусе; соус из томатов в собственном соку без сливок, кетчупа и муки; масла 1 ч. л. на всю партию, овощи для соуса томятся с водой.","mode":"cook","name":"Фрикадельки из курицы в томатном соусе","notes":"Обеды Чт–Пт 1-й недели со спагетти и салатом капуста–морковь–кукуруза. Куриный фарш продаётся пачками по 400 г: на партию берётся 1 пачка целиком (сырой фарш хранится 1 день), а филе грудки на развес (~280 г) докупается там же. Банку томатов 400 г блюдо делит с пиццей в Сб: ~220 г во фрикадельки, ~180 г на соус для пиццы (там нужно ~140 г, лишний сок слить). Порции подгоняет программа: ему больше фрикаделек, ей меньше спагетти.","portion":{},"reheat":"В контейнере под неплотно закрытой крышкой 2–3 мин на 800 Вт, на середине перемешать, чтобы фрикадельки прогрелись до центра. Вместе со спагетти сбрызнуть 1 ст. л. воды. Из морозилки: Заморозь вместе с соусом. Разогрев: микроволновка 3 мин, перемешать на середине, или кастрюлька на малом огне 6–8 мин.","role":"main","steps":[{"active":false,"eq":["container"],"est":false,"info":true,"min":0,"min_text":null,"t":"Партия на 2 дня: готовится в Ср вечером на обеды Чт–Пт в контейнер, ей и ему (4 порции, его порции крупнее). Сколько взять на всю партию, видно в столбце «Вся партия». Ориентир на 4 порции: 1 пачка куриного фарша 400 г и ~280 г филе куриной грудки на развес (купить в этот же день), 1 яйцо, 3 ст. л. манки без горки, 2 средние луковицы, 1 небольшая морковь, ~220 г томатов из банки, 2 зубчика чеснока. Спагетти, рис к горбуше и пельмени на ужин варятся отдельно (свои партии) на соседних конфорках, пока фрикадельки тушатся.","when":"day_of"},{"active":true,"eq":["board","blender","bowl"],"est":true,"info":false,"min":5,"min_text":7,"t":"Филе. Обсушите филе полотенцем и нарежьте кусочками 2 см. Измельчите погружным блендером с насадкой-измельчителем в 2 захода, короткими импульсами 10–15 раз, до фарша. Если насадки нет, нарежьте филе тонкими пластинами, затем полосками и порубите ножом до кусочков 3–4 мм (5–7 мин). Переложите в миску к покупному фаршу.","when":"day_of"},{"active":false,"eq":["grater","bowl"],"est":true,"info":false,"min":35,"min_text":180,"t":"Фарш. Одну луковицу натрите на мелкой тёрке (или порубите как можно мельче) прямо в миску. Вбейте яйцо, всыпьте манку, половину соли (~2/3 ч. л.: покупной фарш уже подсолен), перец и половину итальянских трав. Вымешивайте рукой 2 мин, пока покупной фарш и рубленое филе не соединятся в однородную массу. Накройте миску и оставьте на 15 мин: манка набухнет, и фрикадельки не развалятся в соусе.","when":"day_of"},{"active":true,"eq":["board","grater"],"est":true,"info":false,"min":1,"min_text":null,"t":"Пока фарш стоит, займитесь соусом: вторую луковицу мелко нарежьте, морковь натрите на мелкой тёрке, чеснок мелко порубите.","when":"day_of"},{"active":true,"eq":["pan","stove"],"est":true,"info":false,"min":17,"min_text":60,"t":"В глубокой сковороде разогрейте 1 ч. л. масла на среднем огне. Выложите лук и морковь, перемешайте и сразу влейте 2 ст. л. воды. Готовьте 6–7 мин, помешивая, пока овощи не станут мягкими; если вода выпарилась и овощи начинают прилипать ко дну, добавьте ещё 1–2 ст. л. Добавьте чеснок и мешайте ещё 30 с.","when":"day_of"},{"active":true,"eq":["pan","stove","fridge"],"est":true,"info":false,"min":3,"min_text":5,"t":"Откройте банку томатов и отмерьте ~220 г (чуть больше половины банки). Остаток (~180 г) переложите в чистую баночку с крышкой и уберите в холодильник: это соус для пиццы в Сб. Влейте томаты в сковороду, добавьте 220 мл воды, сахар, оставшиеся соль и травы, лавровый лист. Доведите до кипения и варите на слабом огне 5 мин.","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":1,"min_text":null,"t":"Смочите руки холодной водой и скатайте фрикадельки размером с грецкий орех (по 35–40 г, получится около 20 штук). Руки время от времени снова смачивайте, тогда фарш не липнет.","when":"day_of"},{"active":false,"eq":["pan","stove"],"est":false,"info":false,"min":20,"min_text":20,"t":"Опустите фрикадельки в кипящий соус, по возможности в один слой (если все не помещаются, остальные положите сверху). Первые 5 мин их не трогайте, чтобы они схватились, затем аккуратно переверните ложкой или покачайте сковороду. Накройте крышкой и тушите на слабом огне 20 мин, один раз перевернув.","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":3,"min_text":5,"t":"Проверьте готовность: разрежьте самую крупную фрикадельку. Внутри она должна быть белой, без розового, сок прозрачный. Если соус слишком жидкий, последние 5 мин тушите без крышки. Попробуйте соус и при необходимости досолите. Выньте лавровый лист.","when":"day_of"},{"active":false,"eq":["fridge","container"],"est":false,"info":false,"min":30,"min_text":30,"t":"Остудите без крышки 30 мин, разложите фрикадельки вместе с соусом в контейнер и уберите в холодильник. Утром Чт и Пт кладите свою порцию в рабочий контейнер вместе со спагетти, соус сверху: так макароны и фрикадельки не пересохнут.","when":"day_of"},{"active":false,"eq":["freezer","container"],"est":false,"freeze_step":true,"info":true,"min":0,"min_text":null,"t":"Заморозка (фрикадельки): порции, которые не съедят в ближайшие 3 суток, сразу уйдут в морозилку. Остуди (не дольше 2 часов на столе), разложи по порциям в плоские зип-пакеты или контейнеры: одна порция = один приём пищи одного человека, на пакете подпиши блюдо и дату. Пакеты клади в морозилку плоско, после замерзания ставь стопкой или на ребро. Срок в морозилке — до 21 суток. Накануне вечером переложи нужную порцию из морозилки на полку холодильника (на ночь), утром она готова к разогреву. Если забыла — микроволновка в режиме разморозки 5–6 мин.","when":"day_of"}],"storage":"Готовишь большой партией. В холодильнике в закрытом контейнере до 3 суток — столько, сколько съедят в ближайшие приёмы; остальное сразу после остывания в морозилку (до 21 суток). Заморозка: Остуди (не дольше 2 часов на столе), разложи по порциям в плоские зип-пакеты или контейнеры: одна порция = один приём пищи одного человека, на пакете подпиши блюдо и дату. Пакеты клади в морозилку плоско, после замерзания ставь стопкой или на ребро.  Накануне вечером переложи нужную порцию из морозилки на полку холодильника (на ночь), утром она готова к разогреву. Если забыла — микроволновка в режиме разморозки 5–6 мин.","tags":["work_ok"],"total_min":65},"fruit_banana":{"active_min":1,"base":{"c":24.1,"f":0.6,"g":115,"kcal":110,"p":1.7},"batch":{"cook":"same_day","keeps_d":3,"mode":"ready"},"eq":["container"],"eq_text":["пакет или контейнер (на работу)"],"in_menu":true,"ing":[{"g":115,"id":"banana","note":"1 средний банан ~170 г с кожурой, 115 г — мякоть"}],"keeps_d":3,"light":"Сладкий фрукт вместо батончика-«перекуса»: около 110 ккал и много калия.","mode":"ready","name":"Банан","notes":"Банан калорийнее груши или киви, поэтому в порции 1 банан, без добавок. Покупать поштучно на ближайшие дни.","portion":{"addon_min_g":70,"her":{"max_g":210},"him":{"max_g":250}},"reheat":"Не нужно.","role":"snack","steps":[{"active":true,"eq":[],"est":true,"info":false,"min":0,"min_text":null,"t":"Покупай бананы жёлтые, без зелени у хвостика, на 2–3 дня вперёд.","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":1,"min_text":20,"t":"Дома: очисти и ешь сразу; очищенный темнеет за 15–20 мин.","when":"day_of"},{"active":true,"eq":["container"],"est":true,"info":false,"min":0,"min_text":null,"t":"На работу: бери целым в жёстком контейнере или сверху сумки, чтобы не помялся.","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":0,"min_text":null,"t":"Ешь с йогуртом или бутербродом: банан сытнее груши и киви, но белка в нём почти нет.","when":"day_of"}],"storage":"При комнатной температуре 3–4 дня, не в холодильнике (кожура чернеет). Отдельно от других фруктов — рядом они быстрее перезревают.","tags":["work_ok","ready"],"total_min":1},"fruit_kiwi":{"active_min":2,"base":{"c":13.4,"f":0.8,"g":130,"kcal":62,"p":1.3},"batch":{"cook":"same_day","keeps_d":3,"mode":"ready"},"eq":["board","container"],"eq_text":["нож","чайная ложка","контейнер (на работу)"],"in_menu":true,"ing":[{"g":130,"id":"kiwi","note":"2 киви по ~75 г целиком, 130 г — мякоть без кожуры"}],"keeps_d":3,"light":"Кисло-сладкий фрукт с витамином C и клетчаткой примерно за 60–80 ккал вместо сладостей.","mode":"ready","name":"Киви","notes":"Киви хорошо хранятся в холодильнике, можно брать упаковкой на неделю. В граммах указана мякоть без кожуры.","portion":{"addon_min_g":70,"her":{"max_g":210},"him":{"max_g":250}},"reheat":"Не нужно.","role":"snack","steps":[{"active":true,"eq":[],"est":true,"info":false,"min":2,"min_text":null,"t":"Выбирай киви, слегка мягкие при нажатии; твёрдые дозреют 2–3 дня при комнатной температуре (быстрее — в пакете рядом с бананом).","when":"day_of"},{"active":true,"eq":["board"],"est":true,"info":false,"min":0,"min_text":null,"t":"Дома: разрежь киви пополам поперёк и выедай мякоть чайной ложкой, или срежь кожуру ножом и нарежь кружками.","when":"day_of"},{"active":true,"eq":["board"],"est":true,"info":false,"min":0,"min_text":null,"t":"На работу: бери целыми, нож и ложка там есть. Очищенные киви за полдня становятся водянистыми.","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":0,"min_text":null,"t":"Ему — 3 киви, если в порции по таблице больше 130 г.","when":"day_of"}],"storage":"Спелые — в холодильнике до 1–2 недель; твёрдые дозревают при комнатной температуре 2–3 дня.","tags":["work_ok","ready"],"total_min":2},"fruit_mandarin":{"active_min":1,"base":{"c":9,"f":0.2,"g":120,"kcal":40,"p":1},"batch":{"cook":"same_day","keeps_d":3,"mode":"ready"},"eq":["container"],"eq_text":["пакет или контейнер (на работу)"],"in_menu":true,"ing":[{"g":120,"id":"mandarin","note":"2 средних мандарина или апельсина по ~80 г целиком, 120 г — дольки без кожуры"}],"keeps_d":3,"light":"Сезонный зимний фрукт: сладко и сочно примерно за 50–60 ккал за два мандарина или апельсина.","mode":"ready","name":"Мандарины/апельсины (2 шт.)","notes":"Покупать на вес на неделю, выбирать без косточек. Хорошо в пару к йогурту или бутерброду.","portion":{"addon_min_g":70,"her":{"max_g":210},"him":{"max_g":250}},"reheat":"Не нужно.","role":"snack","steps":[{"active":true,"eq":[],"est":true,"info":false,"min":1,"min_text":null,"t":"Вымой мандарины или апельсины под тёплой водой и вытри: кожура контактирует с руками, когда чистишь.","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":0,"min_text":null,"t":"Дома: очисти и раздели на дольки, белые волокна можно не снимать — в них клетчатка.","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":0,"min_text":null,"t":"На работу: бери неочищенными, 2–3 штуки в пакете. Очищенные подсыхают за пару часов.","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":0,"min_text":null,"t":"Ей — 2 мандарина (или апельсина), ему — 3 (по весу порции из таблицы).","when":"day_of"}],"storage":"В холодильнике в ящике для фруктов до 1–2 недель; при комнатной температуре — 5–7 дней. Мягкие и с пятнами съесть первыми.","tags":["work_ok","ready"],"total_min":2},"fruit_pear":{"active_min":1,"base":{"c":17.4,"f":0.5,"g":160,"kcal":67,"p":0.6},"batch":{"cook":"same_day","keeps_d":3,"mode":"ready"},"eq":["board","container","fridge"],"eq_text":["нож и доска","бумажный пакет или контейнер (на работу)"],"in_menu":true,"ing":[{"g":160,"id":"pear","note":"1 средняя груша ~170–180 г целиком, 160 г — без хвостика и сердцевины"}],"keeps_d":3,"light":"Свежий фрукт вместо сухофруктов и сладкой выпечки: клетчатка и сладость примерно за 70–80 ккал.","mode":"ready","name":"Груша","notes":"Покупать 2–3 груши на день-два вперёд: спелые быстро перезревают. Хорошо в пару к йогурту.","portion":{"addon_min_g":70,"her":{"max_g":210},"him":{"max_g":250}},"reheat":"Не нужно.","role":"snack","steps":[{"active":true,"eq":[],"est":true,"info":false,"min":0,"min_text":null,"t":"Вымой грушу под тёплой водой и вытри полотенцем.","when":"day_of"},{"active":true,"eq":[],"est":true,"info":false,"min":0,"min_text":null,"t":"Дома: разрежь на 4 дольки и вырежь сердцевину, либо ешь целиком.","when":"day_of"},{"active":true,"eq":["board","container"],"est":true,"info":false,"min":1,"min_text":30,"t":"На работу: бери целой в бумажном пакете или контейнере, чтобы не помялась; нарезанная темнеет за 20–30 мин.","when":"day_of"},{"active":true,"eq":["fridge"],"est":true,"info":false,"min":0,"min_text":null,"t":"Твёрдую грушу оставь на 1–2 дня при комнатной температуре — дозреет и станет сочной; спелую (мягкую у хвостика) — в холодильник.","when":"day_of"}],"storage":"Спелые — в холодильнике в ящике для овощей 5–7 дней; твёрдые дозревают 1–3 дня при комнатной температуре.","tags":["work_ok","ready"],"total_min":2},"green_beans_side":{"active_min":8,"base":{"c":10.9,"f":3.3,"g":170,"kcal":83,"p":2.6},"batch":{"cook":"evening_before","keeps_d":3,"mode":"cook"},"eq":["board","bowl","pot","stove"],"eq_text":["плита","кастрюля с крышкой","нож и доска","миска"],"in_menu":true,"ing":[{"g":120,"id":"green_beans_frozen","note":"не размораживать"},{"g":40,"id":"carrot","note":"кружками 5 мм"},{"g":3,"id":"olive_oil","note":"сбрызнуть готовые овощи"},{"g":1,"id":"garlic","note":"через пресс в масло"},{"g":3,"id":"lemon","note":"сок"},{"g":1,"id":"salt","note":""}],"keeps_d":3,"light":"Овощи варятся недолго, масло только для вкуса: так мягче для желудка и меньше калорий.","mode":"cook","name":"Стручковая фасоль с морковью и чесноком (гарнир)","notes":"Небольшой гарнир к курице, картошке или гречке. Стручковая фасоль не зерновая, поэтому запрета не касается.","portion":{"her":{"max_g":120},"him":{"max_g":160}},"reheat":"Микроволновка под крышкой 1 мин; салат ешь холодным.","role":"side","steps":[{"active":false,"eq":["board"],"est":false,"info":true,"min":0,"min_text":null,"t":"Морковь почисти и нарежь кружками 5 мм. Фасоль не размораживай.","when":"day_of"},{"active":true,"eq":["pot","stove"],"est":true,"info":false,"min":0,"min_text":11,"t":"В кастрюле вскипяти воду, посоли. Опусти морковь на 3 мин, затем замороженную фасоль и вари под крышкой 7–8 мин, пока стручки не станут мягкими, но яркими.","when":"day_of"},{"active":true,"eq":["bowl"],"est":true,"info":false,"min":2,"min_text":120,"t":"Слей воду, переложи в миску, добавь масло с чесноком, лимонный сок и соль. Перемешай, подавай тёплой.","when":"day_of"}],"storage":"В закрытом контейнере в холодильнике до 2 суток.","tags":["work_ok"],"total_min":15},"gulyash_mc":{"active_min":20,"base":{"c":16.2,"f":10.2,"g":240,"kcal":269,"p":29},"batch":{"cook":"evening_before","freeze_d":21,"keeps_d":3,"mode":"cook"},"eq":["board","container","freezer","fridge","grater","mc"],"eq_text":["мультиварка Cuckoo CMC-CHSS1004F","нож и доска","крупная тёрка","мерный стакан","стакан для муки с водой","силиконовая или деревянная лопатка (не царапать чашу)","контейнеры с крышками"],"in_menu":true,"ing":[{"g":155,"id":"beef_shoulder","note":"мякоть лопатки (рынок или магазин), без плёнок и видимого жира, кубиком 3 см"},{"g":50,"id":"onion","note":"тонкими полукольцами"},{"g":30,"id":"carrot","note":"на крупной тёрке"},{"g":25,"id":"bell_pepper","note":"сладкий, квадратиками 2 см (по-венгерски)"},{"g":12,"id":"tomato_paste","note":"развести в воде для заливки"},{"g":1.5,"id":"paprika_sweet","note":""},{"g":3,"id":"garlic","note":"мелко, в конце"},{"g":4,"id":"wheat_flour","note":"только для загустения: развести в холодной воде"},{"g":0.1,"id":"bay_leaf","note":""},{"g":2,"id":"salt","note":"часть в конце по вкусу"},{"g":0.3,"id":"black_pepper","note":"молотый"},{"g":0.5,"id":"coriander_ground","note":"к мясу; мягкая специя, не острая"},{"g":0.3,"id":"thyme","note":"в конце; мягкая специя, не острая"},{"g":0.4,"id":"cumin","note":"зира к мясу; мягкая специя, не острая"}],"keeps_d":3,"light":"Нежирная лопатка с срезанным жиром и совсем без масла: под давлением мясо мягкое за 40 мин без обжарки. Нет мучной зажарки: мука разводится холодной водой и только загущает соус. Вкус дают томатная паста, паприка, много лука и сладкий перец.","mode":"cook","name":"Гуляш из говядины в мультиварке","notes":"К гречке, пюре или макаронам; не к рису (томатный соус). Отложенный старт «Таймер» с сырым мясом не используй. Если партия не помещается до отметки 2/3 чаши, раздели на 2 закладки. Порции подгоняет программа: ему больше мяса, ей меньше гарнира.","portion":{},"reheat":"С гарниром в контейнере, крышка неплотно, микроволновка 2–3 мин на 800 Вт, перемешать на середине; если соус загустел — 1 ст. л. воды. Из морозилки: Заморозь вместе с соусом. Гарнир не замораживай: свари свежий. Разогрев: микроволновка 3 мин, перемешать на середине, или кастрюлька 6–8 мин на малом огне.","role":"main","steps":[{"active":false,"eq":["mc","fridge","freezer","container"],"est":false,"info":true,"min":0,"min_text":null,"t":"Готовится вечером накануне или в день первого приёма партией на 2–3 приёма (ему — в контейнер), хранится до 3 суток. Вес продуктов на всю партию — в таблице «Вся партия». Если говядина куплена на рынке заранее — в день покупки разложи её порционно по пакетам, заморозь сырой плоско и разморозь в холодильнике в ночь перед готовкой. Без масла: в мультиварке под давлением мясо томится в собственном соку.","when":"day_of"},{"active":true,"eq":["board","grater"],"est":true,"info":false,"min":1,"min_text":null,"t":"Говядину обсуши, срежь плёнки и жир, нарежь кубиками 3 см. Лук — тонкими полукольцами, морковь натри, перец — квадратиками.","when":"day_of"},{"active":true,"eq":["mc"],"est":true,"info":false,"min":16,"min_text":90,"t":"В чашу выложи лук, морковь и перец, сверху мясо, 1,5 ч. л. соли, перец и лавровый лист. В мерном стакане размешай томатную пасту и паприку с 350 мл горячей воды и влей в чашу: жидкость должна почти покрыть мясо. Заполнение — не больше 2/3 чаши.","when":"day_of"},{"active":false,"eq":["mc"],"est":false,"info":false,"min":40,"min_text":40,"t":"Закрой крышку: ручку поверни в «Открыто», опусти крышку, поверни ручку в «Закрыто». Колесом «Меню/Выбор» выбери «Мультиповар», нажми «Ввод», колесом выставь 120 °C, «Ввод», время 40 мин, «Ввод», нажми «Варка/Турбо» (под давлением).","when":"day_of"},{"active":false,"eq":["mc"],"est":false,"info":false,"min":15,"min_text":15,"t":"После сигнала пар выходит сам за 10–15 мин; ручку силой не крути. Если торопишься — удерживай «Отмена» 2 с для сброса пара. Открывай, когда ручка свободно поворачивается в «Открыто». Мясо готово, если кубик легко разламывается вилкой; если туговато — ещё 10 мин «Мультиповар» 120 °C.","when":"day_of"},{"active":true,"eq":["mc"],"est":true,"info":false,"min":3,"min_text":5,"t":"В стакане размешай муку со 100 мл холодной воды без комочков. Влей тонкой струйкой в гуляш, помешивая, добавь чеснок. Закрой крышку, «Мультиповар» 100 °C 5 мин и сразу после «Варка/Турбо» нажми «Настройки» (без давления): соус загустеет.","when":"day_of"},{"active":false,"eq":["mc","fridge","container"],"est":false,"info":false,"min":40,"min_text":40,"t":"Вынь лавровый лист, попробуй и досоли. Оставь в открытой чаше остывать 30–40 мин, разложи по контейнерам и убери в холодильник. Не оставляй гуляш в мультиварке на подогреве на ночь.","when":"day_of"},{"active":false,"eq":["freezer","container"],"est":false,"freeze_step":true,"info":true,"min":0,"min_text":null,"t":"Заморозка (гуляш): порции, которые не съедят в ближайшие 3 суток, сразу уйдут в морозилку. Остуди (не дольше 2 часов на столе), разложи по порциям в плоские зип-пакеты или контейнеры: одна порция = один приём пищи одного человека, на пакете подпиши блюдо и дату. Пакеты клади в морозилку плоско, после замерзания ставь стопкой или на ребро. Срок в морозилке — до 21 суток. Накануне вечером переложи нужную порцию из морозилки на полку холодильника (на ночь), утром она готова к разогреву. Если забыла — микроволновка в режиме разморозки 5–6 мин.","when":"day_of"}],"storage":"Готовишь большой партией. В холодильнике в закрытом контейнере до 3 суток — столько, сколько съедят в ближайшие приёмы; остальное сразу после остывания в морозилку (до 21 суток). Заморозка: Остуди (не дольше 2 часов на столе), разложи по порциям в плоские зип-пакеты или контейнеры: одна порция = один приём пищи одного человека, на пакете подпиши блюдо и дату. Пакеты клади в морозилку плоско, после замерзания ставь стопкой или на ребро.  Накануне вечером переложи нужную порцию из морозилки на полку холодильника (на ночь), утром она готова к разогреву. Если забыла — микроволновка в режиме разморозки 5–6 мин.","tags":["work_ok","mc"],"total_min":85},"indeyka_ovoshchi":{"active_min":20,"base":{"c":15.7,"f":9.4,"g":305,"kcal":304,"p":39.9},"batch":{"cook":"evening_before","freeze_d":21,"keeps_d":3,"mode":"cook"},"eq":["board","bowl","container","freezer","fridge","oven","stove"],"eq_text":["духовка","форма для запекания (примерно 30×20 см) или глубокий противень","фольга","большая миска","нож и доска","контейнер с крышкой"],"in_menu":true,"ing":[{"g":160,"id":"chicken_fillet","note":"филе грудки без кожи (эскалоп), кусочками ~3 см"},{"g":80,"id":"zucchini","note":"кубиком 2 см"},{"g":40,"id":"bell_pepper","note":"полосками 1 см"},{"g":35,"id":"carrot","note":"кружками 0,5 см"},{"g":35,"id":"onion","note":"полукольцами"},{"g":25,"id":"champignons","note":"пластинками; остаток пачки — в другие блюда недели с грибами в течение 3 дней"},{"g":35,"id":"tomatoes_canned","note":"вместе с соком; остаток в баночке под крышкой до 3 дней"},{"g":2,"id":"garlic","note":"мелко порубить"},{"g":4,"id":"sunflower_oil","note":""},{"g":0.5,"id":"paprika_sweet","note":"на курицу"},{"g":0.3,"id":"italian_herbs","note":"на овощи"},{"g":0.05,"id":"bay_leaf","note":"1–2 листа"},{"g":2,"id":"salt","note":"половину на курицу, половину на овощи"},{"g":0.2,"id":"black_pepper","note":"молотый"},{"g":0.4,"id":"thyme","note":"к мясу; мягкая специя, не острая"},{"g":0.4,"id":"coriander_ground","note":"к мясу; мягкая специя, не острая"},{"g":1.2,"id":"chicken_turkey_seasoning","note":"к мясу вместо части соли; в смеси может быть соль, пробуй до досаливания"}],"keeps_d":3,"light":"Куриное филе без кожи, одно из самых постных видов мяса; ничего не обжаривается, всё тушится в собственном соку под фольгой; курица добавляется к уже прогретым овощам, поэтому не пересыхает; масла около 4 г на порцию (1 ч. л.); овощей и грибов по объёму больше, чем мяса; без сливок, сметаны и баклажанов.","mode":"cook","name":"Курица, тушённая с овощами и грибами","notes":"С гречкой и сметаной. Открытую банку томатов хранить в баночке под крышкой в холодильнике не дольше 3 дней. Кабачок в этом меню нужен только здесь — брать по весу из таблицы.","portion":{},"reheat":"Порцию с соусом в тарелке под крышкой 2–3 мин на 800 Вт, на середине перемешать. Можно греть на одной тарелке с гречкой. Из морозилки: Заморозь вместе с соусом. Разогрев: микроволновка 3 мин или кастрюлька 6–8 мин на малом огне.","role":"main","steps":[{"active":false,"eq":["oven","stove","fridge","freezer","container"],"est":false,"info":true,"min":0,"min_text":null,"t":"Готовится вечером накануне первого приёма партией на 2–3 приёма (ему — в контейнер), хранится до 3 суток. Вес продуктов на всю партию — в таблице «Вся партия». Блюдо тушится в духовке, а на плите в это время можно сварить гарнир. Сначала в духовку идут овощи, через 15 мин к ним добавляется курица; остальное готовь, пока форма в духовке. Курицу из морозилки разморозь в холодильнике за ночь.","when":"day_of"},{"active":true,"eq":["oven"],"est":true,"info":false,"min":1,"min_text":null,"t":"Включите духовку на 200 °C (режим верх-низ).","when":"day_of"},{"active":true,"eq":["board"],"est":true,"info":false,"min":1,"min_text":null,"t":"Подготовьте овощи: лук нарежьте полукольцами, морковь кружками 0,5 см, перец полосками 1 см, кабачок кубиками 2 см (молодой можно не чистить), шампиньоны пластинками, чеснок мелко порубите.","when":"day_of"},{"active":false,"eq":["oven"],"est":true,"info":false,"min":45,"min_text":180,"t":"Овощи сложите в форму: лук и морковь вниз (им нужно больше времени), сверху перец, кабачок и грибы. Посолите половиной соли, посыпьте итальянскими травами, полейте 3 ч. л. масла и перемешайте руками прямо в форме. Плотно накройте фольгой, прижав края, и поставьте на средний уровень разогретой духовки на 15 мин.","when":"day_of"},{"active":true,"eq":["board","bowl"],"est":true,"info":false,"min":13,"min_text":120,"t":"Пока овощи тушатся, курицу обсушите бумажным полотенцем и нарежьте кусочками около 3 см (эскалоп нарезан пластами: режьте каждый пласт на квадраты 3×3 см). В большой миске перемешайте её с остатком соли, перцем, паприкой, чесноком и 2 ч. л. масла.","when":"day_of"},{"active":false,"eq":["oven"],"est":false,"info":false,"min":25,"min_text":25,"t":"Достаньте форму и осторожно снимите фольгу, отогнув дальний от себя край: выйдет горячий пар. Перемешайте овощи, сверху разложите курицу в один слой, полейте томатами из банки вместе с соком и положите лавровый лист. Если томатов осталось меньше 200 г, добавьте 50–100 мл воды. Снова плотно накройте фольгой и верните в духовку на 25 мин.","when":"day_of"},{"active":true,"eq":["oven"],"est":true,"info":false,"min":5,"min_text":10,"t":"Проверьте готовность: разрежьте самый крупный кусочек курицы. Внутри он должен быть белым, без розового, сок прозрачный; если нет, ещё 5–10 мин под фольгой. Если жидкости очень много, снимите фольгу и подержите форму в духовке ещё 10 мин, чтобы соус уварился. Дольше не держите: куриная грудка быстро пересыхает.","when":"day_of"},{"active":false,"eq":["fridge","container"],"est":false,"info":false,"min":30,"min_text":30,"t":"Выньте лавровый лист. Остудите без крышки 30 мин, разложите по контейнерам вместе с соусом (гарнир рядом) и уберите в холодильник. Сметану к блюду — в маленькую баночку отдельно, добавить после разогрева.","when":"day_of"},{"active":false,"eq":["freezer","container"],"est":false,"freeze_step":true,"info":true,"min":0,"min_text":null,"t":"Заморозка (тушёную курицу с овощами): порции, которые не съедят в ближайшие 3 суток, сразу уйдут в морозилку. Остуди (не дольше 2 часов на столе), разложи по порциям в плоские зип-пакеты или контейнеры: одна порция = один приём пищи одного человека, на пакете подпиши блюдо и дату. Пакеты клади в морозилку плоско, после замерзания ставь стопкой или на ребро. Срок в морозилке — до 21 суток. Накануне вечером переложи нужную порцию из морозилки на полку холодильника (на ночь), утром она готова к разогреву. Если забыла — микроволновка в режиме разморозки 5–6 мин.","when":"day_of"}],"storage":"Готовишь большой партией. В холодильнике в закрытом контейнере до 3 суток — столько, сколько съедят в ближайшие приёмы; остальное сразу после остывания в морозилку (до 21 суток). Заморозка: Остуди (не дольше 2 часов на столе), разложи по порциям в плоские зип-пакеты или контейнеры: одна порция = один приём пищи одного человека, на пакете подпиши блюдо и дату. Пакеты клади в морозилку плоско, после замерзания ставь стопкой или на ребро.  Накануне вечером переложи нужную порцию из морозилки на полку холодильника (на ночь), утром она готова к разогреву. Если забыла — микроволновка в режиме разморозки 5–6 мин.","tags":["work_ok","oven"],"total_min":65},"kotlety_oven":{"active_min":20,"base":{"c":14,"f":9.5,"g":165,"kcal":266,"p":31.4},"batch":{"cook":"evening_before","freeze_d":21,"keeps_d":3,"mode":"cook","sunday_prep":true},"eq":["blender","board","bowl","container","freezer","fridge","grater","oven","stove"],"eq_text":["духовка","противень","пергамент","фольга","большая миска","мелкая тёрка или погружной блендер с насадкой-измельчителем","контейнер с крышкой"],"in_menu":true,"ing":[{"g":70,"id":"beef_shoulder","note":"говядина куском (нежирная лопатка); прокрутить на мясорубке в фарш при заготовке, фарш заморозить порциями"},{"g":70,"id":"chicken_fillet","note":"куриное филе куском; прокрутить на мясорубке в фарш при заготовке, фарш заморозить порциями"},{"g":35,"id":"onion","note":"натереть на мелкой тёрке или измельчить блендером: много лука
